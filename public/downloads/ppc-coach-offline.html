<script>
/* ================= CORE ================= */
const IMG = {
  logo:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1454586fe-d415-465f-b36d-1ccd28255660.png",
  hero:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1a8d96df3-20f4-4e5b-b56d-d1705f5f0e80.png",
  coach:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/163fc5120-0387-4fd1-abba-76a434d9ee25.png",
  market:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/126c76305-a39a-4c76-864f-ae21beb3a914.png",
  auction:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1ddc9c1b1-fec5-46f3-8fee-ea240684f102.png",
  listing:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/167723db7-b9e5-4e70-8eff-4ce3a8ce7fd2.png",
  keywords:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1f06a5489-3268-46c5-8b53-dc262e22550d.png",
  reporting:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/149aeccd5-72e3-43a9-b827-5f3dd32c25f7.png",
  va:"https://image.qwenlm.ai/public_source/d80161d4-a539-4d7d-ad02-e4820ce49448/1229de91a-190a-4ff7-a7c6-1bd7a0300077.png"
};
const LEVELS=[{xp:0,name:"Trainee"},{xp:100,name:"PPC Learner"},{xp:250,name:"PPC Helper"},{xp:450,name:"Junior Assistant"},{xp:700,name:"Campaign Assistant"},{xp:1000,name:"Competent Manager"}];
const SKEY="ppcCoachState_v2";
let state=loadState();
function loadState(){ try{const s=JSON.parse(localStorage.getItem(SKEY)); if(s) return s;}catch(e){} return {xp:0,done:[],quizScores:{},trainerBest:0,trainerDone:false,builderBest:0,builderDone:false,reportDone:false,coachAsked:false}; }
function save(){ localStorage.setItem(SKEY,JSON.stringify(state)); }
function levelFor(xp){ let i=0; for(let k=0;k<LEVELS.length;k++){ if(xp>=LEVELS[k].xp) i=k; } const cur=LEVELS[i],next=LEVELS[i+1]||null; return {i,name:cur.name,next,pct:next?Math.min(100,Math.round((xp-cur.xp)/(next.xp-cur.xp)*100)):100}; }
function toast(msg,type){ const root=document.getElementById("toastRoot"); const c={xp:"bg-navy text-white",level:"bg-emerald-600 text-white",info:"bg-white text-navy border border-slate-200",warn:"bg-red-600 text-white"}; const el=document.createElement("div"); el.className="toast rounded-xl shadow-card px-4 py-3 text-sm font-semibold flex items-center gap-2 "+(c[type]||c.info); el.innerHTML=(type==="xp"?"⚡":type==="level"?"🎉":type==="warn"?"⚠️":"")+"<span>"+msg+"</span>"; root.appendChild(el); setTimeout(()=>{el.style.transition="all .4s";el.style.opacity="0";el.style.transform="translateX(40px)";setTimeout(()=>el.remove(),400);},3400); }
function addXp(n,why){ const b=levelFor(state.xp).i; state.xp+=n; save(); toast("+"+n+" XP · "+why,"xp"); const a=levelFor(state.xp); if(a.i>b) setTimeout(()=>toast("Level up! You are now "+a.name,"level"),450); updateTopbar(); }
function updateTopbar(){ const L=levelFor(state.xp); document.getElementById("xpPill").textContent="⚡ "+state.xp+" XP"; document.getElementById("lvlPill").textContent="🎓 "+L.name; document.getElementById("sideLevel").textContent=L.name; document.getElementById("sideXpBar").style.width=L.pct+"%"; document.getElementById("sideXpTxt").textContent=L.next?state.xp+" / "+L.next.xp+" XP to "+L.next.name:state.xp+" XP · Top level!"; }

/* ================= COURSE CONTENT (12 modules, 40 lessons, 12 module quizzes + final exam) ================= */
const MODULES=[
{title:"Amazon Basics",icon:"🛒",color:"#FF9900",img:IMG.market,desc:"The marketplace, the listing, and why visibility is everything.",
lessons:[
{id:"m0l1",title:"What is Amazon Marketplace?",mins:6,blocks:[
 {t:"goal",x:"Understand what Amazon is, how shoppers find products, and why visibility is the whole game."},
 {t:"p",x:"Amazon is a giant online store. Every day, millions of shoppers type what they want into a search bar, and Amazon instantly shows pages of products."},
 {t:"p",x:"Shoppers rarely scroll past page one. So selling on Amazon is one simple game: be visible at the exact moment the right shopper searches."},
 {t:"list",items:["Shopper searches for a product","Amazon ranks and shows results","Shopper clicks a few products","Shopper buys one (or leaves)"]},
 {t:"table",head:["Who","Role"],rows:[["Shopper","Types words, clicks, buys"],["Seller","Wants the product seen and bought"],["Amazon","Decides what gets shown, collects ad fees"],["Ad","A paid shortcut to being seen"]]},
 {t:"example",x:"Search for a bamboo cutting board. You will see free results mixed with results marked Sponsored. Sponsored means ad: the seller pays only when someone clicks."},
 {t:"tip",x:"Before thinking about ads, think like a shopper. Search your product type and study the page. That page is your battlefield."}
]},
{id:"m0l2",title:"Anatomy of a Product Listing",mins:8,blocks:[
 {t:"goal",x:"Learn the seven parts of a listing and why each one changes ad performance."},
 {t:"p",x:"The listing is the product page. Ads bring shoppers to it, but the page does the selling."},
 {t:"table",head:["Part","Why it matters"],rows:[["Main image","First thing seen in search and on the page"],["Title","Tells the shopper and Amazon what this is"],["Price","Compared instantly with competitors"],["Bullets","Answer the question: what is in it for me?"],["Reviews and rating","Social proof, the silent salesperson"],["Description / A+","Removes doubt and builds trust"],["Stock and Buy Box","No stock or no Buy Box means ads are wasted"]]},
 {t:"p",x:"Shoppers decide in seconds. If any part is weak, clicks leak away without sales — and you paid for every one of them."},
 {t:"example",x:"Two identical cutting boards. One has a blurry photo, zero reviews and a high price. The other has a sharp photo, 4.7 stars and a fair price. Same ad spend, very different results."},
 {t:"tip",x:"When a campaign performs badly, always look at the listing before blaming the ads."}
]},
{id:"m0l3",title:"Organic vs Paid and the Buy Box",mins:7,blocks:[
 {t:"goal",x:"Understand free vs paid visibility, and the one button that matters most."},
 {t:"table",head:["Type","Meaning","How you get it"],rows:[["Organic","Free result","Earned by relevance, sales and reviews"],["Paid (Sponsored)","Ad result","You pay per click"]]},
 {t:"p",x:"The Buy Box is the area with the Add to Cart button. Most sales go through it. If you do not win the Buy Box, your ads can send shoppers to a button that sells a competitor."},
 {t:"list",items:["Appear faster than waiting for organic rank","Discover which search words actually sell","Protect your page from competitor ads","Grow sales velocity, which also lifts organic rank"]},
 {t:"diagram",kind:"flow",title:"The visibility loop",steps:["Shopper searches","Results page: organic + sponsored","Shopper clicks","Landing page convinces (or not)","Buy or leave"]},
 {t:"tip",x:"Ads buy visibility. The listing earns the sale. Both must work."}
]}],
quiz:[
{q:"What is a product listing?",o:["The warehouse location","The product page where it is sold","The ad dashboard","A type of campaign"],a:1,e:"The listing is the product page. Ads send shoppers there; the page sells."},
{q:"Organic results are…",o:["Paid ads","Free results earned by relevance and sales","Always the top row","Results from social media"],a:1,e:"Organic = free, earned. Paid = Sponsored."},
{q:"The Buy Box is…",o:["A storage box","The main Add to Cart area","A report type","A match type"],a:1,e:"Most sales flow through the Buy Box button."},
{q:"Before spending on ads, the most important check is…",o:["Logo colors","Whether the listing is ready to convert","The campaign name","The time zone"],a:1,e:"A weak page turns ad budget into wasted clicks."}
]},
{title:"What is PPC?",icon:"🖱️",color:"#0EA5E9",img:IMG.auction,desc:"Pay per click, the auction, and the click journey.",
lessons:[
{id:"m1l1",title:"Pay Per Click in Plain Words",mins:6,blocks:[
 {t:"goal",x:"Understand the only payment model you need to know."},
 {t:"p",x:"PPC means Pay Per Click. Showing the ad is free. You pay when a shopper clicks it."},
 {t:"list",items:["Impression = the ad was shown (free)","Click = a shopper clicked (you pay)","Bid = the most you are willing to pay per click"]},
 {t:"formula",f:"CPC = Spend ÷ Clicks",note:"The average price of one click."},
 {t:"example",x:"You spend 20 dollars on 20 clicks, so your average CPC is 1 dollar. If 2 of those clicks buy your 25 dollar product, those clicks produced 50 dollars of sales."},
 {t:"tip",x:"Clicks cost money whether they buy or not. That is why targeting and listing quality decide profit."}
]},
{id:"m1l2",title:"The Auction",mins:8,blocks:[
 {t:"goal",x:"See what happens in the split second after a shopper searches."},
 {t:"p",x:"Every search starts a silent auction. Sellers bid for the chance to show, and Amazon also scores how relevant your product is to that exact search."},
 {t:"diagram",kind:"flow",title:"One search, one auction",steps:["Shopper types a search","Interested sellers enter the auction","Amazon weighs bid + relevance","Winning ads get placements","Seller pays only if clicked"]},
 {t:"list",items:["A high bid with a bad match loses to a fair bid with a great match","Relevance = keyword fit + listing quality + history","You never pay more than your bid"]},
 {t:"example",x:"You sell bamboo boards. For the search bamboo cutting board you are highly relevant. For knife set you are irrelevant — no bid can save you."},
 {t:"tip",x:"Relevance is free leverage. Tight keywords and a good listing lower what you pay over time."}
]},
{id:"m1l3",title:"The Click Journey and the Funnel",mins:7,blocks:[
 {t:"goal",x:"Learn the funnel every PPC manager reads."},
 {t:"diagram",kind:"funnel",title:"The PPC funnel",items:[["Impressions — ad shown",100],["Clicks — shopper interested",45],["Page views — listing loads",40],["Orders — shopper buys",8]]},
 {t:"table",head:["Stage","What can go wrong"],rows:[["Impressions","Bid too low, targeting too narrow"],["Clicks","Weak image, price or title"],["Page views","Out of stock, slow page"],["Orders","Bad reviews, high price, weak bullets"]]},
 {t:"p",x:"Every stage leaks. Your job is to find the biggest leak and fix that one first."},
 {t:"mistake",items:["Judging a campaign from one day of data","Changing many things at once so nothing can be learned","Blaming the ads when the listing is the leak"]},
 {t:"tip",x:"Read the funnel top to bottom: impressions, CTR, conversion, ACOS."}
]}],
quiz:[
{q:"PPC stands for…",o:["Pay Per Customer","Pay Per Click","Price Per Click","Pay Per Conversion"],a:1,e:"You pay per click, not per view or per sale."},
{q:"The seller pays when…",o:["The ad is shown","A shopper clicks the ad","A shopper buys","Each month"],a:1,e:"Impressions are free; clicks cost money."},
{q:"A bid is…",o:["A fee to Amazon","The most you will pay per click","A discount code","A report"],a:1,e:"The bid caps what you pay in the auction."},
{q:"The auction chooses ads using…",o:["Bid only","Alphabetical order","Bid plus relevance","Random luck"],a:1,e:"Bid and relevance together decide the winners."}
]},
{title:"Money Math",icon:"🧮",color:"#10B981",desc:"CPC, CTR, ACOS, ROAS, TACoS and break-even — with worked examples.",
lessons:[
{id:"m2l1",title:"Spend, Sales and CPC",mins:7,blocks:[
 {t:"goal",x:"Master the three base numbers everything else is built on."},
 {t:"table",head:["Metric","Plain meaning","Formula"],rows:[["Spend","Money the ads consumed","Total cost"],["Sales","Revenue the ads produced","Attributed sales"],["CPC","Average price of one click","Spend ÷ Clicks"]]},
 {t:"example",x:"30 dollars spend, 120 dollars sales, 30 clicks. CPC = 30 ÷ 30 = 1 dollar per click."},
 {t:"tip",x:"Spend alone tells you nothing. Always compare spend against sales and clicks."}
]},
{id:"m2l2",title:"CTR and Conversion Rate",mins:8,blocks:[
 {t:"goal",x:"Learn the two rates that tell you where the leak is."},
 {t:"formula",f:"CTR = Clicks ÷ Impressions × 100",note:"Of people who saw the ad, how many clicked?"},
 {t:"formula",f:"Conversion Rate = Orders ÷ Clicks × 100",note:"Of clicks, how many bought?"},
 {t:"table",head:["CTR reading","Likely meaning"],rows:[["Under 0.3%","Image, price or title not appealing"],["0.3% – 0.7%","Decent hook"],["Over 0.7%","Strong hook"]]},
 {t:"example",x:"1,000 impressions and 5 clicks is a 0.5% CTR. 5 clicks and 1 order is a 20% conversion. Story: decent hook, good page."},
 {t:"tip",x:"Low CTR means fix the hook (image, price, title). Low conversion means fix the page or the targeting."}
]},
{id:"m2l3",title:"ACOS Deep Dive",mins:10,blocks:[
 {t:"goal",x:"Own the most important number in Amazon PPC."},
 {t:"formula",f:"ACOS = Spend ÷ Sales × 100",note:"How much of the ad sales went to paying for ads."},
 {t:"example",x:"Spend 20, sales 100 gives ACOS 20%. For every dollar of ad sales, 20 cents went to ads."},
 {t:"table",head:["ACOS vs 30% margin","Reading"],rows:[["15%","Profitable — room to scale"],["30%","Break-even — ads pay for themselves"],["45%","Losing money — fix bids or targeting"],["No sales","Emergency — check relevance and listing"]]},
 {t:"p",x:"ACOS has a twin called break-even ACOS: your profit margin. Below it, likely profit. Above it, likely loss."},
 {t:"tip",x:"Never say good ACOS without asking: good compared to which margin?"}
]},
{id:"m2l4",title:"ROAS, TACoS and a Full Worked Example",mins:12,blocks:[
 {t:"goal",x:"Complete the money vocabulary and run one full calculation."},
 {t:"formula",f:"ROAS = Sales ÷ Spend",note:"The mirror of ACOS. Higher is better."},
 {t:"formula",f:"TACoS = Ad Spend ÷ Total Revenue × 100",note:"Ads compared to the whole business, including organic sales."},
 {t:"table",head:["Metric","Use it when"],rows:[["ACOS","Judging individual campaigns"],["ROAS","Quick comparisons"],["TACoS","Checking whether ads grow the whole brand"]]},
 {t:"p",x:"Worked example. Bamboo board, 25 dollars, profit after all costs 7.50, so margin is 30%."},
 {t:"table",head:["Scenario","CPC","Conversion","Cost per sale","ACOS","Verdict"],rows:[["Broad keyword","1.00","10%","10.00","40%","Loses money"],["Long-tail keyword","0.60","15%","4.00","16%","Profitable"]]},
 {t:"p",x:"Same product, same page — different keyword economics. That is why choosing keywords is money management."},
 {t:"tip",x:"When ACOS is too high, do not only cut bids. A more specific keyword is often the cheaper fix."}
]}],
quiz:[
{q:"CPC is calculated as…",o:["Clicks ÷ Spend","Spend ÷ Clicks","Sales ÷ Clicks","Spend ÷ Sales"],a:1,e:"CPC = Spend ÷ Clicks."},
{q:"Spend 20, clicks 10. CPC?",o:["1 dollar","2 dollars","10 dollars","0.5 dollars"],a:1,e:"20 ÷ 10 = 2 dollars per click."},
{q:"CTR measures…",o:["How often viewers click","How often clicks buy","How much you spend","Your margin"],a:0,e:"CTR = Clicks ÷ Impressions."},
{q:"Spend 25, sales 100. ACOS?",o:["4%","25%","40%","75%"],a:1,e:"25 ÷ 100 × 100 = 25%."},
{q:"Margin 35%. Break-even ACOS?",o:["35%","65%","50%","17%"],a:0,e:"Break-even ACOS equals your profit margin."}
]},
{title:"Campaign Structure",icon:"🗂️",color:"#8B5CF6",desc:"Hierarchy, naming, and the three ad types.",
lessons:[
{id:"m3l1",title:"The Hierarchy: Campaign, Ad Group, Targeting",mins:8,blocks:[
 {t:"goal",x:"Know exactly where every setting lives."},
 {t:"diagram",kind:"tree",title:"One account, organized like folders",nodes:[[0,"CAMPAIGN — budget and schedule live here"],[1,"AD GROUP — holds the product"],[2,"TARGETING — keywords or products"],[2,"BIDS — per keyword or per group"],[1,"AD GROUP 2 — another theme"],[2,"TARGETING — its own keywords"]]},
 {t:"table",head:["Level","Controls"],rows:[["Campaign","Daily budget, dates, bidding strategy"],["Ad Group","Which product and which theme"],["Targeting","When the ad can show"],["Bid","How much per click for that target"]]},
 {t:"tip",x:"One clear purpose per campaign. A campaign doing two jobs does neither well."}
]},
{id:"m3l2",title:"Naming and Organization",mins:6,blocks:[
 {t:"goal",x:"Build an account your future self can read."},
 {t:"example",x:"SP | Auto | Bamboo Board | Research — and — SP | Exact | Bamboo Board | Kitchen. The name says the type, the product and the job."},
 {t:"split",a:{title:"Do",items:["Include the ad type (SP, SB, SD)","Include the targeting type","Include the product name","Include the purpose"]},b:{title:"Don't",items:["Names like test1, final2, new-new","Names only you can guess","One giant campaign for everything"]}},
 {t:"tip",x:"Good naming is not cosmetic. It is how you move fast without breaking things."}
]},
{id:"m3l3",title:"The Three Ad Types",mins:7,blocks:[
 {t:"goal",x:"Know the family and where to start."},
 {t:"table",head:["Type","Shows as","Best for"],rows:[["Sponsored Products","Single product in search and product pages","Core sales — start here"],["Sponsored Brands","Brand banner with logo and several products","Brand-registered sellers, defense"],["Sponsored Display","On and off Amazon, retargeting","Remarketing and awareness"]]},
 {t:"list",items:["Beginners: 90% of learning happens in Sponsored Products","Add Brands and Display only after Sponsored Products is stable"]},
 {t:"tip",x:"Master one ad type deeply before touching the others."}
]}],
quiz:[
{q:"Which level holds the daily budget?",o:["Ad group","Keyword","Campaign","Placement"],a:2,e:"Budget lives at campaign level."},
{q:"An ad group holds…",o:["The invoice","Products and targeting","The login","The billing card"],a:1,e:"Ad groups connect products to targeting and bids."},
{q:"Best ad type for a beginner?",o:["Sponsored Display","Sponsored Brands","Sponsored Products","Video ads"],a:2,e:"Sponsored Products is the core learning ground."},
{q:"Why does naming matter?",o:["It changes the algorithm","It keeps the account readable for you and your team","Amazon requires it","It lowers CPC"],a:1,e:"Clear names prevent expensive mistakes."}
]},
{title:"Keywords & Match Types",icon:"🔑",color:"#F43F5E",img:IMG.keywords,desc:"Keywords vs search terms, match types, negatives, and research.",
lessons:[
{id:"m4l1",title:"Keyword vs Search Term",mins:6,blocks:[
 {t:"goal",x:"Never confuse your words with the customer's words again."},
 {t:"p",x:"A keyword is what you choose. A search term is what the customer actually typed."},
 {t:"table",head:["Words","Whose are they?"],rows:[["bamboo cutting board","Your keyword"],["large bamboo cutting board","Customer search term"],["plastic cutting board","Customer search term — and your problem"]]},
 {t:"example",x:"Your keyword bamboo cutting board can trigger searches you never imagined. The search term report shows the truth."},
 {t:"tip",x:"The search term report is the only place where truth lives. Read it weekly."}
]},
{id:"m4l2",title:"Match Types Deep Dive",mins:9,blocks:[
 {t:"goal",x:"Control how loosely Amazon matches you to searches."},
 {t:"table",head:["Type","Meaning","Reach","Control"],rows:[["Broad","Related searches","High","Low"],["Phrase","Searches containing your phrase","Medium","Medium"],["Exact","Very close matches","Low","High"]]},
 {t:"table",head:["Your keyword","May show for","Unlikely to show for"],rows:[["bamboo cutting board (broad)","cutting board bamboo large, bamboo kitchen board","—"],["bamboo cutting board (phrase)","large bamboo cutting board","bamboo serving tray"],["bamboo cutting board (exact)","bamboo cutting board","bamboo cutting board set"]]},
 {t:"split",a:{title:"Do",items:["Start tight with Exact on proven words","Use Broad and Auto as research nets","Promote research winners into Exact"]},b:{title:"Don't",items:["Broad everything on day one","Exact on untested guesses","Forget to check what Broad actually matched"]}},
 {t:"tip",x:"Broad and Auto are scouts. Exact is the army. Scouts find, the army conquers."}
]},
{id:"m4l3",title:"Negative Keywords",mins:7,blocks:[
 {t:"goal",x:"Stop paying for shoppers who can never buy."},
 {t:"p",x:"A negative keyword tells Amazon: never show my ad for this."},
 {t:"list",items:["Find terms with clicks but zero sales","Confirm they are truly irrelevant","Add as negative (phrase or exact)","Log the change and move on"]},
 {t:"example",x:"A bamboo board getting clicks for plastic cutting board is paying to show the wrong product to the wrong shopper. Negate plastic."},
 {t:"tip",x:"Negatives are the fastest profit lever in PPC. Five minutes a week saves real money."}
]},
{id:"m4l4",title:"Keyword Research Starter Process",mins:8,blocks:[
 {t:"goal",x:"Find words worth bidding on, even without paid tools."},
 {t:"list",items:["Write seed words: product, material, use, size","Think like the shopper: problems, gifts, rooms","Prefer long-tail: more words, clearer intent","Prioritize relevance first, then volume"]},
 {t:"table",head:["Type","Example","Volume","Cost","Intent"],rows:[["Short-tail","cutting board","Huge","Expensive","Vague"],["Long-tail","bamboo cutting board for vegetables","Small","Cheap","Clear buyer"]]},
 {t:"example",x:"cutting board burns budget on browsers. large bamboo cutting board for kitchen finds buyers."},
 {t:"tip",x:"A small budget should buy only clear intent."}
]}],
quiz:[
{q:"A search term is…",o:["Your target word","What the customer actually typed","A bid type","A report setting"],a:1,e:"Keywords are yours; search terms are the customer's."},
{q:"Most control over matching?",o:["Broad","Phrase","Exact","Auto"],a:2,e:"Exact shows only for very close matches."},
{q:"Broad match means…",o:["Loose matching, high reach","Exact copies only","No spend","Only brand searches"],a:0,e:"Broad reaches far but with low control."},
{q:"A negative keyword…",o:["Raises your bid","Blocks your ad for that word","Adds budget","Boosts relevance"],a:1,e:"Negatives stop wasted spend."},
{q:"plastic cutting board clicks on a bamboo product. Action?",o:["Raise bid","Add negative","Add to Exact","Do nothing"],a:1,e:"Irrelevant clicks are waste — negate them."}
]},
{title:"Listing Readiness",icon:"📄",color:"#F59E0B",img:IMG.listing,desc:"Why PPC cannot fix a weak page, and how to check yours.",
lessons:[
{id:"m5l1",title:"The Listing Does the Selling",mins:7,blocks:[
 {t:"goal",x:"Accept the first law of PPC: ads rent attention, listings convert it."},
 {t:"p",x:"A weak page turns ad budget into tuition. You pay for clicks that never had a chance."},
 {t:"example",x:"100 clicks at 1 dollar is 100 dollars. One sale of 25 dollars. Before touching bids, ask: would a stranger buy from this page?"},
 {t:"list",items:["Shoppers compare you with 15 other results in seconds","Reviews are borrowed trust","Price is judged relative to neighbors, not in absolute terms"]},
 {t:"tip",x:"Fix the page first. Then advertise. Always in that order."}
]},
{id:"m5l2",title:"The Readiness Checklist",mins:8,blocks:[
 {t:"goal",x:"Score a listing honestly before spending."},
 {t:"table",head:["Check","Passes if…"],rows:[["Main image","Crisp, white background, fills the frame"],["Title","Says what it is in the first five words"],["Price","Inside the normal band for the category"],["Reviews","Enough count and 4+ stars"],["Bullets","Benefits, not just specs"],["Stock","30+ days of cover"],["Buy Box","You win it"]]},
 {t:"p",x:"Every failed check is a leak you pay for per click."},
 {t:"tip",x:"Three or more failed checks means pause scaling, fix, then relaunch."}
]},
{id:"m5l3",title:"Diagnosing Conversion Leaks",mins:9,blocks:[
 {t:"goal",x:"Use symptoms to find the leak before prescribing fixes."},
 {t:"table",head:["Symptom","Suspect","Fix"],rows:[["High CTR + low conversion","Page or price","Improve image, reviews, price"],["Low CTR + high conversion","Weak hook, strong page","Better image and title"],["Low CTR + low conversion","Wrong targeting or weak offer","Refine keywords and page"],["High CTR + high conversion","It works","Scale carefully"]]},
 {t:"mistake",items:["Raising bids to fix a listing problem","Adding more keywords to a page that cannot convert","Copying a competitor price without their reviews"]},
 {t:"tip",x:"The symptom table is your stethoscope. Diagnose, then prescribe."}
]}],
quiz:[
{q:"Ads bring shoppers. What sells?",o:["The bid","The listing","The logo","The budget"],a:1,e:"The page converts the attention the ad rented."},
{q:"100 clicks, 1 sale. First suspect?",o:["The campaign name","Listing quality and search relevance","The time of day","Amazon support"],a:1,e:"Check the page and the terms before the bids."},
{q:"Which is NOT a listing readiness check?",o:["Main image","Review count","Campaign naming","Buy Box"],a:2,e:"Naming helps you, not the shopper."},
{q:"You lose the Buy Box. Ads will…",o:["Perform better","Likely waste money","Stop charging","Auto-pause"],a:1,e:"Ads can send shoppers to a competitor's button."}
]},
{title:"Campaign Setup",icon:"🏗️",color:"#06B6D4",desc:"Auto vs manual, a safe first structure, and a launch plan.",
lessons:[
{id:"m6l1",title:"Auto vs Manual Campaigns",mins:7,blocks:[
 {t:"goal",x:"Know which campaign does which job."},
 {t:"table",head:["Campaign","Who picks targeting","Role"],rows:[["Auto","Amazon","Research scout"],["Manual keywords","You","Control and scale"],["Manual product targeting","You","Competitor and category attacks"]]},
 {t:"example",x:"Auto is a question: Amazon, what do you think my product is? The search term report is the answer."},
 {t:"tip",x:"Auto is a research tool. Manual is where proven winners live."}
]},
{id:"m6l2",title:"A Safe First Structure",mins:8,blocks:[
 {t:"goal",x:"Build the three-campaign starter skeleton."},
 {t:"diagram",kind:"tree",title:"Starter skeleton",nodes:[[0,"SP | Auto | Research — small budget, learns"],[1,"Harvest winners weekly"],[0,"SP | Exact | Core — proven words only"],[1,"Tight bids, tight control"],[0,"SP | Product Targeting — test later"],[1,"Competitor pages and related categories"]]},
 {t:"table",head:["Campaign","Budget share","Job"],rows:[["Auto","30–40%","Discover search terms"],["Exact","50–60%","Convert proven demand"],["Product targeting","0–10% at first","Optional experiments"]]},
 {t:"tip",x:"Structure follows purpose: research, convert, expand. In that order."}
]},
{id:"m6l3",title:"New Product Launch Plan",mins:10,blocks:[
 {t:"goal",x:"Follow a four-week plan that learns before it scales."},
 {t:"table",head:["Week","Focus","Actions"],rows:[["1","Learn","Auto only, small bids, watch terms"],["2","Control","Exact campaign with long-tail winners"],["3","Clean","First negatives pass"],["4","Scale","+10–20% budget on proven winners only"]]},
 {t:"example",x:"20 dollars a day: week 1 all Auto. Week 2: 8 Auto + 12 Exact. Week 4: shift more to what converts."},
 {t:"p",x:"Launching is not spending fast. It is learning fast with small money."},
 {t:"tip",x:"Week 1's goal is data, not profit."}
]}],
quiz:[
{q:"An Auto campaign is mainly a…",o:["Profit machine","Research tool","Brand builder","Punishment"],a:1,e:"Auto discovers search terms for you."},
{q:"A safe first structure is…",o:["Ten Broad campaigns","Small Auto + Exact long-tail","One campaign, 500 keywords","Display ads only"],a:1,e:"Small research plus tight control."},
{q:"The main goal for a brand-new product is…",o:["Profit on day one","Learning what converts","Maximum impressions","Copying competitors"],a:1,e:"Learning first, scaling second."},
{q:"Winners found in Auto should move to…",o:["A negative list","A manual Exact campaign","Sponsored Display","The trash"],a:1,e:"Promote winners into Exact for control."}
]},
{title:"Bids & Budgets",icon:"💰",color:"#84CC16",desc:"Budget math, bid rules, and a live bid-change walkthrough.",
lessons:[
{id:"m7l1",title:"Budget Basics",mins:6,blocks:[
 {t:"goal",x:"See how budget and bid decide your daily clicks."},
 {t:"p",x:"Budget is the daily cap. Bid is what you offer per click. Together they set how many clicks you can afford."},
 {t:"table",head:["Budget","Avg CPC","Max clicks/day"],rows:[["10","0.50","20"],["10","1.00","10"],["20","1.00","20"],["50","1.25","40"]]},
 {t:"example",x:"Budget gone by noon? You are invisible all evening — often the best shopping hours."},
 {t:"tip",x:"A profitable campaign out of budget is a shop closing at noon."}
]},
{id:"m7l2",title:"Bid Rules for Beginners",mins:8,blocks:[
 {t:"goal",x:"Learn the five situations and their safe responses."},
 {t:"table",head:["Situation","Reading","Action"],rows:[["No impressions","Too low or irrelevant","Raise a little, check relevance"],["Clicks, no sales","Wrong terms or weak page","Negatives + listing check"],["Sales + low ACOS","Winning","Raise bid a little, watch"],["Sales + high ACOS","Too expensive","Lower bid"],["Budget dies early","Winning but capped","Raise budget if profitable"]]},
 {t:"mistake",items:["Bidding high on everything to get data","Cutting bids on a winner because one quiet day","Never revisiting bids after launch"]},
 {t:"tip",x:"Bids are dials, not switches. Small turns, then wait."}
]},
{id:"m7l3",title:"A Bid Change Walkthrough",mins:9,blocks:[
 {t:"goal",x:"Watch one real bid decision, before and after."},
 {t:"p",x:"Keyword bamboo cutting board, margin 30%."},
 {t:"table",head:["Moment","Bid","Clicks","Spend","Sales","ACOS"],rows:[["Before","0.90","30","27","50","54%"],["After cut","0.65","22","14","50","29%"]]},
 {t:"p",x:"Same two sales, 13 dollars less spend. The cut did not kill sales — it killed waste."},
 {t:"example",x:"If the cut had also killed sales, you would raise back halfway and retest. That is the rhythm: adjust, observe, adjust."},
 {t:"tip",x:"Write every bid change with date and reason. Memory lies, logs do not."}
]}],
quiz:[
{q:"A daily budget is…",o:["A monthly cap","The daily spend limit","A bid","A fee"],a:1,e:"Budget caps daily spend."},
{q:"Budget runs out at noon on a profitable campaign. You…",o:["Pause it","Raise the budget","Delete it","Lower bids"],a:1,e:"Profitable and capped = raise budget."},
{q:"Good sales and low ACOS. You…",o:["Pause","Raise the bid carefully","Negate it","Do nothing forever"],a:1,e:"Feed winners carefully and watch."},
{q:"How many changes at once?",o:["As many as possible","One","Ten","Fifty"],a:1,e:"One change, one verdict."}
]},
{title:"Search Terms & Negatives",icon:"🕵️",color:"#EF4444",desc:"Read the report, pick winners and wasters, run the harvest loop.",
lessons:[
{id:"m8l1",title:"Reading the Search Term Report",mins:8,blocks:[
 {t:"goal",x:"Turn a raw report into decisions in four steps."},
 {t:"list",items:["Download the report for the last 7–14 days","Sort by spend, highest first","Read clicks, sales and ACOS per term","Mark each term: winner, waster or maybe"]},
 {t:"table",head:["Column","Question it answers"],rows:[["Search term","What did the shopper type?"],["Clicks","How much attention did it buy?"],["Spend","What did it cost?"],["Sales","What came back?"],["ACOS","Was the trade worth it?"]]},
 {t:"tip",x:"Start at the top of the spend column. That is where your money is deciding."}
]},
{id:"m8l2",title:"Winners and Wasters",mins:8,blocks:[
 {t:"goal",x:"Match each pattern to its safe action."},
 {t:"table",head:["Pattern","Verdict","Action"],rows:[["Sales + ACOS under margin","Winner","Promote to Exact"],["Sales + ACOS over margin","Expensive winner","Lower bid"],["No sales, many clicks, irrelevant","Waster","Negative"],["No sales, few clicks","Too early","Watch"],["No sales, many clicks, relevant","Leak","Fix page or price"]]},
 {t:"split",a:{title:"Do",items:["Decide with 7+ days of data","Negate irrelevant terms fast","Promote winners into Exact"]},b:{title:"Don't",items:["Negate after 2 clicks","Pause a campaign for one bad term","Let wasters run just in case"]}},
 {t:"tip",x:"Every week, money flows to wasters unless you redirect it."}
]},
{id:"m8l3",title:"The Harvesting Workflow",mins:7,blocks:[
 {t:"goal",x:"Memorize the weekly loop that is the actual job."},
 {t:"diagram",kind:"flow",title:"The harvest loop",steps:["Download search term report","Sort by spend","Mark winners and wasters","Move winners to Exact","Add negatives for wasters","Log every change","Repeat next week"]},
 {t:"example",x:"One harvest a week: 2 winners promoted, 3 negatives added. In 8 weeks that is 16 winners promoted and 24 leaks closed."},
 {t:"tip",x:"Small weekly harvests beat big monthly cleanups."}
]}],
quiz:[
{q:"The search term report shows…",o:["Your keywords only","What customers actually typed","Your bids","Your budget"],a:1,e:"It is the truth of what shoppers typed."},
{q:"High clicks, no sales, clearly irrelevant. Action?",o:["Promote","Negative","Raise bid","Watch for a year"],a:1,e:"Irrelevant wasters get negated."},
{q:"A winner with ACOS under margin should…",o:["Be paused","Move to Exact","Be negated","Be ignored"],a:1,e:"Promote winners into Exact for control."},
{q:"Only 3 clicks and no sales on a relevant term. You…",o:["Negate it","Pause the campaign","Watch — too little data","Raise the bid"],a:2,e:"Small samples make loud lies. Watch."}
]},
{title:"Weekly Optimization",icon:"🔄",color:"#3B82F6",desc:"The routine, the one-change rule, and how much data is enough.",
lessons:[
{id:"m9l1",title:"The Weekly Routine",mins:7,blocks:[
 {t:"goal",x:"Adopt a boring, professional rhythm."},
 {t:"table",head:["Day","Task"],rows:[["Monday","Spend, budgets, urgent alerts"],["Tuesday","Search term review"],["Wednesday","Negatives + promote winners"],["Thursday","Bid and ACOS review"],["Friday","Simple report"]]},
 {t:"list",items:["Daily 5-minute checks: spend, stock, accidental pauses","Weekly deep pass: the table above","Monthly: structure and strategy review"]},
 {t:"tip",x:"A boring routine is a professional routine."}
]},
{id:"m9l2",title:"One Change at a Time",mins:6,blocks:[
 {t:"goal",x:"Learn the rule that separates managers from gamblers."},
 {t:"split",a:{title:"Do",items:["Change one variable","Wait about a week","Compare before and after","Log it"]},b:{title:"Don't",items:["20 bid changes on Monday","New keywords + new bids + new budget same day","Judging on overnight data"]}},
 {t:"example",x:"You raise bids and add keywords the same day. Sales jump. Which change worked? Nobody knows — and that is the problem."},
 {t:"tip",x:"Science beats vibes: one variable, one verdict."}
]},
{id:"m9l3",title:"How Much Data is Enough?",mins:7,blocks:[
 {t:"goal",x:"Use click thresholds instead of feelings."},
 {t:"table",head:["Clicks on a term","What you can do"],rows:[["Under 10","Watch only"],["10–20","Small tweaks, negate obvious irrelevance"],["20–40","Fair bid decisions"],["40+","Confident promote or pause calls"]]},
 {t:"p",x:"Data is a sample. Small samples make loud lies."},
 {t:"mistake",items:["Pausing a keyword after 3 clicks","Scaling a keyword after 1 lucky sale","Ignoring a term forever at 15 clicks and zero sales"]},
 {t:"tip",x:"A week of time plus enough clicks. Then decide."}
]}],
quiz:[
{q:"How often should the deep optimization pass happen?",o:["Every hour","Weekly","Once a year","Never"],a:1,e:"A safe weekly routine beats chaos."},
{q:"Why one change at a time?",o:["It is faster","So you know what worked","Amazon requires it","It lowers CPC"],a:1,e:"One variable, one verdict."},
{q:"Before judging a keyword you need…",o:["1 click","Enough clicks and about a week","A feeling","Permission"],a:1,e:"Small samples make loud lies."},
{q:"Sales suddenly drop. First checks?",o:["Stock, price, reviews, competitors","The logo","The campaign name","The office wifi"],a:0,e:"Check the boring four first."}
]},
{title:"Reporting & Troubleshooting",icon:"📈",color:"#6366F1",img:IMG.reporting,desc:"Reports humans understand, and fixing the five classic problems.",
lessons:[
{id:"m10l1",title:"The Simple Report Structure",mins:7,blocks:[
 {t:"goal",x:"Write reports that busy clients actually read."},
 {t:"list",items:["Numbers: spend, sales, ACOS, clicks, orders, CTR, conversion","Trend vs last week","What worked","What did not work","Next steps"]},
 {t:"example",x:"Spend 210, sales 950, ACOS 22% (was 28%). Winner: exact bamboo keyword. Problem: plastic term waste. Next: negatives plus one new promotion."},
 {t:"tip",x:"A report is a story with numbers, not a number dump."}
]},
{id:"m10l2",title:"Explaining Numbers in Human Words",mins:7,blocks:[
 {t:"goal",x:"Translate every metric into one plain sentence."},
 {t:"table",head:["Metric","Say it like this"],rows:[["ACOS","Of every sales dollar, this much went to ads"],["CTR","Of people who saw us, this many clicked"],["Conversion","Of clicks, this many bought"],["TACoS","Ad cost vs the whole business, not just ad sales"]]},
 {t:"p",x:"Clients remember sentences, not spreadsheets."},
 {t:"tip",x:"Always end with next steps. Numbers inform; steps reassure."}
]},
{id:"m10l3",title:"Troubleshooting: No Impressions and Low CTR",mins:8,blocks:[
 {t:"goal",x:"Fix the top of the funnel."},
 {t:"table",head:["Problem","First check","Then"],rows:[["No impressions","Campaign active? In review?","Raise bid, widen targeting slightly"],["No impressions","Budget near zero?","Fix budget"],["Low CTR","Main image on white background?","Improve image"],["Low CTR","Price vs neighbors?","Reposition price or title"]]},
 {t:"tip",x:"Fix the cheapest thing first: bids and image before strategy."}
]},
{id:"m10l4",title:"Troubleshooting: Clicks No Sales, High ACOS, Sales Drop",mins:9,blocks:[
 {t:"goal",x:"Fix the bottom of the funnel without panic."},
 {t:"table",head:["Problem","Suspects","Actions"],rows:[["Clicks, no sales","Irrelevant terms, weak page, price","Negatives, listing pass, price check"],["High ACOS","CPC too high, conversion low","Lower bids, tighten matches"],["Sales suddenly drop","Stock, price change, review hit, competitor promo","Check the boring four first"]]},
 {t:"mistake",items:["Rebuilding the account when the product was simply out of stock","Panic-pausing everything after one bad week"]},
 {t:"tip",x:"When in doubt: stock, price, reviews, competitors — in that order."}
]}],
quiz:[
{q:"A report must always include…",o:["Only spend","Next steps","Every single keyword","Emojis"],a:1,e:"Numbers inform; steps reassure."},
{q:"No impressions. First check?",o:["Campaign status and bid","The logo","Reviews","The moon phase"],a:0,e:"Status, review state, then bid and budget."},
{q:"Low CTR usually points to…",o:["Image, price or title","The bid being too high","Too many negatives","Stock levels"],a:0,e:"The hook is the image, price and title."},
{q:"High ACOS on a relevant term means…",o:["Raise the bid","Lower the bid or tighten match","Add budget","Celebrate"],a:1,e:"Relevant but expensive = lower bid."}
]},
{title:"VA Workflow & Capstone",icon:"🎓",color:"#14B8A6",img:IMG.va,desc:"Cadence, permissions, SOPs, communication and the final project.",
lessons:[
{id:"m11l1",title:"Tasks by Cadence",mins:7,blocks:[
 {t:"goal",x:"Know what daily, weekly and monthly mean for a VA."},
 {t:"table",head:["Cadence","Tasks"],rows:[["Daily","Spend, alerts, stock, paused campaigns"],["Weekly","Term harvest, negatives, bids, report"],["Monthly","Structure, top keywords, listing review, cleanup"]]},
 {t:"tip",x:"Cadence prevents both neglect and over-tinkering."}
]},
{id:"m11l2",title:"The Permissions Ladder",mins:8,blocks:[
 {t:"goal",x:"Know what you may do alone and what needs approval."},
 {t:"table",head:["Task","VA alone","Needs approval"],rows:[["Download and clean reports","Yes","—"],["Add negatives from rules","Yes","—"],["Small bid moves (plus or minus 20%)","Yes","—"],["Promote winners to Exact","Yes","—"],["Budget changes","No","Manager"],["New campaign structure","No","Manager"],["Pausing a whole campaign","No","Manager"],["Strategy shifts","No","Manager"]]},
 {t:"p",x:"Trust is built by doing the small things flawlessly for weeks."},
 {t:"tip",x:"When unsure, ask. A question costs a minute; a mistake costs a client."}
]},
{id:"m11l3",title:"SOPs and the Change Log",mins:7,blocks:[
 {t:"goal",x:"Turn judgment into repeatable process."},
 {t:"list",items:["SOP 1: download report, save with date","SOP 2: mark winners and wasters, act, log","SOP 3: budget alert, check profitability, notify","SOP 4: weekly report template"]},
 {t:"table",head:["Date","Campaign","Change","Reason","Result"],rows:[["Jun 3","SP Auto","Negated plastic","8 clicks, 0 sales, irrelevant","Spend down 12% next week"]]},
 {t:"tip",x:"The change log is your memory, your proof and your teacher."}
]},
{id:"m11l4",title:"Client Communication and the Capstone",mins:9,blocks:[
 {t:"goal",x:"Communicate like a professional and finish the final project."},
 {t:"example",x:"Weekly update: Spend 45, sales 180, ACOS 25%. Added 2 negatives, promoted 1 winner. Next: watch the new exact keyword. Short, true, forward-looking."},
 {t:"list",items:["Ask approval with data + suggestion + risk","Report problems early with a proposed fix","Never hide bad numbers"]},
 {t:"list",items:["Capstone: build a starter campaign in the Builder tool","Pass all 12 module quizzes at 70%+","Score 70%+ in the Search Term Trainer","Write one weekly report in the Report tool","Pass the Final Exam in the Quiz Arena"]},
 {t:"tip",x:"You are not done when you know. You are done when you can do it weekly, calmly, and explain it."}
]}],
quiz:[
{q:"Which needs manager approval?",o:["Adding a negative from rules","A whole-campaign pause","Downloading a report","A small bid move"],a:1,e:"Big levers need approval; small safe ones do not."},
{q:"A change log is…",o:["A password list","A record of every change with reason","A client invoice","A keyword list"],a:1,e:"Memory lies, logs do not."},
{q:"A client update should include…",o:["Only good news","Data, actions and next steps","Every raw number","Excuses"],a:1,e:"Short, true, forward-looking."},
{q:"Capstone pass level for supervised work is…",o:["10%","50%","85%+","0%"],a:2,e:"85+ means ready for supervised client work."}
]}
];
const TOTAL_LESSONS=MODULES.reduce((a,m)=>a+m.lessons.length,0);

const FINAL_EXAM=[
{q:"PPC stands for…",o:["Pay Per Click","Pay Per Customer","Price Per Click","Pay Per Conversion"],a:0,e:"You pay per click."},
{q:"The seller pays when…",o:["The ad shows","A shopper clicks","A shopper buys","Monthly"],a:1,e:"Clicks cost money; impressions are free."},

window.gradeTrainer=function(){
 const sels=[...document.querySelectorAll(".tr-select")]; let correct=0,rowsHtml="";
 try{ sels.forEach(s=>{ const i=+s.dataset.i,r=TRAINER_ROWS[i],pick=s.value; if(!pick){toast("Choose an action for every row first.","warn");throw new Error("incomplete");} const ok=pick===r.exp; if(ok)correct++; const pl=TRAINER_OPTS.find(o=>o.v===pick).label, xl=TRAINER_OPTS.find(o=>o.v===r.exp).label; rowsHtml+='<div class="flex gap-3 rounded-xl p-3 '+(ok?'bg-emerald-50 border border-emerald-200':'bg-red-50 border border-red-200')+'"><span class="text-lg">'+(ok?'✅':'❌')+'</span><div class="text-sm"><b class="text-navy">'+r.term+'</b> — you chose <b>'+pl+'</b>.'+(ok?'':' Best action: <b>'+xl+'</b>.')+' <span class="text-slate-500">'+r.why+'</span></div></div>'; }); }catch(e){ return; }
 const score=Math.round(correct/TRAINER_ROWS.length*100), res=document.getElementById("trainerResult");
 res.classList.remove("hidden");
 res.innerHTML='<div class="flex flex-wrap items-center gap-4 mb-4"><div class="pop w-20 h-20 rounded-2xl flex items-center justify-center font-display font-bold text-2xl text-white '+(score>=70?'bg-emerald-500':'bg-amber-500')+'">'+score+'%</div><div><div class="font-display font-bold text-navy">'+correct+' of '+TRAINER_ROWS.length+' correct</div><div class="text-sm text-slate-500">'+(score>=90?"Manager-level judgment. Excellent!":score>=70?"Solid! Review the misses below.":"Good practice. Read the reasons and try again.")+'</div></div></div><div class="space-y-2 max-h-96 overflow-y-auto pr-1">'+rowsHtml+'</div>';
 res.scrollIntoView({behavior:"smooth",block:"nearest"});
 if(!state.trainerDone){ state.trainerDone=true; state.trainerBest=Math.max(state.trainerBest,score); save(); addXp(correct*5,"Search term trainer"); }
 else { if(score>state.trainerBest){state.trainerBest=score;save();toast("New best score: "+score+"%","info");} else toast("Practice round — best stays "+state.trainerBest+"%","info"); }
 updateTopbar();
};

window.scoreCampaign=function(){
 const pi=+document.getElementById("bProduct").value,prod=BUILDER_PRODUCTS[pi],name=document.getElementById("bName").value.trim(),budget=parseFloat(document.getElementById("bBudget").value)||0;
 const checks=[];
 checks.push({label:"Self-explaining campaign name",pass:(/sp\s*\|/i.test(name)&&name.length>8)||(/sp/i.test(name)&&name.toLowerCase().includes(prod.name.split(" ")[0].toLowerCase())),note:"Use a pattern like: SP | Exact | "+prod.name.split(" ")[0]+" | Core"});
 checks.push({label:"Starter budget between $10 and $50",pass:budget>=10&&budget<=50,note:"Beginners learn best with small, controlled budgets."});
 const exacts=kwRows.filter(k=>k.m==="Exact").length;
 checks.push({label:"At least 2 Exact keywords",pass:exacts>=2,note:"Exact gives beginners control. You have "+exacts+" Exact keyword(s)."});
 checks.push({label:"All bids inside $0.50–$1.50",pass:kwRows.length>0&&kwRows.every(k=>k.b>=0.5&&k.b<=1.5),note:"Safe starter range for this practice product."});
 checks.push({label:"At least 2 negative keywords",pass:negRows.length>=2,note:"Negatives protect your budget from day one."});
 const badKw=kwRows.filter(k=>BAD_WORDS.some(w=>k.t.toLowerCase().includes(w)));
 checks.push({label:"No irrelevant keywords",pass:kwRows.length>0&&badKw.length===0,note:badKw.length?"These look irrelevant: "+badKw.map(k=>k.t).join(", "):"All keywords look relevant."});
 const score=checks.reduce((a,c)=>a+(c.pass?(c.label.startsWith("At least")||c.label.startsWith("All bids")||c.label.startsWith("No irrelevant")?20:10):0),0);
 const res=document.getElementById("bResult"); res.classList.remove("hidden");
 res.innerHTML='<div class="flex items-center gap-3 mb-4"><div class="pop w-16 h-16 rounded-2xl flex items-center justify-center font-display font-bold text-xl text-white '+(score>=70?'bg-emerald-500':'bg-amber-500')+'">'+score+'</div><div class="font-display font-bold text-navy">'+(score>=90?"Beautiful structure.":score>=70?"Solid starter campaign!":"Needs work — see notes.")+'</div></div><div class="space-y-2">'+checks.map(c=>'<div class="flex gap-2 text-xs rounded-lg p-2.5 '+(c.pass?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-600')+'"><span>'+(c.pass?'✅':'❌')+'</span><span><b>'+c.label+'.</b> '+(c.pass?'':c.note)+'</span></div>').join("")+'</div>';
 if(!state.builderDone){ state.builderDone=true; state.builderBest=Math.max(state.builderBest,score); save(); if(score>=70) addXp(40,"Campaign built"); else toast("Score 70+ to earn the builder XP.","info"); }
 else if(score>state.builderBest){ state.builderBest=score; save(); toast("New best build: "+score+"/100","info"); }
 updateTopbar();
};

RENDER.report=function(){
 const el=document.getElementById("view-report");
 el.innerHTML='<div class="grid lg:grid-cols-2 gap-5"><div class="bg-white rounded-2xl p-6 shadow-card space-y-4"><h2 class="font-display font-bold text-lg text-navy">📊 Weekly report builder</h2><p class="text-sm text-slate-500">Type the week\'s numbers. The app calculates metrics and drafts a client-ready report.</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">'+[["rSpend","Spend ($)","210"],["rSales","Ad sales ($)","950"],["rClicks","Clicks","180"],["rImp","Impressions","4200"],["rOrders","Orders","19"],["rMargin","Margin (%)","30"]].map(f=>'<label class="text-xs font-bold text-slate-500">'+f[1]+'<input id="'+f[0]+'" type="number" value="'+f[2]+'" oninput="calcReport()" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></label>').join("")+'</div><div id="rMetrics" class="grid grid-cols-3 gap-2"></div><div class="space-y-3"><label class="text-xs font-bold text-slate-500 block">What worked<textarea id="rWins" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">Exact keyword produced steady sales. Auto campaign found a new winning search term.</textarea></label><label class="text-xs font-bold text-slate-500 block">Problems<textarea id="rIssues" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">Irrelevant search terms consumed part of the budget.</textarea></label><label class="text-xs font-bold text-slate-500 block">Next steps<textarea id="rNext" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">Add negatives for irrelevant terms. Move the new winner to Exact. Watch bids on high-ACOS keywords.</textarea></label></div><div class="flex gap-3"><button onclick="genReport()" class="bg-brand-500 hover:bg-brand-600 text-navy font-bold text-sm px-5 py-2.5 rounded-xl transition">Generate report</button><button onclick="copyReport()" class="bg-navy text-white font-bold text-sm px-5 py-2.5 rounded-xl hover:bg-navy-800 transition">Copy to clipboard</button></div></div><div class="bg-white rounded-2xl shadow-card overflow-hidden flex flex-col"><div class="bg-navy text-white px-6 py-4 font-display font-bold">Client-ready preview</div><pre id="rPreview" class="flex-1 p-6 text-[13px] leading-6 text-slate-600 whitespace-pre-wrap font-sans">Fill in the numbers and press "Generate report".</pre></div></div>';

window.calcReport=function(){ const g=id=>parseFloat(document.getElementById(id).value)||0; const spend=g("rSpend"),sales=g("rSales"),clicks=g("rClicks"),imp=g("rImp"),orders=g("rOrders"),margin=g("rMargin");
 const acos=sales>0?(spend/sales*100):null,roas=spend>0?(sales/spend):0,cpc=clicks>0?spend/clicks:0,ctr=imp>0?clicks/imp*100:0,cvr=clicks>0?orders/clicks*100:0;
 const el=document.getElementById("rMetrics"); const card=(l,v,tone)=>'<div class="rounded-xl p-3 text-center border '+tone+'"><div class="text-[10px] font-bold uppercase text-slate-400">'+l+'</div><div class="font-display font-bold text-sm mt-0.5">'+v+'</div></div>';
 el.innerHTML=card("ACOS",acos===null?"—":acos.toFixed(0)+"%",acos===null?"border-slate-200 bg-slate-50 text-slate-500":(acos<=margin?"border-emerald-200 bg-emerald-50 text-emerald-700":"border-red-200 bg-red-50 text-red-600"))+card("ROAS",roas.toFixed(1)+"x","border-slate-200 bg-slate-50 text-navy")+card("CPC","$"+cpc.toFixed(2),"border-slate-200 bg-slate-50 text-navy")+card("CTR",ctr.toFixed(1)+"%","border-slate-200 bg-slate-50 text-navy")+card("CVR",cvr.toFixed(1)+"%","border-slate-200 bg-slate-50 text-navy")+card("Break-even",margin+"%","border-brand-200 bg-brand-50 text-brand-700");
 window._rCalc={acos,roas,cpc,ctr,cvr,spend,sales,clicks,orders,margin};
};
window.genReport=function(){ const c=window._rCalc; if(!c)return;
 const verdict=c.acos===null?"No sales recorded — review targeting and the listing before spending more.":(c.acos<=c.margin?"ACOS is below break-even ("+c.margin+"%), so the week looks profitable.":"ACOS is above break-even ("+c.margin+"%), so we must cut waste and adjust bids.");
 const txt="WEEKLY PPC REPORT\n-----------------\nSpend: $"+c.spend.toFixed(0)+"\nAd Sales: $"+c.sales.toFixed(0)+"\nACOS: "+(c.acos===null?"—":c.acos.toFixed(0)+"%")+" (break-even "+c.margin+"%)\nROAS: "+c.roas.toFixed(1)+"x\nClicks: "+c.clicks+" | Orders: "+c.orders+"\nCTR: "+c.ctr.toFixed(1)+"% | Conversion: "+c.cvr.toFixed(1)+"% | CPC: $"+c.cpc.toFixed(2)+"\n\nSummary: "+verdict+"\n\nWhat worked:\n- "+(document.getElementById("rWins").value||"—")+"\n\nProblems:\n- "+(document.getElementById("rIssues").value||"—")+"\n\nNext steps:\n- "+(document.getElementById("rNext").value||"—")+"\n\nPrepared by: Your PPC Assistant";
 document.getElementById("rPreview").textContent=txt; window._rText=txt;
 if(!state.reportDone){state.reportDone=true;save();addXp(15,"Report generated");} else toast("Report updated.","info");
 updateTopbar();
};
window.copyReport=function(){ if(!window._rText){toast("Generate the report first.","warn");return;} if(navigator.clipboard) navigator.clipboard.writeText(window._rText); toast("Report copied to clipboard.","info"); };

 '<div class="bg-white rounded-2xl shadow-card overflow-hidden"><div class="flex flex-wrap items-center gap-3 p-5 border-b border-slate-100"><h2 class="font-display font-bold text-navy">Students</h2><input id="cohortSearch" oninput="filterCohort()" placeholder="Search student…" class="ml-auto w-full sm:w-64 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div><div class="overflow-x-auto"><table class="w-full text-sm min-w-[720px]" id="cohortTable"><thead><tr class="bg-slate-50 text-left text-xs text-slate-400 uppercase"><th class="px-5 py-3">Student</th><th class="px-5 py-3">Level</th><th class="px-5 py-3 w-56">Progress</th><th class="px-5 py-3">XP</th><th class="px-5 py-3">Weak area</th><th class="px-5 py-3">Last active</th><th class="px-5 py-3">Status</th></tr></thead><tbody>'+cohortRows(COHORT)+'</tbody></table></div><div class="p-4 bg-slate-50 text-xs text-slate-400">💡 Teaching tip: run the <b>Search Term Trainer</b> live in class and let students defend their decisions out loud — judgment grows faster than button-clicking.</div></div>';
};
function cohortRows(list){ return list.map(s=>{ const st=s.status==="star"?'<span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700">STAR</span>':s.status==="risk"?'<span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-red-100 text-red-600">AT RISK</span>':'<span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-sky-100 text-sky-700">ON TRACK</span>'; return '<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="px-5 py-3.5 font-bold text-navy">'+s.name+'</td><td class="px-5 py-3.5 text-slate-500">'+s.lvl+'</td><td class="px-5 py-3.5"><div class="flex items-center gap-2"><div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="bar h-full bg-brand-500" style="width:'+s.prog+'%"></div></div><span class="text-xs font-bold text-slate-500">'+s.prog+'%</span></div></td><td class="px-5 py-3.5 font-semibold text-slate-600">⚡'+s.xp+'</td><td class="px-5 py-3.5 text-slate-500">'+s.weak+'</td><td class="px-5 py-3.5 text-slate-500">'+s.last+'</td><td class="px-5 py-3.5">'+st+'</td></tr>'; }).join(""); }
window.filterCohort=function(){ const q=document.getElementById("cohortSearch").value.toLowerCase(); document.querySelector("#cohortTable tbody").innerHTML=cohortRows(COHORT.filter(s=>s.name.toLowerCase().includes(q))); };

/* ================= BOOT ================= */
document.getElementById("burger").addEventListener("click",openSidebar);
document.getElementById("overlay").addEventListener("click",closeSidebar);
document.getElementById("resetBtn").addEventListener("click",()=>{ if(confirm("Reset ALL progress, XP and badges? This cannot be undone.")){ localStorage.removeItem(SKEY); location.reload(); } });
buildNav(); updateTopbar(); showView("dashboard");
</script>
</body>
</html>
