# Amazon Ad Console Workflow Api Route Bugfix With Test

## Action

Follow the api-route-bugfix-with-test workflow:
1. Fix the bug in the relevant API route file (e.g., /api/*/route.ts).
2. Add or update a test in the corresponding __tests__ directory for that route.
3. Commit both the route and its test together.

## Evidence

