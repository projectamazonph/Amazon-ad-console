# Amazon Ad Console Workflow Engine Bugfix With Test

## Action

Follow the engine-bugfix-with-test workflow:
1. Identify and fix the bug in the relevant engine or feature file (e.g., core/engine/*.ts, features/*/engine.ts, features/*/store.ts).
2. Add or update a test in the corresponding __tests__ directory to cover the fixed behavior.
3. Commit both the implementation and the test together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: src/engine/ad-console/core/engine/*.ts, src/engine/ad-console/features/*/engine.ts, src/engine/ad-console/features/*/store.ts

