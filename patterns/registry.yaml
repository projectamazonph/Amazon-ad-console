# Machine-readable pattern registry for Amazon Ad Console
# Used by loop-audit, loop-cost, and tooling.

patterns:
  - id: daily-triage
    name: Daily Triage
    file: daily-triage.md
    goal: Prioritized morning scan of CI, issues, commits, and chat
    cadence: 1d-2h
    risk: low
    tools: [codex, opencode, github-actions]
    skills: [loop-triage, minimal-fix]
    state: STATE.md
    phases: [report, act-small-wins, escalate]
    human_gates: [design-decisions, multi-file-refactors, prisma-changes]
    starter: starters/minimal-loop
    week_one_mode: L1
    token_cost: low
    cost:
      tokens_noop: 5000
      tokens_report: 50000
      tokens_action: 200000
      stable_fraction: 0.35
      suggested_daily_cap: 100000
      early_exit_required: false

  - id: minimal-fix
    name: Minimal Fix
    file: minimal-fix.md
    goal: Smallest possible code change for a scoped issue
    cadence: on-demand
    risk: medium
    tools: [codex, opencode]
    skills: [minimal-fix, loop-verifier]
    state: STATE.md
    phases: [reproduce, identify, fix, verify, summarize]
    human_gates: [security, payments, auth, max-fix-attempts]
    week_one_mode: L2
    token_cost: medium
    cost:
      tokens_noop: 3000
      tokens_report: 20000
      tokens_action: 100000
      stable_fraction: 0.30
      suggested_daily_cap: 200000
      early_exit_required: false
