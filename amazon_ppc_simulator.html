<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon PPC Training Simulator V3.3</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #5f6b7a;
      --line: #d5d9d9;
      --line-dark: #9ba4ad;
      --nav: #131921;
      --nav-2: #232f3e;
      --orange: #ff9900;
      --orange-dark: #e47911;
      --blue: #0073bb;
      --blue-dark: #004f83;
      --green: #067d62;
      --red: #b12704;
      --yellow: #f7ca00;
      --chip: #eef2f7;
      --shadow: 0 1px 2px rgba(15, 23, 42, .08), 0 8px 24px rgba(15, 23, 42, .06);
      --radius: 10px;
      --font: "Amazon Ember", "Inter", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 248px 1fr 360px; min-height: 100vh; }
    .topbar { grid-column: 1 / -1; height: 54px; background: var(--nav); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #0b1117; position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .2px; }
    .brand-mark { width: 32px; height: 32px; border-radius: 6px; background: linear-gradient(135deg, var(--orange), #ffd814); color: #111; display: grid; place-items: center; font-weight: 900; box-shadow: inset 0 -2px 0 rgba(0,0,0,.16); }
    .brand small { display:block; color:#d6e4f0; font-weight:500; margin-top: 1px; }
    .top-actions { display:flex; align-items:center; gap: 10px; }
    .account-pill { border: 1px solid #526170; border-radius: 999px; color: #e8eef5; padding: 7px 10px; font-size: 13px; background: #1b2530; }
    .sandbox-badge { background: #213347; border: 1px solid #556575; color: #f3f8ff; border-radius: 999px; padding: 7px 10px; font-size: 12px; }

    .sidebar { background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 54px; height: calc(100vh - 54px); overflow: auto; }
    .sidebar h4 { margin: 16px 10px 7px; color: #667085; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .nav-item { width: 100%; border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 10px; color: #182230; border-radius: 8px; padding: 10px; margin: 2px 0; font-size: 14px; }
    .nav-item:hover { background: #f3f6f9; }
    .nav-item.active { background: #e7f1f8; color: #004f83; font-weight: 700; border-left: 4px solid var(--orange); padding-left: 6px; }
    .nav-icon { width: 22px; height: 22px; display:grid; place-items:center; border-radius: 6px; background: #eef2f6; font-size: 13px; }
    .nav-item.active .nav-icon { background: white; }
    .sidebar-footer { margin: 14px 10px; padding: 12px; background: #fff8e6; border: 1px solid #ffe3a1; border-radius: 10px; font-size: 12px; color: #5f3b00; line-height: 1.45; }

    .main { padding: 18px 22px 40px; overflow: auto; max-width: 100%; }
    .right-rail { background: #fff; border-left: 1px solid var(--line); padding: 14px; position: sticky; top: 54px; height: calc(100vh - 54px); overflow: auto; }

    .page-title { display:flex; align-items:flex-start; justify-content:space-between; gap: 14px; margin-bottom: 14px; }
    .page-title h1 { margin: 0; font-size: 26px; line-height:1.15; }
    .page-title p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 820px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card.pad { padding: 16px; }
    .card-title { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-bottom: 12px; }
    .card-title h2, .card-title h3 { margin: 0; font-size: 18px; }
    .card-title span { color: var(--muted); font-size: 13px; }
    .grid { display:grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .metric { padding: 14px; }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .metric .value { font-size: 25px; font-weight: 750; margin-top: 6px; }
    .metric .delta { font-size: 12px; margin-top: 6px; color: var(--muted); }
    .delta.good { color: var(--green); }
    .delta.bad { color: var(--red); }

    .toolbar { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display:flex; align-items:center; gap: 8px; flex-wrap:wrap; box-shadow: var(--shadow); margin-bottom: 14px; }
    .search { min-width: 250px; flex: 1; position: relative; }
    .search input { width:100%; border: 1px solid var(--line-dark); border-radius: 8px; padding: 9px 10px 9px 34px; font-size: 14px; background: white; }
    .search:before { content: "⌕"; position:absolute; left: 11px; top: 6px; color: #667085; font-size: 20px; transform: rotate(-10deg); }
    .select, .input, .textarea { border: 1px solid var(--line-dark); border-radius: 8px; padding: 9px 10px; font-size: 14px; background: white; min-height: 38px; }
    .textarea { min-height: 104px; width: 100%; resize: vertical; }
    .btn { border: 1px solid var(--line-dark); background: #fff; border-radius: 8px; padding: 9px 12px; font-size: 14px; color: #182230; display:inline-flex; align-items:center; justify-content:center; gap: 7px; min-height: 38px; }
    .btn:hover { background: #f5f7fa; }
    .btn.primary { border-color: #d28700; background: #ffd814; color: #111; box-shadow: inset 0 -2px 0 rgba(0,0,0,.08); }
    .btn.primary:hover { background: #f7ca00; }
    .btn.blue { border-color: var(--blue-dark); background: var(--blue); color: white; }
    .btn.blue:hover { background: var(--blue-dark); }
    .btn.danger { border-color: #d0a39a; color: var(--red); background: #fff8f6; }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--blue); }
    .btn.small { padding: 6px 8px; min-height: 30px; font-size: 12px; border-radius: 6px; }
    .btn[disabled] { opacity:.5; cursor:not-allowed; }

    .pill-row { display:flex; gap: 7px; flex-wrap: wrap; }
    .pill { border: 1px solid var(--line); background:#fff; border-radius:999px; padding: 7px 10px; font-size: 12px; color: #344054; display:inline-flex; gap: 6px; align-items:center; }
    .pill.active { background:#e7f1f8; color:#004f83; border-color:#9dccf0; font-weight:700; }
    .pill.orange { background:#fff4db; color:#8a4b00; border-color:#ffd188; }
    .pill.green { background:#e8f7f1; color:#05603a; border-color:#9ee4c6; }
    .pill.red { background:#fff0eb; color:#b12704; border-color:#ffc2b3; }
    .pill.purple { background:#f4f0ff; color:#5925dc; border-color:#d9ccff; }
    .status { border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 700; display:inline-flex; align-items:center; gap: 5px; }
    .status.enabled { color:#05603a; background:#e8f7f1; }
    .status.paused { color:#5f3b00; background:#fff3cd; }
    .status.archived { color:#667085; background:#eef2f6; }
    .status.draft { color:#004f83; background:#e7f1f8; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f7f8fa; color: #344054; text-align: left; border-bottom: 1px solid var(--line); padding: 11px 10px; font-weight: 700; position: sticky; top: 0; z-index: 1; }
    td { border-bottom: 1px solid #edf0f2; padding: 10px; vertical-align: middle; }
    tr:hover td { background:#fafcff; }
    .table-wrap { overflow:auto; max-width:100%; border:1px solid var(--line); border-radius: var(--radius); background:white; box-shadow: var(--shadow); }
    .row-link { color: var(--blue); font-weight: 700; background:none; border:0; padding:0; text-align:left; font-size: inherit; }
    .muted { color: var(--muted); }
    .mono { font-variant-numeric: tabular-nums; }
    .money { font-variant-numeric: tabular-nums; white-space:nowrap; }
    .acos-good { color: var(--green); font-weight: 700; }
    .acos-mid { color: #9a6700; font-weight: 700; }
    .acos-bad { color: var(--red); font-weight: 700; }

    .tabs { display:flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 10px 0 14px; overflow:auto; }
    .tab { border: 0; background: transparent; padding: 11px 13px; color: #344054; border-bottom: 3px solid transparent; white-space: nowrap; }
    .tab.active { color: #004f83; border-color: var(--orange); font-weight: 700; }
    .breadcrumb { display:flex; align-items:center; gap: 7px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .breadcrumb button { border:0; background:transparent; color: var(--blue); padding: 0; }
    .detail-header { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .detail-header h2 { margin: 0 0 8px; font-size: 22px; }
    .detail-meta { display:flex; flex-wrap:wrap; gap: 8px; align-items:center; }

    .wizard { display:grid; grid-template-columns: 240px 1fr; gap: 16px; align-items:start; }
    .steps { background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow: var(--shadow); padding: 10px; position: sticky; top: 72px; }
    .step { display:flex; gap: 9px; align-items:flex-start; padding: 10px; border-radius: 8px; color:#475467; }
    .step.active { background:#e7f1f8; color:#004f83; font-weight:700; }
    .step.done { color:#05603a; }
    .step-num { width:22px; height:22px; display:grid; place-items:center; border-radius:999px; background:#eef2f6; font-size:12px; flex:0 0 auto; }
    .step.active .step-num { background:#fff; color:#004f83; }
    .step.done .step-num { background:#e8f7f1; color:#05603a; }
    .wizard-panel { background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow: var(--shadow); padding:18px; }
    .choice-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .choice { border: 1px solid var(--line-dark); border-radius: 12px; padding: 14px; background:#fff; cursor:pointer; min-height: 168px; display:flex; flex-direction:column; gap: 8px; }
    .choice:hover { box-shadow: var(--shadow); border-color:#8792a2; }
    .choice.active { outline: 3px solid #fbd38d; border-color:#d28700; }
    .choice h3 { margin:0; font-size:18px; }
    .choice p { margin:0; color: var(--muted); font-size: 13px; line-height:1.4; }
    .form-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field label { display:block; font-weight:700; margin-bottom:6px; font-size:13px; color:#344054; }
    .field small { display:block; color: var(--muted); margin-top:5px; line-height:1.35; }
    .field.full { grid-column:1 / -1; }
    .input.full, .select.full { width:100%; }
    .review-box { border:1px solid var(--line); background:#f9fafb; border-radius:10px; padding:12px; margin-top:10px; }
    .review-row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid #edf0f2; }
    .review-row:last-child { border-bottom:0; }
    .error-list { background:#fff5f3; border:1px solid #ffc2b3; color:#912018; border-radius:10px; padding:10px 12px; margin:12px 0; font-size:13px; }
    .error-list ul { margin:6px 0 0 18px; padding:0; }

    .mission-card { border:1px solid var(--line); border-radius: 10px; padding: 12px; background:#fff; margin-bottom: 10px; }
    .mission-card.active { border-color:#d28700; box-shadow:0 0 0 3px #fff1c7; }
    .mission-card h3 { margin:0 0 6px; font-size:15px; }
    .mission-card p { margin:0 0 8px; color:var(--muted); font-size:12px; line-height:1.35; }
    .objective { display:flex; gap: 8px; align-items:flex-start; padding:7px 0; border-bottom:1px solid #edf0f2; font-size:13px; }
    .objective:last-child { border-bottom:0; }
    .check { width:18px; height:18px; border-radius:999px; border:1px solid var(--line-dark); display:grid; place-items:center; flex:0 0 auto; font-size:12px; color:white; }
    .objective.done .check { background:var(--green); border-color:var(--green); }
    .score-ring { width:66px; height:66px; border-radius:50%; background: conic-gradient(var(--orange) var(--score), #edf0f2 0); display:grid; place-items:center; margin: 4px auto 10px; }
    .score-ring span { width:50px; height:50px; background:white; border-radius:50%; display:grid; place-items:center; font-weight:800; }
    .coach-tip { background:#eff8ff; border:1px solid #b2ddff; color:#184e77; border-radius: 10px; padding: 11px; font-size:13px; line-height:1.45; margin-bottom:10px; }
    .warning-tip { background:#fff8e6; border:1px solid #ffe3a1; color:#5f3b00; border-radius: 10px; padding: 11px; font-size:13px; line-height:1.45; }

    .split { display:grid; grid-template-columns: 1.1fr .9fr; gap:14px; }
    .insight-list { display:grid; gap: 10px; }
    .insight { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; display:flex; gap: 10px; align-items:flex-start; }
    .insight .dot { width: 12px; height:12px; border-radius:999px; margin-top:4px; flex:0 0 auto; }
    .dot.red { background: var(--red); }
    .dot.orange { background: var(--orange); }
    .dot.green { background: var(--green); }
    .dot.blue { background: var(--blue); }
    .insight h4 { margin:0 0 4px; font-size:14px; }
    .insight p { margin:0; color:var(--muted); font-size:13px; line-height:1.4; }

    .nav-map { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .map-node { border:1px solid var(--line); border-radius:12px; background:#fff; padding:13px; min-height: 130px; position:relative; }
    .map-node h3 { margin: 0 0 6px; font-size: 15px; }
    .map-node p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .map-node .pill { margin-top: 9px; }

    .toast-stack { position: fixed; bottom: 18px; right: 18px; z-index: 50; display:grid; gap: 8px; max-width: 360px; }
    .toast { background:#111827; color:#fff; border-radius: 10px; padding: 12px; box-shadow: var(--shadow); font-size:13px; line-height:1.35; }
    .toast.good { background:#055c47; }
    .toast.bad { background:#912018; }
    .toast.warn { background:#8a4b00; }

    .kbd { border:1px solid #cfd5dd; border-bottom-width:2px; background:#fff; border-radius:6px; padding:1px 5px; font-size:12px; color:#344054; }
    .empty { text-align:center; padding: 38px 16px; color: var(--muted); }
    .empty h3 { color:#182230; margin: 0 0 6px; }
    .tag-sp { background:#e7f1f8; color:#004f83; border:1px solid #b2d8f0; }
    .tag-sb { background:#f4f0ff; color:#5925dc; border:1px solid #d9ccff; }
    .tag-sd { background:#e8f7f1; color:#05603a; border:1px solid #9ee4c6; }
    .adtag { border-radius:999px; padding:4px 7px; font-size:11px; font-weight:800; display:inline-flex; }

    .module-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .module { background:#fff; border:1px solid var(--line); border-radius:12px; padding: 14px; box-shadow: var(--shadow); }
    .module h3 { margin:0 0 8px; }
    .module ul { margin: 8px 0 0 20px; padding:0; color:var(--muted); line-height:1.6; font-size:13px; }

    .small-copy { font-size:12px; color:var(--muted); line-height:1.45; }

    .trainer-score { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; }
    .log-good { color: var(--green); font-weight:700; }
    .log-warn { color: #9a6700; font-weight:700; }
    .log-bad { color: var(--red); font-weight:700; }
    .codebox { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#0f172a; color:#e5e7eb; border-radius:10px; padding:12px; white-space:pre-wrap; overflow:auto; font-size:12px; line-height:1.5; }
    .bulk-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:start; }
    .doc-section { margin-bottom:14px; }
    .doc-section h2 { margin:0 0 8px; }
    .doc-section ul { margin:8px 0 0 20px; padding:0; color:var(--muted); line-height:1.6; }
    .hidden { display:none !important; }

    .nav-drill-target { outline: 3px solid var(--orange) !important; outline-offset: 3px; box-shadow: 0 0 0 7px rgba(255,153,0,.22), 0 0 0 9999px rgba(15,23,42,.10) !important; position: relative; z-index: 30 !important; border-radius: 8px; animation: drillPulse 1.2s ease-in-out infinite; }
    @keyframes drillPulse { 0%, 100% { outline-color: var(--orange); } 50% { outline-color: #ffd814; } }
    .nav-drill-card { border: 1px solid #d28700; border-radius: 12px; background: #fffdf6; padding: 13px; box-shadow: 0 0 0 3px #fff1c7; margin-bottom: 12px; }
    .nav-drill-card h2, .nav-drill-card h3 { margin: 0 0 6px; }
    .nav-drill-step { display:flex; gap: 9px; align-items:flex-start; padding: 9px; border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:8px; font-size:13px; }
    .nav-drill-step.current { border-color:#d28700; background:#fff8e6; box-shadow:0 0 0 2px #fff1c7; }
    .nav-drill-step.done { border-color:#9ee4c6; background:#effaf5; color:#05603a; }
    .nav-drill-step.muted-step { opacity:.72; }
    .nav-drill-num { width:22px; height:22px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--line-dark); background:#fff; flex:0 0 auto; font-size:12px; font-weight:800; }
    .nav-drill-step.done .nav-drill-num { background:var(--green); border-color:var(--green); color:white; }
    .nav-progress { height: 9px; background: #edf0f2; border-radius: 999px; overflow:hidden; margin: 9px 0 12px; }
    .nav-progress > span { display:block; height:100%; background: linear-gradient(90deg, var(--orange), #ffd814); width: var(--pct); }
    .drill-route { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
    .drill-route span { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 8px; color:#344054; font-size:12px; }
    .drill-result-table td, .drill-result-table th { font-size:12px; }


    @media (max-width: 1240px) {
      .app { grid-template-columns: 220px 1fr; }
      .right-rail { grid-column: 1 / -1; height: auto; position: relative; top: auto; border-left:0; border-top:1px solid var(--line); }
      .main { padding-right: 18px; }
    }
    @media (max-width: 900px) {
      .app { display:block; }
      .topbar { position:relative; height:auto; padding:12px; align-items:flex-start; gap:10px; flex-direction:column; }
      .sidebar { position:relative; top:auto; height:auto; display:flex; overflow:auto; gap:6px; border-right:0; border-bottom:1px solid var(--line); }
      .sidebar h4, .sidebar-footer { display:none; }
      .nav-item { min-width:150px; }
      .main { padding:14px; }
      .grid-4, .grid-3, .grid-2, .choice-grid, .form-grid, .wizard, .split, .nav-map, .module-grid, .trainer-score, .bulk-grid { grid-template-columns:1fr; }
      .steps { position:relative; top:auto; }
      .right-rail { display:block; }
    }
  </style>
</head>

  <script>

      }));
      c.targets = (Array.isArray(c.targets) ? c.targets : []).map(t => metricDefaults(Object.assign({
        id: t.id || uid('T'), campaignId: c.id, adGroupId: c.adGroups.some(ag => ag.id === t.adGroupId) ? t.adGroupId : primary.id, type: t.type || 'Keyword', value: t.value || 'training target', match: t.match || 'Exact', bid: Math.max(0.02, Number(t.bid || c.defaultBid)), status: ['Enabled','Paused','Archived'].includes(t.status) ? t.status : c.status
      }, t, { campaignId: c.id, adGroupId: c.adGroups.some(ag => ag.id === t.adGroupId) ? t.adGroupId : primary.id, bid: Math.max(0.02, Number(t.bid || c.defaultBid)) })));
      c.searchTerms = (Array.isArray(c.searchTerms) ? c.searchTerms : []).map(st => metricDefaults(Object.assign({
        id: st.id || uid('ST'), campaignId: c.id, adGroupId: c.adGroups.some(ag => ag.id === st.adGroupId) ? st.adGroupId : primary.id, term: st.term || '', target: st.target || '', recommendation: st.recommendation || 'Review'
      }, st, { campaignId: c.id, adGroupId: c.adGroups.some(ag => ag.id === st.adGroupId) ? st.adGroupId : primary.id })));
      c.searchTerms.forEach(st => { st.targetId = linkSearchTermTarget(c, st); if (!st.target && st.targetId) st.target = (c.targets.find(t => t.id === st.targetId) || {}).value || ''; });
      c.negatives = (Array.isArray(c.negatives) ? c.negatives : []).map(n => ({
        id: n.id || uid('NEG'), campaignId: c.id, adGroupId: c.adGroups.some(ag => ag.id === n.adGroupId) ? n.adGroupId : primary.id, type: n.type || 'Negative exact', value: n.value || '', sourceSearchTermId: n.sourceSearchTermId || ''
      })).filter(n => n.value);
      c.budgetRules = (Array.isArray(c.budgetRules) ? c.budgetRules : []).map((r, i) => ({
        id: r.id || uid('BR'), campaignId: c.id, name: r.name || `Budget rule ${i + 1}`, type: r.type || 'Schedule', increase: Math.max(1, Number(r.increase || 1)), condition: r.condition || 'Training condition'
      }));
      if (c.type !== 'SP') {
        c.creative = Object.assign({ headline:'', brandName:'', logo:'', destination:'Product detail page', video:'', image:'Auto generated' }, c.creative || {});
        c.creativeStatus = c.creativeStatus || 'Approved';
        c.creativeIssue = c.creativeIssue || '';
      }
      if (c.status === 'Archived') {
        c.adGroups.forEach(ag => ag.status = 'Archived');
        c.ads.forEach(ad => ad.status = 'Archived');
        c.targets.forEach(t => t.status = 'Archived');
      }
    }

    function linkSearchTermTarget(c, st) {
      if (!st) return '';
      if (st.targetId && c.targets.some(t => t.id === st.targetId)) return st.targetId;
      const targetText = String(st.target || '').toLowerCase();
      const termText = String(st.term || '').toLowerCase();
      const exact = c.targets.find(t => String(t.value || '').toLowerCase() === targetText);
      if (exact) return exact.id;
      const auto = c.targets.find(t => String(t.value || '').toLowerCase() === targetText || String(t.match || '').toLowerCase() === targetText);
      if (auto) return auto.id;
      const fuzzy = c.targets.find(t => targetText && String(t.value || '').toLowerCase().includes(targetText)) || c.targets.find(t => termText && termText.includes(String(t.value || '').toLowerCase()));
      return fuzzy ? fuzzy.id : '';
    }

    function allScenarios() {
      return scenarioTemplates.concat((state.generatedScenarios || []).map(hydrateGeneratedScenario));
    }

    function hydrateGeneratedScenario(gs) {
      return Object.assign({}, gs, { objectives: scenarioObjectivesFor(gs) });
    }

    function scenarioObjectivesFor(gs) {
      if (gs.kind === 'sp-waste') return [
        { id:'open-generated-sp', text:'Open the generated SP discovery campaign', check: s => s.selectedCampaignId === gs.subjectId },
        { id:'view-generated-terms', text:'Open Search terms for the generated campaign', check: s => s.selectedCampaignId === gs.subjectId && s.selectedTab === 'searchTerms' },
        { id:'negate-generated-waste', text:'Add a negative for the zero-sale waste term', check: s => hasNegative(s, gs.subjectId, gs.wasteTerm) },
        { id:'harvest-generated-winner', text:'Harvest the converting term into an exact SP manual target', check: s => s.campaigns.some(c => c.type === 'SP' && c.targetingMode.includes('Manual') && c.targets.some(t => t.value.toLowerCase() === gs.winnerTerm.toLowerCase() && t.match === 'Exact')) }
      ];
      if (gs.kind === 'sb-creative') return [
        { id:'open-generated-sb', text:'Open the rejected SB creative campaign', check: s => s.selectedCampaignId === gs.subjectId },
        { id:'review-generated-sb', text:'Review campaign overview and creative issue', check: s => s.selectedCampaignId === gs.subjectId && s.selectedTab === 'overview' },
        { id:'repair-generated-sb', text:'Fix the creative rejection in the simulator', check: s => { const c = campaignById(s, gs.subjectId); return c && c.creativeStatus === 'Approved'; } },
        { id:'enable-generated-sb', text:'Enable the campaign after approval', check: s => { const c = campaignById(s, gs.subjectId); return c && c.status === 'Enabled'; } }
      ];
      if (gs.kind === 'sd-scale') return [
        { id:'open-generated-sd', text:'Open the SD remarketing campaign', check: s => s.selectedCampaignId === gs.subjectId },
        { id:'view-placement-sd', text:'Open placement controls', check: s => s.selectedCampaignId === gs.subjectId && s.selectedTab === 'placements' },
        { id:'budget-rule-sd', text:'Create a budget rule for the winning audience', check: s => { const c = campaignById(s, gs.subjectId); return c && c.budgetRules.length > 0; } },
        { id:'simulate-sd', text:'Run 7-day simulation after scaling decision', check: s => s.actionLog.some(a => a.type === 'simulation_run') }
      ];
      return [];
    }

    function integritySummary() {
      const campaigns = state.campaigns.length;
      const adGroups = state.campaigns.reduce((a,c)=>a+(c.adGroups||[]).length,0);
      const ads = state.campaigns.reduce((a,c)=>a+(c.ads||[]).length,0);
      const targets = state.campaigns.reduce((a,c)=>a+(c.targets||[]).length,0);
      const searchTerms = state.campaigns.reduce((a,c)=>a+(c.searchTerms||[]).length,0);
      const negatives = state.campaigns.reduce((a,c)=>a+(c.negatives||[]).length,0);
      const rules = state.campaigns.reduce((a,c)=>a+(c.budgetRules||[]).length,0);
      return { campaigns, adGroups, ads, targets, searchTerms, negatives, rules };
    }

    function integrityChecks() {
      const checks = [];
      const add = (severity, entity, message, fix='') => checks.push({ severity, entity, message, fix });
      const campaignIds = new Set();
      const productSet = new Set(products.map(p => p.asin));
      state.campaigns.forEach(c => {
        if (campaignIds.has(c.id)) add('error', c.id, 'Duplicate campaign ID detected.', 'Duplicate or regenerate one campaign ID.');
        campaignIds.add(c.id);
        if (!c.adGroups || !c.adGroups.length) add('error', c.id, 'Campaign has no ad group.', 'Run self-heal to create a default ad group.');
        if (c.dailyBudget <= 0) add('error', c.id, 'Daily budget is not valid.', 'Set a daily budget above zero.');
        if (c.defaultBid <= 0) add('error', c.id, 'Default bid is not valid.', 'Set a default bid above zero.');
        if (c.endDate && c.startDate && new Date(c.endDate) < new Date(c.startDate)) add('error', c.id, 'End date is before start date.', 'Move the end date after the start date.');
        (c.products || []).forEach(asin => {
          if (!productSet.has(asin)) add('error', c.id, `Product ASIN ${asin} does not exist in product catalog.`, 'Use a valid catalog ASIN.');
          const p = products.find(x => x.asin === asin);
          if (p && p.status !== 'Retail Ready' && c.status === 'Enabled') add('warn', c.id, `${asin} is ${p.status} while campaign is enabled.`, 'Pause scaling or swap to a retail-ready product.');
        });
        const adGroupIds = new Set((c.adGroups || []).map(ag => ag.id));
        (c.adGroups || []).forEach(ag => {
          if (ag.campaignId !== c.id) add('error', ag.id, 'Ad group points to the wrong campaign.', 'Run self-heal to relink ad group.');
          if (c.status === 'Archived' && ag.status !== 'Archived') add('error', ag.id, 'Archived campaign has non-archived ad group.', 'Archive children with parent.');
        });
        (c.ads || []).forEach(ad => {
          if (ad.campaignId !== c.id) add('error', ad.id, 'Product ad points to the wrong campaign.', 'Run self-heal to relink product ad.');
          if (!adGroupIds.has(ad.adGroupId)) add('error', ad.id, 'Product ad has missing ad group reference.', 'Attach to an existing ad group.');
          if (!productSet.has(ad.asin)) add('error', ad.id, `Product ad ASIN ${ad.asin} is not in catalog.`, 'Use a valid catalog ASIN.');
        });
        (c.targets || []).forEach(t => {
          if (t.campaignId !== c.id) add('error', t.id, 'Target points to the wrong campaign.', 'Run self-heal to relink target.');
          if (!adGroupIds.has(t.adGroupId)) add('error', t.id, 'Target has missing ad group reference.', 'Attach to an existing ad group.');
          if (Number(t.bid) <= 0) add('error', t.id, 'Target bid is not valid.', 'Set a bid above zero.');
          if (c.status === 'Archived' && t.status !== 'Archived') add('error', t.id, 'Archived campaign has non-archived target.', 'Archive children with parent.');
        });
        (c.searchTerms || []).forEach(st => {
          if (st.campaignId !== c.id) add('error', st.id, 'Search term points to the wrong campaign.', 'Run self-heal to relink search term.');
          if (c.type === 'SD') add('warn', st.id, 'Sponsored Display campaign has search term rows.', 'Use audience/contextual reports for SD instead.');
          if (c.type !== 'SD' && !st.targetId) add('warn', st.id, `Search term "${st.term}" has no target link.`, 'Attach it to the matched target.');
        });
        const negativeKeys = new Set();
        (c.negatives || []).forEach(n => {
          const key = `${n.type}|${String(n.value).toLowerCase()}`;
          if (negativeKeys.has(key)) add('warn', n.id, 'Duplicate negative targeting row.', 'Remove duplicate negative.');
          negativeKeys.add(key);
          if (n.campaignId !== c.id) add('error', n.id, 'Negative points to the wrong campaign.', 'Run self-heal to relink negative.');
        });
        (c.budgetRules || []).forEach(r => {
          if (r.campaignId !== c.id) add('error', r.id, 'Budget rule points to the wrong campaign.', 'Run self-heal to relink budget rule.');
          if (Number(r.increase) <= 0 || Number(r.increase) > 200) add('warn', r.id, 'Budget rule increase is outside the training safe range.', 'Use 1% to 200%.');
        });
        if (c.type === 'SB') {
          if (c.adFormat === 'Store spotlight' && c.creative.destination !== 'Brand Store') add('error', c.id, 'Store Spotlight should use a Brand Store destination.', 'Switch destination to Brand Store.');
          if (c.adFormat === 'Store spotlight' && mockStorePages.filter(p => p.ready && p.products.length).length < 4) add('error', c.id, 'Store Spotlight needs at least four ready Store pages in this simulator.', 'Prepare more Store pages.');
          if (c.adFormat === 'Product collection' && c.products.length < 3) add('error', c.id, 'SB Product Collection needs at least three products.', 'Select three retail-ready products.');
          if (c.adFormat === 'Video' && !c.creative.video) add('error', c.id, 'SB Video has no video asset placeholder.', 'Add a video asset placeholder.');
          if (c.creativeStatus === 'Rejected') add('warn', c.id, `Creative rejected: ${c.creativeIssue || 'review needed'}`, 'Use Fix creative approval.');
        }
        if (c.type === 'SD' && !(c.targetingMode.includes('Contextual') || c.targetingMode.includes('Audiences'))) add('error', c.id, 'SD targeting mode is not contextual or audience-based.', 'Choose contextual or audience targeting.');
      });
      return checks;
    }

    function integrityScore() {
      const checks = integrityChecks();
      const errors = checks.filter(x => x.severity === 'error').length;
      const warnings = checks.filter(x => x.severity === 'warn').length;
      return { checks, errors, warnings, score: Math.max(0, Math.min(100, 100 - errors * 15 - warnings * 5)) };
    }

    function autoRepairState() {
      normalizeState();
      state.campaigns.forEach(c => {
        if (c.status === 'Archived') { c.adGroups.forEach(ag => ag.status = 'Archived'); c.ads.forEach(ad => ad.status = 'Archived'); c.targets.forEach(t => t.status = 'Archived'); }
        const seen = new Set();
        c.negatives = c.negatives.filter(n => { const key = `${n.type}|${String(n.value).toLowerCase()}`; if (seen.has(key)) return false; seen.add(key); return true; });
      });
      state.integrityLastRun = new Date().toISOString();
      logAction('integrity_repair', 'Relationship self-heal completed', 'good');
      toast('Integrity self-heal completed.', 'good');
      render();
    }

    function relationshipRows() {
      return state.campaigns.map(c => ({
        campaign: c,
        adGroups: c.adGroups || [],
        ads: c.ads || [],
        targets: c.targets || [],
        searchTerms: c.searchTerms || [],
        negatives: c.negatives || [],
        rules: c.budgetRules || []
      }));
    }

    function buildObjectMap() {
      normalizeState();
      return { version: APP_VERSION, exportedAt: new Date().toISOString(), summary: integritySummary(), integrity: integrityScore(), campaigns: state.campaigns.map(c => ({ id:c.id, type:c.type, name:c.name, status:c.status, adGroups:c.adGroups, ads:c.ads, targets:c.targets, searchTerms:c.searchTerms, negatives:c.negatives, budgetRules:c.budgetRules })) };
    }

    function downloadObjectMap() {
      downloadText('amazon-ppc-simulator-v3-object-map.json', JSON.stringify(buildObjectMap(), null, 2), 'application/json');
      logAction('export_object_map', 'Object map exported', 'good');
      toast('Object map JSON exported.', 'good');
    }

    function csvParseRows(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('').forEach((ch, i, arr) => {
        if (ch === '"') {
          if (quoted && arr[i + 1] === '"') { cell += '"'; arr[i + 1] = ''; }
          else quoted = !quoted;
        } else if (ch === ',' && !quoted) { row.push(cell.trim()); cell = ''; }
        else if (ch === '\n' && !quoted) { row.push(cell.trim()); if (row.some(Boolean)) rows.push(row); row = []; cell = ''; }
        else cell += ch;
      });
      row.push(cell.trim()); if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function campaignById(s, id) { return s.campaigns.find(c => c.id === id); }
    function hasNegative(s, campaignId, value) {
      const c = campaignById(s, campaignId);
      return c && c.negatives.some(n => n.value.toLowerCase() === value.toLowerCase());
    }
    function calc(m) {
      const ctr = m.impressions ? m.clicks / m.impressions * 100 : 0;
      const cpc = m.clicks ? m.spend / m.clicks : 0;
      const acos = m.sales ? m.spend / m.sales * 100 : 0;
      const roas = m.spend ? m.sales / m.spend : 0;
      const cvr = m.clicks ? m.orders / m.clicks * 100 : 0;
      return { ctr, cpc, acos, roas, cvr };
    }
    function totalMetrics(camps) {
      return camps.reduce((acc, c) => {
        Object.keys(acc).forEach(k => acc[k] += Number(c.metrics[k] || 0));
        return acc;
      }, { impressions:0, clicks:0, spend:0, sales:0, orders:0 });
    }
    function campaignTypeLabel(t) {
      if (t === 'SP') return 'Sponsored Products';
      if (t === 'SB') return 'Sponsored Brands';
      if (t === 'SD') return 'Sponsored Display';
      return t;
    }
    function adTypeTag(t) { return `<span class="adtag tag-${t.toLowerCase()}">${t}</span>`; }
    function statusHtml(status) { return `<span class="status ${status.toLowerCase()}">● ${status}</span>`; }
    function acosClass(v) { return v <= 25 ? 'acos-good' : v <= 40 ? 'acos-mid' : 'acos-bad'; }
    function productTitle(asin) { const p = products.find(x => x.asin === asin); return p ? p.title : asin; }
    function productShort(asin) { const p = products.find(x => x.asin === asin); return p ? `${p.image} ${p.title}` : asin; }
    function safe(str) { return String(str || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function toast(message, tone = '') {
      state.toasts.unshift({ id: uid('toast'), message, tone });
      state.toasts = state.toasts.slice(0, 4);
      render();
      setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.message !== message);
        render();
      }, 2800);
    }

    function logAction(type, detail, quality = '') {
      const fb = evaluateAction(type, detail, quality);
      state.actionLog.push({ type, detail, time: new Date().toISOString(), quality: fb.tone, feedback: fb.message, trainee: state.traineeName });
      state.feedbackLog.unshift({ ...fb, type, detail, time: new Date().toISOString(), trainee: state.traineeName });
      state.feedbackLog = state.feedbackLog.slice(0, 80);
      const active = getActiveScenario();
      if (active) updateScenarioProgress(active);
    }

        function evaluateAction(type, detail, quality) {
      if (quality && typeof quality === 'object') {
        return { tone: quality.tone || 'warn', message: quality.message || 'Action reviewed. Explain the data reason.' };
      }
      if (quality) return { tone: quality, message: quality === 'good' ? 'Good operator move. Reason was defensible from the data.' : quality === 'bad' ? 'Risky action. Stop and review before repeating.' : 'Needs review. Add account context before repeating.' };
      const good = ['negative_added','harvest_term','budget_rule_created','campaign_created','export_report','copy_report','simulation_run','bulk_apply','request_report','creative_repair','integrity_repair','export_object_map','scenario_generated','mission_started'];
      const warn = ['bid_up','bid_down','placement_change','budget_change','status_change','duplicate_campaign','open_campaign','open_tab','bulk_preview'];
      const bad = ['archive_campaign'];
      if (good.includes(type)) return { tone:'good', message:'Good training action. Ask the VA to explain why it was safe.' };
      if (warn.includes(type)) return { tone:'warn', message:'Requires account context. Check ACOS, CVR, margin, inventory, and goal first.' };
      if (bad.includes(type)) return { tone:'bad', message:'High-risk action. Archive only after approval and rollback review.' };
      return { tone:'warn', message:'Action logged. Trainer should ask for the reasoning.' };
    }



    function findSearchTermInCampaign(c, term) {
      const needle = String(term || '').toLowerCase();
      return c && (c.searchTerms || []).find(st => String(st.term || '').toLowerCase() === needle);
    }

    function targetAcos(t) { return calc(t || {}).acos; }

    function minimumBudget(type) {
      if (type === 'SB') return 30;
      if (type === 'SD') return 20;
      return 10;
    }

    function gradeBidMove(c, t, mult, oldBid, newBid) {
      const x = calc(t);
      const direction = mult > 1 ? 'increase' : 'decrease';
      if (!t.clicks) return { tone:'warn', message:`Bid ${direction} has no click history. Use launch goal or target benchmark, not performance data.` };
      if (mult > 1) {
        if (t.orders === 0 && t.clicks >= 15) return { tone:'bad', message:`Bid up on ${t.value} is risky: ${t.clicks} clicks, no orders, ${fmt.money(t.spend)} spend.` };
        if (x.acos > 40) return { tone:'bad', message:`Bid up conflicts with high ACOS (${fmt.pct(x.acos)}). Lower bid, pause, or review query quality first.` };
        if (x.acos <= 25 && t.orders > 0) return { tone:'good', message:`Bid up is defensible: ${fmt.pct(x.acos)} ACOS with ${t.orders} orders.` };
        return { tone:'warn', message:`Bid up needs margin and objective context. Current ACOS is ${fmt.pct(x.acos)}.` };
      }
      if (t.orders === 0 && t.clicks >= 15) return { tone:'good', message:`Bid down is defensible: ${t.clicks} clicks with no orders.` };
      if (x.acos > 40) return { tone:'good', message:`Bid down matches high ACOS control: ${fmt.pct(x.acos)}.` };
      if (x.acos <= 25 && t.orders > 0) return { tone:'warn', message:`Bid down may suppress a winner: ${fmt.pct(x.acos)} ACOS with ${t.orders} orders.` };
      return { tone:'warn', message:`Bid down logged. Check CVR, rank goal, and budget pacing before repeating.` };
    }

    function gradePauseTarget(t) {
      const x = calc(t || {});
      if (!t.clicks) return { tone:'warn', message:'Pause has no click history. Confirm this is a structural cleanup, not a performance decision.' };
      if (t.orders === 0 && t.clicks >= 20) return { tone:'good', message:`Pause is defensible: ${t.clicks} clicks, no orders, ${fmt.money(t.spend)} spend.` };
      if (x.acos > 60) return { tone:'good', message:`Pause is defensible due to severe ACOS: ${fmt.pct(x.acos)}.` };
      if (t.orders > 0 && x.acos <= 35) return { tone:'bad', message:`Pause may kill a useful target: ${t.orders} orders at ${fmt.pct(x.acos)} ACOS.` };
      return { tone:'warn', message:`Pause needs review. Current ACOS is ${t.sales ? fmt.pct(x.acos) : 'no sales'}.` };
    }

    function gradeHarvest(st) {
      if (!st) return { tone:'warn', message:'Harvest source term was not found in the selected campaign. Confirm this came from the correct report.' };
      if (st.orders > 0 && st.sales > st.spend) return { tone:'good', message:`Harvest is defensible: ${st.orders} orders and ${fmt.money(st.sales)} sales from ${fmt.money(st.spend)} spend.` };
      if (st.orders === 0) return { tone:'bad', message:'Harvesting a zero-order query creates extra waste. Negative or watchlist it instead.' };
      return { tone:'warn', message:'Harvest needs margin and conversion review before exact control.' };
    }

    function gradeNegative(c, st, type, duplicate=false) {
      if (duplicate) return { tone:'warn', message:'Duplicate negative detected. Do not add duplicate rows in real bulk work.' };
      if (st && st.orders > 0) return { tone:'bad', message:`Negative blocks a converting query with ${st.orders} orders. Use caution or isolate match type first.` };
      if (st && st.orders === 0 && st.clicks >= 15 && /exact/i.test(type)) return { tone:'good', message:`Negative exact is defensible: ${st.clicks} clicks, ${fmt.money(st.spend)} spend, no orders.` };
      if (/phrase/i.test(type) && String(st?.term || '').trim().split(/\s+/).length <= 2) return { tone:'warn', message:'Phrase negative is broad. Confirm it will not block useful variants.' };
      if (st && st.orders === 0) return { tone:'good', message:'Negative added from zero-sale waste term. Confirm scope matches the query intent.' };
      return { tone:'warn', message:'Negative added without source performance. Confirm match type and scope before using live.' };
    }

    function gradeBudgetChange(c, oldBudget, newBudget) {
      if (newBudget <= 0) return { tone:'bad', message:'Budget must be above zero.' };
      const lowInventory = (c.products || []).some(asin => (products.find(p => p.asin === asin) || {}).status === 'Low Inventory');
      const x = calc(c.metrics || {});
      if (newBudget > oldBudget && lowInventory) return { tone:'bad', message:'Budget increase conflicts with low inventory. Check retail readiness before scaling.' };
      if (newBudget > oldBudget && c.metrics.sales && x.acos > 40) return { tone:'bad', message:`Budget increase conflicts with high ACOS (${fmt.pct(x.acos)}). Fix efficiency before scaling.` };
      if (newBudget > oldBudget && c.metrics.sales && x.acos <= 30) return { tone:'good', message:`Budget increase is defensible: ${fmt.pct(x.acos)} ACOS and positive sales.` };
      if (newBudget < minimumBudget(c.type)) return { tone:'warn', message:`Budget is below the simulator's safe ${c.type} training floor (${fmt.money(minimumBudget(c.type))}).` };
      return { tone:'warn', message:'Budget changed. Check pacing, inventory, goal, and recent trend before repeating.' };
    }

    function gradePlacementChange(c) {
      const x = calc(c.metrics || {});
      const maxPlacement = Math.max(Number(c.placements.top || 0), Number(c.placements.product || 0), Number(c.placements.rest || 0));
      if (maxPlacement > 100 && x.acos > 40) return { tone:'bad', message:`Placement multiplier is aggressive while ACOS is high (${fmt.pct(x.acos)}).` };
      if (maxPlacement > 100) return { tone:'warn', message:'Placement multiplier is aggressive. Confirm rank goal and margin buffer.' };
      if (c.placements.top > 0 && x.acos <= 30 && c.metrics.orders > 0) return { tone:'good', message:'Placement adjustment is reasonable for a campaign with efficient sales.' };
      return { tone:'warn', message:'Placement changed. Review placement report before using this in a live account.' };
    }

    function getActiveScenario() { return allScenarios().find(s => s.id === state.activeScenarioId); }
    function scenarioProgress(sc) {
      if (!sc) return { done:0, total:0, pct:0, list:[] };
      const list = (sc.objectives || []).map(o => ({ ...o, done: !!o.check(state) }));
      const done = list.filter(x => x.done).length;
      return { done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0, list };
    }
    function updateScenarioProgress(sc) {
      const p = scenarioProgress(sc);
      if (p.done === p.total && p.total) setTimeout(() => toast(`Mission complete: ${sc.title}. Score ${p.pct}%. Nice operator energy.`, 'good'), 50);
    }

        const q = state.search.trim().toLowerCase();
        const text = `${c.name} ${c.type} ${c.targetingMode} ${c.portfolio} ${c.adFormat}`.toLowerCase();
        return typeOk && statusOk && (!q || text.includes(q));
      });
    }

    function renderCampaignOverview(c) {
      const targetRows = c.targets.slice().sort((a,b) => (b.sales - b.spend) - (a.sales - a.spend)).slice(0,4);
      return `<div class="split">
        <div class="card pad">
          <div class="card-title"><h2>Campaign settings</h2><span>Editable training controls</span></div>
          <div class="form-grid">
            <div class="field"><label>Daily budget</label><input class="input full" id="detailBudget" type="number" min="1" value="${c.dailyBudget}" /></div>
            <div class="field"><label>Default bid</label><input class="input full" id="detailBid" type="number" min="0.02" step="0.01" value="${c.defaultBid}" /></div>
            <div class="field"><label>Bid strategy</label><select class="select full" id="detailBidStrategy">${['Dynamic bids - down only','Dynamic bids - up and down','Fixed bids','Cost per click','Cost per thousand impressions'].map(x => `<option ${c.bidStrategy===x?'selected':''}>${x}</option>`).join('')}</select></div>
            <div class="field"><label>Status</label><select class="select full" id="detailStatus">${['Enabled','Paused','Archived'].map(x => `<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
          </div>
          <button class="btn primary" style="margin-top:12px" data-action="saveCampaignSettings" data-id="${c.id}">Save settings</button>
        </div>
        <div class="card pad">
          <div class="card-title"><h2>Products and creative</h2><span>${campaignTypeLabel(c.type)}</span></div>
          <div class="pill-row" style="margin-bottom:10px;">${c.products.map(a => `<span class="pill">${safe(productShort(a))}</span>`).join('')}</div>
          ${c.creative ? `<div class="review-box">
            <div class="review-row"><span>Brand</span><strong>${safe(c.creative.brandName || 'N/A')}</strong></div>
            <div class="review-row"><span>Headline</span><strong>${safe(c.creative.headline || 'N/A')}</strong></div>
            <div class="review-row"><span>Destination</span><strong>${safe(c.creative.destination || 'N/A')}</strong></div>
            <div class="review-row"><span>Creative</span><strong>${safe(c.creative.video || c.creative.image || 'Auto')}</strong></div>
            <div class="review-row"><span>Approval</span><strong>${safe(c.creativeStatus || 'Approved')}</strong></div>
            ${c.creativeIssue ? `<div class="review-row"><span>Issue</span><strong>${safe(c.creativeIssue)}</strong></div>` : ''}
          </div>
          ${c.creativeStatus === 'Rejected' ? `<button class="btn primary" style="margin-top:10px;" data-action="repairCreative" data-id="${c.id}">Fix creative approval</button>` : ''}` : '<p class="muted">Sponsored Products standard campaigns use product listing content.</p>'}
        </div>
        <div class="card pad" style="grid-column:1 / -1;">
          <div class="card-title"><h2>Top targets by profit signal</h2><span>Use to train bid optimization</span></div>
          ${renderTargetsMini(targetRows, c)}
        </div>
      </div>`;
    }
    function renderTargetsMini(rows, c) {
      return `<div class="table-wrap"><table><thead><tr><th>Target</th><th>Match</th><th>Bid</th><th>Spend</th><th>Sales</th><th>ACOS</th><th>Suggested move</th></tr></thead><tbody>
        ${rows.map(t => { const x = calc(t); const suggestion = t.sales === 0 ? 'Pause or bid down' : x.acos < 25 ? 'Bid up or isolate' : x.acos > 45 ? 'Bid down' : 'Monitor'; return `<tr><td><strong>${safe(t.value)}</strong></td><td>${safe(t.match)}</td><td>${fmt.bid(t.bid)}</td><td>${fmt.money(t.spend)}</td><td>${fmt.money(t.sales)}</td><td class="${t.sales ? acosClass(x.acos) : 'acos-bad'}">${t.sales ? fmt.pct(x.acos) : 'No sales'}</td><td>${suggestion}</td></tr>`; }).join('')}
      </tbody></table></div>`;
    }

    function renderCreateWizard() {
      const d = state.draft;
      return `
        ${pageTitle('Create campaign', 'Build SP, SB, and SD campaigns in a safe launch wizard. The simulator validates common PPC setup mistakes before launch.', '')}
        <div class="wizard">
          <div class="steps">
            ${['Ad type','Basics','Products and creative','Targeting','Bidding and budget','Review'].map((x,i) => `<div class="step ${state.wizardStep===i+1?'active':state.wizardStep>i+1?'done':''}"><span class="step-num">${state.wizardStep>i+1?'✓':i+1}</span><div>${x}</div></div>`).join('')}
          </div>
          <div class="wizard-panel">
            ${renderWizardStep(d)}
            <div style="display:flex; justify-content:space-between; gap:10px; margin-top:18px;">
              <button class="btn" data-action="prevStep" ${state.wizardStep===1?'disabled':''}>Back</button>
              <div class="pill-row">
                <button class="btn" data-action="resetDraft">Reset draft</button>
                ${state.wizardStep < 6 ? '<button class="btn primary" data-action="nextStep">Next</button>' : '<button class="btn primary" data-action="launchCampaign">Launch campaign</button>'}
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderWizardStep(d) {
      switch (state.wizardStep) {
        case 1: return renderStepAdType(d);
        case 2: return renderStepBasics(d);
        case 3: return renderStepProductsCreative(d);
        case 4: return renderStepTargeting(d);
        case 5: return renderStepBidding(d);
        case 6: return renderStepReview(d);
        default: return renderStepAdType(d);
      }
    }

    function renderStepAdType(d) {
      return `<h2>Choose campaign type</h2><p class="muted">The simulator includes the three core ad types a VA will touch in campaign setup and management.</p>
        <div class="choice-grid" style="margin-top:14px;">
          ${adChoice('SP','Sponsored Products','Promote individual listings. Train automatic targeting, manual keyword targeting, product targeting, search term reports, bids, negatives, and placements.', 'Best first PPC operations module')}
          ${adChoice('SB','Sponsored Brands','Promote brand creative, product collections, Store spotlight, or video. Train headlines, brand assets, destinations, and keyword/product/category targeting.', 'Brand registered workflow')}
          ${adChoice('SD','Sponsored Display','Reach shoppers through contextual targeting or audiences such as views remarketing. Train display setup, creative, products, and audience logic.', 'Upper funnel and remarketing')}
        </div>`;
    }
    function adChoice(type, title, desc, foot) {
      return `<div class="choice ${state.draft.type === type ? 'active' : ''}" data-draft-type="${type}">
        <div>${adTypeTag(type)}</div><h3>${title}</h3><p>${desc}</p><span class="pill orange">${foot}</span>
      </div>`;
    }

    function renderStepBasics(d) {
      return `<h2>Campaign basics</h2><p class="muted">Set campaign-level controls. This is where many VA errors happen: wrong naming, low budget, wrong status, or wrong format.</p>
      <div class="form-grid" style="margin-top:14px;">
        <div class="field full"><label>Campaign name</label><input class="input full" data-draft="name" value="${safe(d.name)}" placeholder="Example: ${d.type} | Manual | Coffee Filter | Exact" /></div>
        <div class="field"><label>Portfolio</label><input class="input full" data-draft="portfolio" value="${safe(d.portfolio)}" /></div>
        <div class="field"><label>Status after launch</label><select class="select full" data-draft="status">${['Enabled','Paused'].map(x => `<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label>Start date</label><input class="input full" type="date" data-draft="startDate" value="${safe(d.startDate)}" /></div>
        <div class="field"><label>End date</label><input class="input full" type="date" data-draft="endDate" value="${safe(d.endDate)}" /></div>
        <div class="field"><label>Daily budget</label><input class="input full" type="number" min="1" data-draft-number="dailyBudget" value="${safe(d.dailyBudget)}" /><small>Training rule: SP/SB at least $25, SD at least $20.</small></div>
        <div class="field"><label>Ad format</label>${renderFormatSelect(d)}</div>
      </div>`;
    }
    function renderFormatSelect(d) {
      const opts = d.type === 'SP' ? ['Standard','Video'] : d.type === 'SB' ? ['Product collection','Store spotlight','Video'] : ['Auto generated','Custom image','Video creative'];
      return `<select class="select full" data-draft="adFormat">${opts.map(x => `<option ${d.adFormat===x?'selected':''}>${x}</option>`).join('')}</select>`;
    }

    function renderStepProductsCreative(d) {
      const cards = products.map(p => `<label class="choice ${d.products.includes(p.asin) ? 'active' : ''}" style="min-height:130px;"><input type="checkbox" data-product-check="${p.asin}" ${d.products.includes(p.asin)?'checked':''} /> <h3>${p.image} ${safe(p.title)}</h3><p>${p.asin} · ${fmt.money(p.price)} · ${p.status}</p><span class="pill">Rating ${p.rating} · Reviews ${p.reviews}</span></label>`).join('');
      const creative = d.type === 'SP' ? `<div class="coach-tip">Sponsored Products standard campaigns use the product detail page as the ad creative. For SP Video, use the ad format selector and treat video as an optional training module.</div>` : `
        <div class="card pad" style="box-shadow:none; margin-top:12px;">
          <div class="card-title"><h3>${d.type === 'SB' ? 'Sponsored Brands creative' : 'Sponsored Display creative'}</h3><span>Training validation enabled</span></div>
          <div class="form-grid">
            <div class="field"><label>Brand name</label><input class="input full" data-creative="brandName" value="${safe(d.creative.brandName)}" /></div>
            <div class="field"><label>Logo text placeholder</label><input class="input full" data-creative="logo" value="${safe(d.creative.logo)}" /></div>
            <div class="field full"><label>Headline</label><input class="input full" data-creative="headline" value="${safe(d.creative.headline)}" placeholder="Keep claims compliant and product-relevant" /></div>
            <div class="field"><label>Destination</label><select class="select full" data-creative="destination"><option ${d.creative.destination==='Brand Store'?'selected':''}>Brand Store</option><option ${d.creative.destination==='Product detail page'?'selected':''}>Product detail page</option><option ${d.creative.destination==='Custom landing page'?'selected':''}>Custom landing page</option></select></div>
            <div class="field"><label>${d.adFormat === 'Video' ? 'Video asset' : 'Image asset'}</label><input class="input full" data-creative="${d.adFormat === 'Video' ? 'video' : 'image'}" value="${safe(d.adFormat === 'Video' ? d.creative.video : d.creative.image)}" placeholder="Example: asset-name.mp4" /></div>
          </div>
        </div>`;
      return `<h2>Products and creative</h2><p class="muted">Select advertised products and provide creative inputs for SB and SD. This trains retail-readiness and brand asset checks.</p>
        <div class="choice-grid" style="margin-top:14px;">${cards}</div>${creative}`;
    }

    function renderStepTargeting(d) {
      const targetingOptions = d.type === 'SP'
        ? ['Automatic','Manual keyword','Manual product']
        : d.type === 'SB'
          ? ['Keyword','Product','Category']
          : ['Contextual','Audiences - views remarketing','Audiences - purchases remarketing'];
      return `<h2>Targeting</h2><p class="muted">Choose how the simulator serves ads. The input fields change by ad type and targeting mode.</p>
        <div class="form-grid" style="margin-top:14px;">
          <div class="field"><label>Targeting mode</label><select class="select full" data-draft="targetingMode">${targetingOptions.map(x => `<option ${d.targetingMode===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Default bid</label><input class="input full" type="number" min="0.02" step="0.01" data-draft-number="defaultBid" value="${safe(d.defaultBid)}" /></div>
          ${renderTargetingInputs(d)}
        </div>`;
    }

    function renderTargetingInputs(d) {
      if (d.type === 'SP' && d.targetingMode === 'Automatic') {
        return `<div class="field full"><div class="coach-tip">Automatic SP targeting creates close match, loose match, substitutes, and complements in the simulator. Use this to train discovery and search term mining.</div></div>`;
      }
      if ((d.type === 'SP' && d.targetingMode === 'Manual keyword') || (d.type === 'SB' && d.targetingMode === 'Keyword')) {
        return `<div class="field"><label>Match type</label><select class="select full" data-draft="matchType"><option ${d.matchType==='Exact'?'selected':''}>Exact</option><option ${d.matchType==='Phrase'?'selected':''}>Phrase</option><option ${d.matchType==='Broad'?'selected':''}>Broad</option></select></div><div class="field full"><label>Keywords, one per line</label><textarea class="textarea" data-draft="keywords">${safe(d.keywords)}</textarea></div>`;
      }
      if ((d.type === 'SP' && d.targetingMode === 'Manual product') || (d.type === 'SB' && d.targetingMode === 'Product') || d.targetingMode === 'Contextual') {
        return `<div class="field full"><label>ASIN targets, one per line</label><textarea class="textarea" data-draft="asinTargets">${safe(d.asinTargets)}</textarea></div><div class="field full"><label>Category targets</label><textarea class="textarea" data-draft="categoryTargets">${safe(d.categoryTargets)}</textarea></div>`;
      }
      if ((d.type === 'SB' && d.targetingMode === 'Category')) {
        return `<div class="field full"><label>Category targets</label><textarea class="textarea" data-draft="categoryTargets">${safe(d.categoryTargets)}</textarea></div>`;
      }
      if (d.type === 'SD') {
        return `<div class="field"><label>Optimization goal</label><select class="select full" data-draft="optimization"><option ${d.optimization==='Conversions'?'selected':''}>Conversions</option><option ${d.optimization==='Reach'?'selected':''}>Reach</option><option ${d.optimization==='Page visits'?'selected':''}>Page visits</option></select></div><div class="field full"><label>Audience or contextual targets</label><textarea class="textarea" data-draft="audienceTargets">${safe(d.audienceTargets)}</textarea><small>Examples: Viewed advertised products 30 days, Viewed similar products 14 days, Purchasers 365 days.</small></div>`;
      }
      return '';
    }

    function renderStepBidding(d) {
      const strategies = d.type === 'SP' ? ['Dynamic bids - down only','Dynamic bids - up and down','Fixed bids'] : d.type === 'SB' ? ['Cost per click','Cost per thousand impressions'] : ['Cost per click','Cost per thousand impressions'];
      return `<h2>Bidding and budget controls</h2><p class="muted">Practice bid strategy and placement adjustments. These fields are intentionally close to daily PPC operations.</p>
        <div class="form-grid" style="margin-top:14px;">
          <div class="field"><label>Bid strategy</label><select class="select full" data-draft="bidStrategy">${strategies.map(x => `<option ${d.bidStrategy===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Default bid</label><input class="input full" type="number" min="0.02" step="0.01" data-draft-number="defaultBid" value="${safe(d.defaultBid)}" /></div>
          <div class="field"><label>Top of Search adjustment</label><input class="input full" type="number" min="0" max="900" data-placement="top" value="${safe(d.placements.top)}" /><small>Use carefully. Great way to train placement math.</small></div>
          <div class="field"><label>Product pages adjustment</label><input class="input full" type="number" min="0" max="900" data-placement="product" value="${safe(d.placements.product)}" /></div>
          <div class="field"><label>Rest of Search adjustment</label><input class="input full" type="number" min="0" max="900" data-placement="rest" value="${safe(d.placements.rest)}" /></div>
          <div class="field"><label>Daily budget</label><input class="input full" type="number" min="1" data-draft-number="dailyBudget" value="${safe(d.dailyBudget)}" /></div>
        </div>`;
    }

    function validateDraft(d) {
      const errors = [];
      if (!d.name.trim()) errors.push('Campaign name is required.');
      if (!d.products.length) errors.push('Select at least one product.');
      if (d.type === 'SP' && Number(d.dailyBudget) < 25) errors.push('Sponsored Products training minimum budget is $25.');
      if (d.type === 'SB' && Number(d.dailyBudget) < 25) errors.push('Sponsored Brands training minimum budget is $25.');
      if (d.type === 'SD' && Number(d.dailyBudget) < 20) errors.push('Sponsored Display training minimum budget is $20.');
      if (Number(d.defaultBid) <= 0) errors.push('Default bid must be greater than zero.');
      if ((d.type === 'SP' && d.targetingMode === 'Manual keyword') || (d.type === 'SB' && d.targetingMode === 'Keyword')) {
        if (lines(d.keywords).length < 1) errors.push('Add at least one keyword.');
      }
      if ((d.type === 'SP' && d.targetingMode === 'Manual product') || (d.type === 'SB' && d.targetingMode === 'Product') || d.targetingMode === 'Contextual') {
        if (lines(d.asinTargets).length + lines(d.categoryTargets).length < 1) errors.push('Add at least one ASIN or category target.');
      }
      if (d.type === 'SB') {
        if (!d.creative.brandName.trim()) errors.push('Sponsored Brands requires a brand name placeholder.');
        if (!d.creative.headline.trim()) errors.push('Sponsored Brands requires a headline.');
        if (d.adFormat !== 'Video' && d.products.length < 3) errors.push('Sponsored Brands Product collection or Store spotlight should use at least three products in this training flow.');
        if (d.adFormat === 'Video' && !d.creative.video.trim()) errors.push('Sponsored Brands Video requires a video asset placeholder.');
      }
      if (d.type === 'SD') {
        if (!d.creative.headline.trim()) errors.push('Sponsored Display creative needs a headline placeholder in this simulator.');
        if (!d.targetingMode.includes('Contextual') && !d.targetingMode.includes('Audiences')) errors.push('Sponsored Display must use contextual or audience targeting.');
      }
      return errors;
    }
    function lines(text) { return String(text || '').split('\n').map(x => x.trim()).filter(Boolean); }

    function renderStepReview(d) {
      const errors = validateDraft(d);
      const targets = draftTargets(d);
      return `<h2>Review and launch</h2><p class="muted">Review the same items a VA should check before touching a real account. Failed validation is intentional training.</p>
        ${errors.length ? `<div class="error-list"><strong>Fix before launch:</strong><ul>${errors.map(e => `<li>${safe(e)}</li>`).join('')}</ul></div>` : `<div class="coach-tip">Validation passed. This campaign is ready to launch in the simulator.</div>`}
        <div class="review-box">
          ${reviewRow('Ad type', campaignTypeLabel(d.type))}
          ${reviewRow('Campaign name', d.name || 'Missing')}
          ${reviewRow('Format', d.adFormat)}
          ${reviewRow('Targeting', d.targetingMode)}
          ${reviewRow('Products', d.products.map(productTitle).join(', '))}
          ${reviewRow('Daily budget', fmt.money(d.dailyBudget))}
          ${reviewRow('Bid strategy', d.bidStrategy)}
          ${reviewRow('Default bid', fmt.bid(d.defaultBid))}
          ${reviewRow('Targets', targets.map(t => `${t.value} (${t.match})`).join(', ') || 'Auto targets generated')}
          ${d.type !== 'SP' ? reviewRow('Creative', `${d.creative.brandName} · ${d.creative.headline} · ${d.creative.destination}`) : ''}
          ${reviewRow('Placement adjustments', `Top ${d.placements.top}%, Product pages ${d.placements.product}%, Rest ${d.placements.rest}%`)}
        </div>`;
    }
    function reviewRow(k, v) { return `<div class="review-row"><span>${k}</span><strong>${safe(v)}</strong></div>`; }

    function draftTargets(d) {
      const bid = Number(d.defaultBid) || 0.5;
      if (d.type === 'SP' && d.targetingMode === 'Automatic') {
        return ['Close match','Loose match','Substitutes','Complements'].map(x => makeTarget('Auto', x, 'Auto', bid));
      }
      if ((d.type === 'SP' && d.targetingMode === 'Manual keyword') || (d.type === 'SB' && d.targetingMode === 'Keyword')) {
        return lines(d.keywords).map(k => makeTarget('Keyword', k, d.matchType, bid));
      }
      if ((d.type === 'SP' && d.targetingMode === 'Manual product') || (d.type === 'SB' && d.targetingMode === 'Product') || d.targetingMode === 'Contextual') {
        const asins = lines(d.asinTargets).map(a => makeTarget('ASIN', a, d.targetingMode === 'Contextual' ? 'Contextual' : 'Product', bid));
        const cats = lines(d.categoryTargets).map(a => makeTarget('Category', a, d.targetingMode === 'Contextual' ? 'Contextual' : 'Category', bid));
        return asins.concat(cats);
      }
      if (d.type === 'SB' && d.targetingMode === 'Category') return lines(d.categoryTargets).map(a => makeTarget('Category', a, 'Category', bid));
      if (d.type === 'SD') return lines(d.audienceTargets).map(a => makeTarget('Audience', a, d.targetingMode.includes('views') ? 'Remarketing' : d.targetingMode.includes('purchases') ? 'Purchases remarketing' : 'Contextual', bid));
      return [];
    }
    function makeTarget(type, value, match, bid) {
      return { id: uid('T'), type, value, match, bid, status: 'Enabled', impressions:0, clicks:0, spend:0, sales:0, orders:0 };
    }

        function launchCampaign() {
      const d = copy(state.draft);
      const errors = validateDraft(d);
      if (errors.length) { toast('Launch blocked. Fix validation errors first.', 'bad'); render(); return; }
      const id = uid('C-' + d.type);
      const agId = uid('AG');
      const targets = draftTargets(d).map(t => ({ ...t, campaignId:id, adGroupId:agId }));
      const adGroups = [{ id: agId, campaignId:id, name: d.type + ' training ad group', status: d.status, defaultBid: Number(d.defaultBid) }];
      const ads = d.products.map((asin, i) => ({ id: uid('AD'), campaignId:id, adGroupId:agId, asin, status: d.status === 'Archived' ? 'Archived' : 'Enabled', name: `${d.type} product ad ${i + 1}` }));
      const c = {
        id, type: d.type, name: d.name, portfolio: d.portfolio, status: d.status, dailyBudget: Number(d.dailyBudget), startDate: d.startDate, endDate: d.endDate,
        targetingMode: d.targetingMode, adFormat: d.adFormat, bidStrategy: d.bidStrategy, defaultBid: Number(d.defaultBid), products: d.products,
        creative: d.type === 'SP' ? null : copy(d.creative), placements: copy(d.placements), budgetRules: [], negatives: [], metrics: { impressions: 0, clicks: 0, spend: 0, sales: 0, orders: 0 },
        adGroups, ads, targets,
        searchTerms: d.type === 'SD' ? [] : seedSearchTerms(d, id, agId, targets), history: ['Campaign launched in simulator'], createdBySimulator: true
      };
      normalizeCampaign(c);
      state.campaigns.unshift(c);
      state.selectedCampaignId = id;
      state.selectedTab = 'overview';
      state.view = 'campaigns';
      state.draft = makeDraft();
      state.wizardStep = 1;
      logAction('campaign_created', `${c.type} ${c.name}`, 'good');
      toast(`${campaignTypeLabel(c.type)} campaign launched in training sandbox.`, 'good');
    }
        function seedSearchTerms(d, campaignId = '', adGroupId = '', targets = []) {
      const base = d.type === 'SB' ? ['coffee accessories gift', 'home coffee bar accessories'] : ['stainless coffee filter', 'paper coffee filters bulk'];
      return base.map((term, i) => {
        const t = targets[i] || targets[0] || {};
        return { id: uid('ST'), campaignId, adGroupId, targetId:t.id || '', term, target: t.value || d.targetingMode, clicks: i ? 18 : 32, spend: i ? 16.2 : 24.64, sales: i ? 0 : 89.95, orders: i ? 0 : 4, recommendation: i ? 'Add negative exact' : 'Harvest as exact keyword' };
      });
    }

    function renderReports() {
      const rows = reportRowsFor(state.reportType);
      return `${pageTitle('Reports', 'Practice report requests, download history, and action decisions without touching live data.', '<button class="btn primary" data-action="requestReport">Request report</button> <button class="btn" data-action="exportReport">Export CSV</button>')}
        <div class="toolbar">
          <select class="select" data-field="reportType">${['Search term report','Targeting report','Campaign placement report','Budget report','Advertised product report','Purchased product report','Campaign report'].map(x => `<option ${state.reportType===x?'selected':''}>${x}</option>`).join('')}</select>
          <select class="select" data-field="dateRange">${['Today','Yesterday','Last 7 days','Last 30 days','Month to date','Custom range'].map(x => `<option ${state.dateRange===x?'selected':''}>${x}</option>`).join('')}</select>
          <button class="btn" data-action="requestReport">Request report</button>
          <button class="btn" data-action="copyReport">Copy report rows</button>
        </div>
        <div class="grid grid-2" style="margin-bottom:14px;">
          <div class="card pad"><div class="card-title"><h2>Report trainer</h2><span>${safe(state.reportType)}</span></div><p class="muted">Teach VAs to pick the correct report before choosing an action. SP and SB search term work uses customer query rows. SD work uses targeting, audience, campaign, and product-level rows.</p><div class="review-box">${reviewRow('Date range', state.dateRange)}${reviewRow('Rows generated', rows.length)}${reviewRow('Relationship source', reportSourceLabel(state.reportType))}</div></div>
          <div class="card pad"><div class="card-title"><h2>Report center queue</h2><span>${state.reportQueue.length} requests</span></div>${renderReportQueue()}</div>
        </div>
        ${renderReportTable(state.reportType, rows)}`;
    }

    function reportSourceLabel(type) {
      if (type === 'Search term report') return 'campaign.searchTerms linked to targetId';
      if (type === 'Targeting report') return 'campaign.targets linked to adGroupId';
      if (type === 'Advertised product report') return 'campaign.ads linked to products';
      if (type === 'Budget report') return 'campaign.budgetRules and dailyBudget';
      return 'campaign-level metrics';
    }

    function reportRowsFor(type) {
      normalizeState();
      if (type === 'Search term report') return state.campaigns.flatMap(c => (c.searchTerms || []).map(st => {
        const t = c.targets.find(x => x.id === st.targetId) || {};
        return { campaignId:c.id, campaign:c.name, adType:c.type, adGroupId:st.adGroupId, targetId:st.targetId || '', target:t.value || st.target || '', searchTerm:st.term, clicks:st.clicks, spend:st.spend, sales:st.sales, orders:st.orders, acos: st.sales ? calc(st).acos : 0, recommendation:st.recommendation };
      }));
      if (type === 'Targeting report') return state.campaigns.flatMap(c => (c.targets || []).map(t => ({ campaignId:c.id, campaign:c.name, adType:c.type, adGroupId:t.adGroupId, targetId:t.id, target:t.value, match:t.match, status:t.status, bid:t.bid, clicks:t.clicks, spend:t.spend, sales:t.sales, orders:t.orders, acos:t.sales ? calc(t).acos : 0 })));
      if (type === 'Advertised product report') return state.campaigns.flatMap(c => (c.ads || []).map(ad => { const p = products.find(x => x.asin === ad.asin) || {}; const share = Math.max(1, (c.ads || []).length); return { campaignId:c.id, campaign:c.name, adType:c.type, adGroupId:ad.adGroupId, adId:ad.id, asin:ad.asin, sku:p.sku || '', product:p.title || ad.asin, status:ad.status, spend:c.metrics.spend / share, sales:c.metrics.sales / share, orders:Math.round(c.metrics.orders / share), retailStatus:p.status || 'Unknown' }; }));
      if (type === 'Purchased product report') return state.campaigns.flatMap(c => (c.searchTerms || []).filter(st => st.orders > 0).map(st => { const asin = c.products[0]; return { campaignId:c.id, campaign:c.name, adType:c.type, searchTerm:st.term, advertisedAsin:asin, purchasedAsin:asin, orders:st.orders, sales:st.sales, sameAsAdvertised:'Yes', action:'Harvest or protect winner' }; }));
      if (type === 'Budget report') return state.campaigns.map(c => ({ campaignId:c.id, campaign:c.name, adType:c.type, status:c.status, dailyBudget:c.dailyBudget, sevenDayCapacity:c.dailyBudget * 7, spend:c.metrics.spend, budgetRules:(c.budgetRules || []).length, ruleNames:(c.budgetRules || []).map(r => r.name).join('; ') || 'None', recommendation:c.metrics.spend > c.dailyBudget * 25 ? 'Check budget cap and pacing' : 'Monitor' }));
      if (type === 'Campaign placement report') return state.campaigns.map(c => ({ campaignId:c.id, campaign:c.name, adType:c.type, topOfSearch:c.placements.top, productPages:c.placements.product, restOfSearch:c.placements.rest, spend:c.metrics.spend, sales:c.metrics.sales, acos:c.metrics.sales ? calc(c.metrics).acos : 0, recommendation:c.placements.top > 50 ? 'Review Top of Search multiplier' : 'Monitor' }));
      return state.campaigns.map(c => { const x = calc(c.metrics); return { campaignId:c.id, campaign:c.name, adType:c.type, status:c.status, portfolio:c.portfolio, budget:c.dailyBudget, impressions:c.metrics.impressions, clicks:c.metrics.clicks, spend:c.metrics.spend, sales:c.metrics.sales, orders:c.metrics.orders, acos:x.acos, roas:x.roas }; });
    }

    function renderReportTable(type, rows) {
      if (!rows.length) return `<div class="empty card"><h3>No rows for ${safe(type)}</h3><p>Try a different report type or run a simulation.</p></div>`;
      const keys = Object.keys(rows[0]);
      return `<div class="table-wrap"><table><thead><tr>${keys.map(k => `<th>${safe(labelize(k))}</th>`).join('')}</tr></thead><tbody>
        ${rows.map(row => `<tr>${keys.map(k => `<td>${formatReportCell(k, row[k])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
    }

    function labelize(k) { return String(k).replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()); }
    function formatReportCell(k, v) {
      if (k === 'adType') return adTypeTag(v);
      if (['spend','sales','dailyBudget','sevenDayCapacity','budget'].includes(k)) return fmt.money(v);
      if (['bid'].includes(k)) return fmt.bid(v);
      if (['acos'].includes(k)) return v ? `<span class="${acosClass(v)}">${fmt.pct(v)}</span>` : 'No sales';
      if (['roas'].includes(k)) return fmt.roas(v);
      if (['campaign'].includes(k)) {
        const row = state.campaigns.find(c => c.name === v);
        return row ? `<button class="row-link" data-campaign="${row.id}">${safe(v)}</button>` : safe(v);
      }
      return safe(v);
    }

    function renderReportQueue() {
      const rows = state.reportQueue.slice().reverse().slice(0, 5);

    function requestReport() {
      const rows = reportRowsFor(state.reportType);
      const report = { id: uid('RPT'), type: state.reportType, dateRange: state.dateRange, status: 'Completed', rows: rows.length, createdAt: new Date().toISOString(), source: reportSourceLabel(state.reportType) };
      state.reportQueue.push(report);
      state.selectedReportId = report.id;
      logAction('request_report', `${report.type} ${report.rows} rows`, 'good');
      toast('Report request completed in simulator.', 'good');
      render();
    }



    function trainerMetrics() {
      const total = state.actionLog.length;
      const good = state.actionLog.filter(a => a.quality === 'good').length;
      const warn = state.actionLog.filter(a => a.quality === 'warn').length;
      const bad = state.actionLog.filter(a => a.quality === 'bad').length;
      const score = total ? Math.max(0, Math.round((good * 100 + warn * 55 - bad * 35) / total)) : 0;
      return { total, good, warn, bad, score: Math.min(100, score) };
    }
