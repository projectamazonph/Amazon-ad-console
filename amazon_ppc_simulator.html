        function validateBulkRow(r) {
      const c = campaignById(state, r.campaignId);
      if (!c) return { ...r, valid:false, severity:'bad', message:'Campaign ID not found.' };
      if (r.legacy) return validateLegacyBulkRow(r, c);
      const entity = String(r.entity || '').toLowerCase();
      const operation = String(r.operation || '').toLowerCase();
      if (entity === 'campaign' && operation === 'update') {
        if (r.status && !['Enabled','Paused','Archived'].includes(r.status)) return { ...r, valid:false, severity:'bad', message:'Campaign status must be Enabled, Paused, or Archived.' };
        if (r.status === 'Enabled' && c.type !== 'SP' && c.creativeStatus === 'Rejected') return { ...r, valid:false, severity:'bad', message:'Cannot enable a rejected creative campaign.' };
        if (r.value && Number(r.value) <= 0) return { ...r, valid:false, severity:'bad', message:'Budget value must be greater than zero.' };
        if (r.value && Number(r.value) < minimumBudget(c.type)) return { ...r, valid:true, severity:'warn', message:`Budget is below ${c.type} training floor: ${fmt.money(minimumBudget(c.type))}.` };
        if (!r.value && !r.status) return { ...r, valid:false, severity:'bad', message:'Campaign update needs budget value or status.' };
        const q = r.value ? gradeBudgetChange(c, c.dailyBudget, Number(r.value)) : { tone:r.status === 'Archived' ? 'warn' : 'good', message:`Set campaign status to ${r.status}.` };
        return { ...r, valid:true, severity:q.tone === 'bad' ? 'warn' : q.tone, message:r.status ? `Set campaign status to ${r.status}. ${q.message}` : `Set budget to ${fmt.money(r.value)}. ${q.message}` };
      }
      if (entity === 'target') {
        const t = findBulkTarget(c, r);
        if (!t) return { ...r, valid:false, severity:'bad', message:'Target not found by targetId or target value in campaign.' };
        if (operation === 'pause') { const q = gradePauseTarget(t); return { ...r, valid:true, severity:q.tone === 'bad' ? 'warn' : q.tone, message:`Pause target ${t.value}. ${q.message}` }; }
        if (operation === 'update') {
          if (!(Number(r.bid) > 0)) return { ...r, valid:false, severity:'bad', message:'Target update needs a bid greater than zero.' };
          const mult = Number(r.bid) > Number(t.bid) ? 1.1 : 0.9;
          const q = gradeBidMove(c, t, mult, t.bid, Number(r.bid));
          return { ...r, valid:true, severity:q.tone === 'bad' ? 'warn' : q.tone, message:`Set ${t.value} bid to ${fmt.bid(r.bid)}. ${q.message}` };
        }
      }
      if (entity === 'negative' && operation === 'create') {

        const duplicate = c.negatives.some(n => n.type === type && String(n.value).toLowerCase() === String(r.value).toLowerCase());
        const q = gradeNegative(c, st, type, duplicate);
        return { ...r, valid: q.tone !== 'bad', severity:q.tone, message:`Add ${type}: ${r.value}. ${q.message}` };
      }
      if (entity === 'placement' && operation === 'update') {
        if (!['top','product','rest'].includes(String(r.placement).toLowerCase())) return { ...r, valid:false, severity:'bad', message:'Placement must be top, product, or rest.' };

      }
      return { ...r, valid:false, severity:'bad', message:'Unsupported entity or operation.' };

        function validateLegacyBulkRow(r, c) {
      if (r.action === 'campaign_budget') {

## Purpose
Train virtual assistants on Amazon PPC navigation and operations without Seller Central or Amazon Ads access.

## V3 focus
V3 tightens the simulator around object relationships, repeatable scenarios, bulk validation, report workflows, and trainer QA.

## Core object model
- Campaign is the parent object.
- Ad groups belong to one campaign through campaignId.
- Product ads belong to one campaign and one ad group.
- Targets belong to one campaign and one ad group.
- Search terms belong to one campaign and link back to targetId when the source target is known.
- Negatives belong to one campaign and one ad group.
- Budget rules belong to one campaign.
- Reports read from the relationship graph instead of loose mock rows.

## V3 modules
- Sponsored Products setup, auto targeting, manual keyword targeting, product targeting, harvesting, negatives, placements, and budgets.
- Sponsored Brands Product Collection, Store Spotlight, Video, creative approval, destination checks, and targeting.
- Sponsored Display contextual targeting, views remarketing, purchases remarketing, audience logic, and no-search-term reporting behavior.
- Report center queue with Search term, Targeting, Campaign placement, Budget, Advertised product, Purchased product, and Campaign reports.
- Bulk operations for Campaign, Target, Negative, Placement, and BudgetRule entities.
- Integrity center for relationship checks and self-healing.
- Scenario generator for repeated beginner, intermediate, and advanced VA drills.
- Trainer dashboard, action grading, notes, progress import/export, and CSV logs.

## Recommended training path
1. Navigation map and glossary.
2. SP Auto and Manual campaign setup.
3. Search term harvesting and negative exact/phrase decisions.
4. SB creative and Store destination review.
5. SD contextual and audience setup.
6. Reports and bulk operations.
7. Randomized scenario drills.
8. Trainer review and certification.

## QA rules
- Run Integrity center after bulk operations or imported progress.
- Export trainer log after each trainee session.
- Use generated scenarios for repeat practice.
- Require VAs to explain the rollback step before risky actions.

## Known limits
This app is static and local to the browser. It does not connect to Amazon Ads, Seller Central, live reports, or real bulk uploads. Metrics are simulated and are not predictive.`;
      downloadText('amazon-ppc-simulator-v3-docs.md', md, 'text/markdown');
      logAction('export_docs', 'V3 documentation exported', 'good'); toast('Documentation exported.', 'good');

    var V31_BULK_TEMPLATE = 'entity,operation,campaignId,adGroupId,targetId,target,value,bid,type,status,placement,percentage,condition\nCampaign,Update,C-SP-AUTO-001,,,,42,,,,,,\nTarget,Update,C-SP-MAN-002,,T-005,stainless coffee filter,,1.32,,,,,\nTarget,Create,C-SP-MAN-002,AG-002,,,low intent coffee mug,0.31,Keyword,Enabled,,,\nNegative,Create,C-SP-AUTO-001,,,paper coffee filters bulk,,Negative exact,,,,\nPlacement,Update,C-SP-MAN-002,,,,,,,top,35,\nBudgetRule,Create,C-SP-MAN-002,,,Prime Day pulse,,,Schedule,,,25,Prime Day event week';

    function validateDraftDetailed(d) {
      const errors = [];

      if (d.endDate && d.startDate && new Date(d.endDate) < new Date(d.startDate)) errors.push('End date must be after the start date.');
      if ((d.products || []).some(asin => v31RetailStatus(asin) === 'Low Inventory') && d.status === 'Enabled' && Number(d.dailyBudget) >= 35) warnings.push('Low-inventory ASIN selected with scale-level budget. Launch paused or reduce budget.');

        if (d.targetingMode === 'Manual keyword' && lines(d.keywords).length < 3) errors.push('Manual keyword setup needs at least three keyword targets for training.');
        if (d.targetingMode === 'Manual product' && lines(d.asinTargets).length + lines(d.categoryTargets).length < 1) errors.push('Manual product targeting needs ASIN or category targets.');

        if (d.adFormat !== 'Video' && d.products.length < 3) errors.push('Sponsored Brands Product Collection or Store Spotlight should use at least three products in this training flow.');

    function duplicateCampaign(id) {
      const c = campaignById(state, id); if (!c) return;
      normalizeCampaign(c);
      const n = copy(c);

    function harvestTerm(cid, term) {
      const source = campaignById(state, cid);
      const row = source && (source.searchTerms || []).find(x => String(x.term).toLowerCase() === String(term).toLowerCase());
      const manual = state.campaigns.find(c => c.id === 'C-SP-MAN-002') || state.campaigns.find(c => c.type === 'SP' && String(c.targetingMode).includes('Manual'));
      if (!manual) { toast('No manual SP campaign found for harvesting.', 'bad'); return; }
      normalizeCampaign(manual);
      const agId = manual.adGroups[0].id;
      if (!manual.targets.some(t => t.value.toLowerCase() === String(term).toLowerCase() && t.match === 'Exact')) {
        manual.targets.push(Object.assign(makeTarget('Keyword', term, 'Exact', Math.max(manual.defaultBid, 0.9)), { campaignId: manual.id, adGroupId: agId }));
        v31AppendHistory(manual, `Harvested search term as exact: ${term}`);
      }
      const q = row && row.orders > 0 && row.sales > 0 ? 'good' : 'bad';
      logAction('harvest_term', `${term} | orders ${row ? row.orders : 0} | sales ${row ? row.sales : 0}`, q);
      toast(`Harvested as exact keyword: ${term}.`, q === 'good' ? 'good' : 'bad');
      render();

    function addNegative(cid, term, type) {
      const c = campaignById(state, cid); if (!c) return;

      if (!c.negatives.some(n => n.value.toLowerCase() === String(term).toLowerCase() && n.type === type)) {

    function adjustTargetBid(cid, tid, mult) {
      const c = campaignById(state, cid); const t = c && c.targets.find(x => x.id === tid); if (!t) return;
      const old = Number(t.bid || 0);

    function v31ParseCsv(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      text = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && quoted && next === '"') { cell += '"'; i++; continue; }
        if (ch === '"') { quoted = !quoted; continue; }
        if (ch === ',' && !quoted) { row.push(cell.trim()); cell = ''; continue; }
        if (ch === '\n' && !quoted) { row.push(cell.trim()); if (row.some(Boolean)) rows.push(row); row = []; cell = ''; continue; }
        cell += ch;
      }
      row.push(cell.trim()); if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function v31NormHeader(h) { return String(h || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ''); }

    function parseBulk() {
      const text = $('#bulkInput')?.value ?? state.bulkInput;
      state.bulkInput = text;
      const rows = v31ParseCsv(text);
      if (!rows.length) return [];
      const headers = rows.shift().map(v31NormHeader);
      return rows.map((cols, i) => {
        const rec = { row: i + 2 };
        headers.forEach((h, idx) => rec[h] = String(cols[idx] || '').trim());
        rec.entity = rec.entity || '';
        rec.operation = rec.operation || '';
        rec.action = rec.action || v31LegacyAction(rec);
        rec.campaignId = rec.campaignid || '';
        rec.adGroupId = rec.adgroupid || '';
        rec.targetId = rec.targetid || '';
        rec.target = rec.target || '';
        rec.value = rec.value || '';
        rec.bid = rec.bid || '';
        rec.type = rec.type || '';
        rec.status = rec.status || '';
        rec.placement = rec.placement || '';
        rec.percentage = rec.percentage || '';
        rec.condition = rec.condition || '';
        return rec;
      });
    }

    function v31LegacyAction(r) {
      if (r.action) return r.action;
      const e = String(r.entity || '').toLowerCase();
      const o = String(r.operation || '').toLowerCase();
      if (e === 'campaign' && o === 'update') return 'campaign_update';
      if (e === 'target' && o === 'update') return 'target_update';
      if (e === 'target' && o === 'pause') return 'target_pause';
      if (e === 'target' && o === 'create') return 'target_create';
      if (e === 'negative' && o === 'create') return 'negative_create';
      if (e === 'placement' && o === 'update') return 'placement_update';
      if (e === 'budgetrule' && o === 'create') return 'budget_rule_create';
      if (e === 'productad' && o === 'pause') return 'product_ad_pause';
      return '';
    }

    function v31FindBulkTarget(c, r) {
      return c && ((r.targetId && c.targets.find(t => t.id === r.targetId)) || c.targets.find(t => String(t.value).toLowerCase() === String(r.target).toLowerCase()));
    }

    function validateBulkRow(r) {
      const c = campaignById(state, r.campaignId);
      if (!c) return Object.assign(r, { valid:false, message:'Campaign ID not found.' });
      normalizeCampaign(c);
      if (r.action === 'campaign_budget' || r.action === 'campaign_update') {
        if (r.value && Number(r.value) <= 0) return Object.assign(r, { valid:false, message:'Budget value must be greater than zero.' });
        if (r.status && !['Enabled','Paused','Archived'].includes(r.status)) return Object.assign(r, { valid:false, message:'Campaign status must be Enabled, Paused, or Archived.' });
        return Object.assign(r, { valid:true, message:'Update campaign budget or status.' });
      }
      if (r.action === 'target_bid' || r.action === 'target_update' || r.action === 'target_pause') {
        const t = v31FindBulkTarget(c, r);
        if (!t) return Object.assign(r, { valid:false, message:'Target not found by targetId or target text.' });
        if ((r.action !== 'target_pause') && r.bid && Number(r.bid) <= 0) return Object.assign(r, { valid:false, message:'Bid must be greater than zero.' });
        if (r.status && !['Enabled','Paused','Archived'].includes(r.status)) return Object.assign(r, { valid:false, message:'Invalid target status.' });
        r.targetId = t.id;
        return Object.assign(r, { valid:true, message:'Update target ' + t.value + '.' });
      }
      if (r.action === 'target_create') {
        const agId = r.adGroupId || c.adGroups[0].id;
        if (!c.adGroups.some(ag => ag.id === agId)) return Object.assign(r, { valid:false, message:'Ad group ID does not belong to campaign.' });
        if (!r.value && !r.target) return Object.assign(r, { valid:false, message:'New target needs value or target.' });
        if (Number(r.bid) <= 0) return Object.assign(r, { valid:false, message:'New target needs bid greater than zero.' });
        r.adGroupId = agId;
        return Object.assign(r, { valid:true, message:'Create target under ad group ' + agId + '.' });
      }
      if (r.action === 'negative_exact' || r.action === 'negative_phrase' || r.action === 'negative_create') {
        const value = r.value || r.target;
        if (!value) return Object.assign(r, { valid:false, message:'Negative value is required.' });
        r.value = value;
        return Object.assign(r, { valid:true, message:'Add negative ' + value + '.' });
      }
      if (r.action === 'placement_update') {
        const p = String(r.placement || r.target || '').toLowerCase();
        const pct = Number(r.percentage || r.value || 0);
        if (!['top','product','rest'].includes(p)) return Object.assign(r, { valid:false, message:'Placement must be top, product, or rest.' });
        if (pct < 0 || pct > 900) return Object.assign(r, { valid:false, message:'Placement percentage must be 0 to 900.' });
        r.placement = p; r.percentage = pct;
        return Object.assign(r, { valid:true, message:'Set ' + p + ' placement to ' + pct + '%.' });
      }
      if (r.action === 'budget_rule_create') {
        if (Number(r.percentage || r.value || 0) <= 0) return Object.assign(r, { valid:false, message:'Budget rule increase percentage is required.' });
        return Object.assign(r, { valid:true, message:'Create budget rule.' });
      }
      if (r.action === 'product_ad_pause') {
        const ad = c.ads.find(x => x.id === r.value || x.asin === r.value || x.asin === r.target);
        if (!ad) return Object.assign(r, { valid:false, message:'Product ad not found by ID or ASIN.' });
        r.adId = ad.id;
        return Object.assign(r, { valid:true, message:'Pause product ad ' + ad.asin + '.' });
      }
      return Object.assign(r, { valid:false, message:'Unsupported action or entity-operation pair.' });
    }

    function renderBulkOps() {

    function previewBulk() {
      state.bulkPreview = parseBulk().map(validateBulkRow);
      const ok = state.bulkPreview.length && state.bulkPreview.every(r => r.valid);
      logAction('bulk_preview', `${state.bulkPreview.length} rows validated`, ok ? 'good' : 'warn');

    function applyBulk() {
      if (!state.bulkPreview.length) state.bulkPreview = parseBulk().map(validateBulkRow);
      const valid = state.bulkPreview.filter(r => r.valid);
      valid.forEach(r => {
        const c = campaignById(state, r.campaignId); if (!c) return;

    function integrityChecks() {
      const checks = [];
      const add = (severity, entity, message, fix='') => checks.push({ severity, entity, message, fix });
      const productSet = new Set(products.map(p => p.asin));
      const campaignIds = new Set(), agIds = new Set(), adIds = new Set(), targetIds = new Set();
      state.campaigns.forEach(c => {
        if (campaignIds.has(c.id)) add('error', c.id, 'Duplicate campaign ID detected.', 'Run self-heal or duplicate again.');
        campaignIds.add(c.id);
        if (!c.adGroups || !c.adGroups.length) add('error', c.id, 'Campaign has no ad group.', 'Run self-heal.');
        if (c.dailyBudget <= 0) add('error', c.id, 'Daily budget is not valid.', 'Set a daily budget above zero.');
        if (c.endDate && c.startDate && new Date(c.endDate) < new Date(c.startDate)) add('error', c.id, 'End date is before start date.', 'Move end date after start date.');
        (c.products || []).forEach(asin => { if (!productSet.has(asin)) add('error', c.id, `Product ASIN ${asin} does not exist.`, 'Use a valid catalog ASIN.'); if (v31RetailStatus(asin) === 'Low Inventory' && c.status === 'Enabled') add('warn', c.id, `${asin} is low inventory while campaign is enabled.`, 'Pause scaling or reduce budget.'); });
        const localAgIds = new Set((c.adGroups || []).map(ag => ag.id));
        (c.adGroups || []).forEach(ag => { if (agIds.has(ag.id)) add('error', ag.id, 'Duplicate ad group ID detected.', 'Regenerate child IDs.'); agIds.add(ag.id); if (ag.campaignId !== c.id) add('error', ag.id, 'Ad group points to wrong campaign.', 'Run self-heal.'); });
        (c.ads || []).forEach(ad => { if (adIds.has(ad.id)) add('error', ad.id, 'Duplicate product ad ID detected.', 'Regenerate child IDs.'); adIds.add(ad.id); if (ad.campaignId !== c.id) add('error', ad.id, 'Product ad points to wrong campaign.', 'Run self-heal.'); if (!localAgIds.has(ad.adGroupId)) add('error', ad.id, 'Product ad has missing ad group reference.', 'Attach to valid ad group.'); if (!productSet.has(ad.asin)) add('error', ad.id, 'Product ad ASIN is not in catalog.', 'Use valid ASIN.'); });
        (c.targets || []).forEach(t => { if (targetIds.has(t.id)) add('error', t.id, 'Duplicate target ID detected.', 'Regenerate child IDs.'); targetIds.add(t.id); if (t.campaignId !== c.id) add('error', t.id, 'Target points to wrong campaign.', 'Run self-heal.'); if (!localAgIds.has(t.adGroupId)) add('error', t.id, 'Target has missing ad group reference.', 'Attach to valid ad group.'); if (Number(t.bid) <= 0) add('error', t.id, 'Target bid is not valid.', 'Set bid above zero.'); });
        if (c.type === 'SP' && c.targetingMode === 'Automatic') ['Close match','Loose match','Substitutes','Complements'].forEach(g => { if (!c.targets.some(t => t.type === 'Auto' && t.value === g)) add('warn', c.id, 'SP auto group missing: ' + g + '.', 'Run self-heal or add target group.'); });
        (c.searchTerms || []).forEach(st => { if (st.campaignId !== c.id) add('error', st.id, 'Search term points to wrong campaign.', 'Run self-heal.'); if (c.type === 'SD') add('warn', st.id, 'Sponsored Display has search term rows.', 'Use audience/contextual reports for SD.'); if (c.type !== 'SD' && !st.targetId) add('warn', st.id, `Search term "${st.term}" has no target link.`, 'Attach to matched target.'); });
        const negKeys = new Set();
        (c.negatives || []).forEach(n => { const key = `${n.type}|${String(n.value).toLowerCase()}`; if (negKeys.has(key)) add('warn', n.id, 'Duplicate negative targeting row.', 'Remove duplicate negative.'); negKeys.add(key); if (n.campaignId !== c.id) add('error', n.id, 'Negative points to wrong campaign.', 'Run self-heal.'); });
        (c.budgetRules || []).forEach(r => { if (r.campaignId !== c.id) add('error', r.id, 'Budget rule points to wrong campaign.', 'Run self-heal.'); if (Number(r.increase) <= 0 || Number(r.increase) > 200) add('warn', r.id, 'Budget rule increase outside safe training range.', 'Use 1% to 200%.'); });
        if (c.type === 'SB') { if (c.adFormat === 'Product collection' && c.products.length < 3) add('error', c.id, 'SB Product Collection needs at least three products.', 'Select three products.'); if (c.adFormat === 'Video' && !(c.creative && c.creative.video)) add('error', c.id, 'SB Video has no video placeholder.', 'Add video placeholder.'); if (c.creativeStatus === 'Rejected') add('warn', c.id, `Creative rejected: ${c.creativeIssue || 'review needed'}`, 'Use Fix creative approval.'); }
        if (c.type === 'SD' && !(String(c.targetingMode).includes('Contextual') || String(c.targetingMode).includes('Audiences'))) add('error', c.id, 'SD targeting mode is not contextual or audience-based.', 'Choose contextual or audience targeting.');
      });
      return checks;
    }

    function evaluateAction(type, detail, quality) {
      if (quality) return { tone:quality, message:quality === 'good' ? 'Good operator move. Ask for the reasoning and rollback path.' : quality === 'bad' ? 'Risky action. Review context before repeating.' : 'Needs trainer review.' };
      if (type === 'negative_added') {
        const term = String(detail).split('|')[0].trim();
        const found = v31FindSearchTerm(term);
        if (found && found.searchTerm.orders > 0) return { tone:'bad', message:'Risky negative. This term has orders.' };
        if (found && found.searchTerm.clicks >= 20 && found.searchTerm.sales === 0) return { tone:'good', message:'Good negative candidate. Spend exists without sales.' };
      }
      if (type === 'harvest_term') {
        const term = String(detail).split('|')[0].trim();
        const found = v31FindSearchTerm(term);
        if (found && found.searchTerm.orders > 0) return { tone:'good', message:'Good harvest. Converting query moved into controlled targeting.' };
        return { tone:'bad', message:'Do not harvest non-converting terms as winners.' };
      }
      const good = ['budget_rule_created','campaign_created','export_report','copy_report','request_report','simulation_run','bulk_apply','integrity_repair','export_object_map','download_bulk_template','trainer_notes_saved','trainee_saved'];
      const warn = ['bid_up','placement_change','budget_change','status_change','duplicate_campaign','settings_change','bulk_preview','open_tab','open_campaign'];

      if (bad.includes(type)) return { tone:'bad', message:'High-risk action. Archive only after approval and rollback review.' };

    }

      const good = ['budget_rule_created','campaign_created','export_report','copy_report','request_report','simulation_run','bulk_apply','integrity_repair','export_object_map','download_bulk_template','trainer_notes_saved','trainee_saved','scenario_generated','mission_started','creative_repair','export_progress','import_progress'];
      const warn = ['bid_up','bid_down','placement_change','budget_change','status_change','duplicate_campaign','settings_change','bulk_preview','open_tab','open_campaign'];
      const bad = ['archive_campaign'];
      if (good.includes(type)) return { tone:'good', message:'Good training action. Explain why it was safe and how to roll it back.' };
      if (warn.includes(type)) return { tone:'warn', message:'Requires context. Check ACOS, CVR, margin, inventory, goal, and approval level.' };
      if (bad.includes(type)) return { tone:'bad', message:'High-risk action. Archive only after approval and rollback review.' };
      return { tone:'warn', message:'Action logged. Trainer should ask for reasoning.' };
    }

    function launchCampaign() {
      const d = copy(state.draft);
      const result = validateDraftDetailed(d);
      if (result.errors.length) { toast('Launch blocked. Fix validation errors first.', 'bad'); render(); return; }
      const id = uid('C-' + d.type);
      const ag = { id: uid('AG'), campaignId: id, name: d.type + ' training ad group', status: d.status, defaultBid: Number(d.defaultBid) };
      const targets = draftTargets(d).map(t => Object.assign(t, { campaignId: id, adGroupId: ag.id }));
      const ads = uniqueList(d.products).map((asin, i) => ({ id:uid('AD'), campaignId:id, adGroupId:ag.id, asin, status:d.status === 'Archived' ? 'Archived' : 'Enabled', name:`${d.type} product ad ${i + 1}` }));
      const c = {
        id, type: d.type, name: d.name, portfolio: d.portfolio, status: d.status, dailyBudget: Number(d.dailyBudget), startDate: d.startDate, endDate: d.endDate,
        targetingMode: d.targetingMode, adFormat: d.adFormat, bidStrategy: d.bidStrategy, defaultBid: Number(d.defaultBid), products: uniqueList(d.products),
        creative: d.type === 'SP' ? null : copy(d.creative), creativeStatus: result.warnings.length ? 'Pending review' : 'Approved', creativeIssue: result.warnings.join(' '),
        placements: copy(d.placements), budgetRules: [], negatives: [], metrics: { impressions:0, clicks:0, spend:0, sales:0, orders:0 }, adGroups: [ag], ads, targets,
        searchTerms: d.type === 'SD' ? [] : seedSearchTerms(d, id, ag.id, targets), history: [], createdBySimulator: true
      };
      v31AppendHistory(c, 'Campaign launched in simulator with normalized parent-child relationships.');
      normalizeCampaign(c);
      state.campaigns.unshift(c);
      normalizeState();
      state.selectedCampaignId = id;
      state.selectedTab = 'overview';
      state.view = 'campaigns';
      state.draft = makeDraft();
      state.wizardStep = 1;
      logAction('campaign_created', `${c.type} ${c.name}`, result.warnings.length ? { tone:'warn', message:result.warnings.join(' ') } : 'good');
      toast(`${campaignTypeLabel(c.type)} campaign launched in training sandbox.`, result.warnings.length ? 'warn' : 'good');
    }

    function duplicateCampaign(id) {
      const c = campaignById(state, id); if (!c) return;
      normalizeCampaign(c);
      const n = copy(c);
      const newId = uid('C-' + n.type);
      const agMap = {}, targetMap = {};
      n.id = newId; n.name += ' copy'; n.status = 'Paused'; n.createdBySimulator = true;
      n.metrics = { impressions:0, clicks:0, spend:0, sales:0, orders:0 };
      n.history = [];
      n.adGroups = (n.adGroups || []).map(ag => { const old = ag.id, newAg = uid('AG'); agMap[old] = newAg; return Object.assign(ag, { id:newAg, campaignId:newId, status:'Paused' }); });
      if (!n.adGroups.length) n.adGroups = [{ id:uid('AG'), campaignId:newId, name:n.type + ' copied ad group', status:'Paused', defaultBid:n.defaultBid }];
      const primary = n.adGroups[0].id;
      n.ads = (n.ads || []).map(ad => Object.assign(ad, { id:uid('AD'), campaignId:newId, adGroupId:agMap[ad.adGroupId] || primary, status:'Paused' }));
      n.targets = (n.targets || []).map(t => { const old = t.id, newT = uid('T'); targetMap[old] = newT; return Object.assign(t, { id:newT, campaignId:newId, adGroupId:agMap[t.adGroupId] || primary, status:'Paused', impressions:0, clicks:0, spend:0, sales:0, orders:0 }); });
      n.searchTerms = [];
      n.negatives = (n.negatives || []).map(neg => Object.assign(neg, { id:uid('NEG'), campaignId:newId, adGroupId:agMap[neg.adGroupId] || primary, sourceSearchTermId:'' }));
      n.budgetRules = (n.budgetRules || []).map(r => Object.assign(r, { id:uid('BR'), campaignId:newId }));
      if (n.creative) n.creativeStatus = 'Draft';
      v31AppendHistory(n, `Duplicated from ${c.id} as paused copy with regenerated child IDs and cleared report rows.`);
      normalizeCampaign(n);
      state.campaigns.unshift(n);
      normalizeState();
      logAction('duplicate_campaign', `${c.name} copied to ${n.id}`, { tone:'good', message:'Duplicate created as paused clean copy with child relationships re-keyed.' });
      toast('Campaign duplicated as paused copy with fresh object IDs.', 'good'); render();
    }

    function toggleStatus(id) {
      const c = campaignById(state, id); if (!c || c.status === 'Archived') return;
      const next = c.status === 'Enabled' ? 'Paused' : 'Enabled';
      if (next === 'Enabled' && c.type !== 'SP' && c.creativeStatus === 'Rejected') {
        logAction('status_change', `${c.name} blocked due to rejected creative`, { tone:'bad', message:'Cannot safely enable a rejected creative. Fix approval issue first.' });
        toast('Enable blocked. Fix rejected creative first.', 'bad'); render(); return;
      }
      c.status = next;
      (c.adGroups || []).forEach(ag => ag.status = next);
      (c.ads || []).forEach(ad => ad.status = next);
      (c.targets || []).forEach(t => t.status = next);
      v31AppendHistory(c, `Status changed to ${c.status} with child statuses updated.`);
      const low = next === 'Enabled' && v31HasLowInventory(c);
      logAction('status_change', `${c.name} ${c.status}`, low ? { tone:'warn', message:'Campaign enabled with low-inventory product. Confirm retail readiness before scaling.' } : 'good');
      toast(`${c.name} is now ${c.status}.`, low ? 'warn' : 'good'); render();
    }

    function harvestTerm(cid, term) {
      const source = campaignById(state, cid);
      const row = source && (source.searchTerms || []).find(x => String(x.term).toLowerCase() === String(term).toLowerCase());
      const manual = state.campaigns.find(c => c.id === 'C-SP-MAN-002') || state.campaigns.find(c => c.type === 'SP' && String(c.targetingMode).includes('Manual'));
      if (!manual) { toast('No manual SP campaign found for harvesting.', 'bad'); return; }
      normalizeCampaign(manual);
      const agId = manual.adGroups[0].id;
      const duplicate = manual.targets.some(t => t.value.toLowerCase() === String(term).toLowerCase() && t.match === 'Exact');
      if (!duplicate) {
        manual.targets.push(Object.assign(makeTarget('Keyword', term, 'Exact', Math.max(manual.defaultBid, 0.9)), { campaignId: manual.id, adGroupId: agId }));
        v31AppendHistory(manual, `Harvested search term as exact: ${term}`);
      }
      const q = duplicate ? { tone:'warn', message:'Exact target already exists. Do not create duplicate harvested keywords.' } : gradeHarvest(row);
      logAction('harvest_term', `${term} | orders ${row ? row.orders : 0} | sales ${row ? row.sales : 0}`, q);
      toast(duplicate ? `Exact keyword already exists: ${term}.` : `Harvested as exact keyword: ${term}.`, v32SafeToastTone(q));
      render();
    }

    function addNegative(cid, term, type) {
      const c = campaignById(state, cid); if (!c) return;
      normalizeCampaign(c);
      const st = (c.searchTerms || []).find(x => String(x.term).toLowerCase() === String(term).toLowerCase());
      const duplicate = c.negatives.some(n => n.value.toLowerCase() === String(term).toLowerCase() && n.type === type);
      if (!duplicate) c.negatives.push({ id:uid('NEG'), campaignId:c.id, adGroupId:c.adGroups[0].id, type, value:term, sourceSearchTermId:st ? st.id : '' });
      v31AppendHistory(c, duplicate ? `Skipped duplicate ${type}: ${term}` : `Added ${type}: ${term}`);
      const q = gradeNegative(c, st, type, duplicate);
      logAction('negative_added', `${term} | orders ${st ? st.orders : 'na'} | sales ${st ? st.sales : 'na'}`, q);
      toast(duplicate ? `Duplicate ${type} skipped: ${term}.` : `Added ${type}: ${term}.`, v32SafeToastTone(q));
      render();
    }

    function adjustTargetBid(cid, tid, mult) {
      const c = campaignById(state, cid); const t = c && c.targets.find(x => x.id === tid); if (!t) return;
      const old = Number(t.bid || 0);
      t.bid = Math.max(0.02, Math.round(t.bid * mult * 100) / 100);
      const q = gradeBidMove(c, t, mult, old, t.bid);
      v31AppendHistory(c, `Bid updated for ${t.value} from ${fmt.bid(old)} to ${fmt.bid(t.bid)}`);
      logAction(mult > 1 ? 'bid_up' : 'bid_down', `${t.value} ${fmt.bid(old)} to ${fmt.bid(t.bid)} ACOS ${t.sales ? fmt.pct(calc(t).acos) : 'no sales'}`, q);
      toast(`Bid updated for ${t.value}: ${fmt.bid(t.bid)}.`, v32SafeToastTone(q));
      render();
    }

    function pauseTarget(cid, tid) {
      const c = campaignById(state, cid); const t = c && c.targets.find(x => x.id === tid); if (!t) return;
      t.status = 'Paused';
      v31AppendHistory(c, `Paused target ${t.value}`);
      const q = gradePauseTarget(t);
      logAction('pause_target', t.value, q);
      toast(`Paused target: ${t.value}.`, v32SafeToastTone(q));
      render();
    }

    function validateBulkRow(r) {
      const c = campaignById(state, r.campaignId);
      if (!c) return Object.assign(r, { valid:false, severity:'bad', message:'Campaign ID not found.' });
      normalizeCampaign(c);
      if (r.action === 'campaign_budget' || r.action === 'campaign_update') {
        if (r.status && !['Enabled','Paused','Archived'].includes(r.status)) return Object.assign(r, { valid:false, severity:'bad', message:'Campaign status must be Enabled, Paused, or Archived.' });
        if (r.status === 'Enabled' && c.type !== 'SP' && c.creativeStatus === 'Rejected') return Object.assign(r, { valid:false, severity:'bad', message:'Cannot enable a rejected creative campaign.' });
        if (r.value && Number(r.value) <= 0) return Object.assign(r, { valid:false, severity:'bad', message:'Budget value must be greater than zero.' });
        const q = r.value ? gradeBudgetChange(c, c.dailyBudget, Number(r.value)) : { tone:r.status === 'Archived' ? 'warn' : 'good', message:`Set status to ${r.status || c.status}.` };
        return Object.assign(r, { valid:true, severity:v32Tone(q), message:(r.value ? `Set budget to ${fmt.money(r.value)}. ` : `Update status. `) + v32Message(q) });
      }
      if (r.action === 'target_bid' || r.action === 'target_update' || r.action === 'target_pause') {
        const t = v31FindBulkTarget(c, r);
        if (!t) return Object.assign(r, { valid:false, severity:'bad', message:'Target not found by targetId or target text.' });
        if ((r.action !== 'target_pause') && !(Number(r.bid) > 0)) return Object.assign(r, { valid:false, severity:'bad', message:'Bid must be greater than zero.' });
        if (r.status && !['Enabled','Paused','Archived'].includes(r.status)) return Object.assign(r, { valid:false, severity:'bad', message:'Invalid target status.' });
        r.targetId = t.id;
        const q = r.action === 'target_pause' ? gradePauseTarget(t) : gradeBidMove(c, t, Number(r.bid) > Number(t.bid) ? 1.1 : 0.9, t.bid, Number(r.bid));
        return Object.assign(r, { valid:v32Tone(q) !== 'bad', severity:v32Tone(q), message:(r.action === 'target_pause' ? `Pause target ${t.value}. ` : `Update target ${t.value}. `) + v32Message(q) });
      }
      if (r.action === 'target_create') {
        const agId = r.adGroupId || c.adGroups[0].id;
        if (!c.adGroups.some(ag => ag.id === agId)) return Object.assign(r, { valid:false, severity:'bad', message:'Ad group ID does not belong to campaign.' });
        if (!r.value && !r.target) return Object.assign(r, { valid:false, severity:'bad', message:'New target needs value or target.' });
        if (Number(r.bid) <= 0) return Object.assign(r, { valid:false, severity:'bad', message:'New target needs bid greater than zero.' });
        r.adGroupId = agId;
        return Object.assign(r, { valid:true, severity:'good', message:'Create target under ad group ' + agId + '.' });
      }
      if (r.action === 'negative_exact' || r.action === 'negative_phrase' || r.action === 'negative_create') {
        const value = r.value || r.target;
        if (!value) return Object.assign(r, { valid:false, severity:'bad', message:'Negative value is required.' });
        const type = r.type || (r.action === 'negative_phrase' ? 'Negative phrase' : 'Negative exact');
        const st = (c.searchTerms || []).find(x => String(x.term).toLowerCase() === String(value).toLowerCase());
        const duplicate = c.negatives.some(n => n.type === type && String(n.value).toLowerCase() === String(value).toLowerCase());
        const q = gradeNegative(c, st, type, duplicate);
        r.value = value; r.type = type;
        return Object.assign(r, { valid:v32Tone(q) !== 'bad', severity:v32Tone(q), message:'Add ' + type + ': ' + value + '. ' + v32Message(q) });
      }
      if (r.action === 'placement_update') {
        const p = String(r.placement || r.target || '').toLowerCase();
        const pct = Number(r.percentage || r.value || 0);
        if (!['top','product','rest'].includes(p)) return Object.assign(r, { valid:false, severity:'bad', message:'Placement must be top, product, or rest.' });
        if (pct < 0 || pct > 900) return Object.assign(r, { valid:false, severity:'bad', message:'Placement percentage must be 0 to 900.' });
        r.placement = p; r.percentage = pct;
        return Object.assign(r, { valid:true, severity:pct > 100 ? 'warn' : 'good', message:'Set ' + p + ' placement to ' + pct + '%.' });
      }
      if (r.action === 'budget_rule_create') {
        const pct = Number(r.percentage || 0);
        if (!(pct > 0) || pct > 200) return Object.assign(r, { valid:false, severity:'bad', message:'Budget rule increase must be 1% to 200%.' });
        return Object.assign(r, { valid:true, severity:pct > 100 ? 'warn' : 'good', message:'Create budget rule at +' + pct + '%.' });
      }
      if (r.action === 'product_ad_pause') {
        const ad = c.ads.find(x => x.id === r.value || x.asin === r.value || x.asin === r.target);
        if (!ad) return Object.assign(r, { valid:false, severity:'bad', message:'Product ad not found by ID or ASIN.' });
        r.adId = ad.id;
        return Object.assign(r, { valid:true, severity:'warn', message:'Pause product ad ' + ad.asin + '. Confirm ASIN-level reason first.' });
      }
      return Object.assign(r, { valid:false, severity:'bad', message:'Unsupported action or entity-operation pair.' });
    }

    function previewBulk() {
      state.bulkPreview = parseBulk().map(validateBulkRow);
      const hasErrors = state.bulkPreview.some(r => !r.valid);
      const hasWarnings = state.bulkPreview.some(r => r.valid && r.severity === 'warn');
      logAction('bulk_preview', `${state.bulkPreview.length} rows validated`, hasErrors ? 'bad' : hasWarnings ? 'warn' : 'good');
      toast('Bulk sheet validated.', hasErrors ? 'bad' : hasWarnings ? 'warn' : 'good'); render();
    }

    function applyBulk() {
      if (!state.bulkPreview.length) state.bulkPreview = parseBulk().map(validateBulkRow);
      const valid = state.bulkPreview.filter(r => r.valid);
      valid.forEach(r => {
        const c = campaignById(state, r.campaignId); if (!c) return;
        normalizeCampaign(c);
        if (r.action === 'campaign_budget' || r.action === 'campaign_update') { if (r.value) c.dailyBudget = Number(r.value); if (r.status) { c.status = r.status; (c.adGroups || []).forEach(ag => ag.status = r.status); (c.ads || []).forEach(ad => ad.status = r.status); (c.targets || []).forEach(t => t.status = r.status); } v31AppendHistory(c, 'Bulk updated campaign.'); }
        if (r.action === 'target_bid' || r.action === 'target_update') { const t = v31FindBulkTarget(c, r); if (t) { if (r.bid) t.bid = Number(r.bid); if (r.status) t.status = r.status; v31AppendHistory(c, 'Bulk updated target ' + t.value + '.'); } }
        if (r.action === 'target_pause') { const t = v31FindBulkTarget(c, r); if (t) { t.status = 'Paused'; v31AppendHistory(c, 'Bulk paused target ' + t.value + '.'); } }
        if (r.action === 'target_create') { c.targets.push(metricDefaults({ id:uid('T'), campaignId:c.id, adGroupId:r.adGroupId || c.adGroups[0].id, type:r.type || 'Keyword', value:r.value || r.target, match:r.type || 'Exact', bid:Number(r.bid), status:r.status || 'Enabled' })); v31AppendHistory(c, 'Bulk created target ' + (r.value || r.target) + '.'); }
        if (r.action === 'negative_exact' || r.action === 'negative_phrase' || r.action === 'negative_create') { if (!c.negatives.some(n => n.type === r.type && String(n.value).toLowerCase() === String(r.value || r.target).toLowerCase())) c.negatives.push({ id:uid('NEG'), campaignId:c.id, adGroupId:r.adGroupId || c.adGroups[0].id, type:r.type || (r.action === 'negative_phrase' ? 'Negative phrase' : 'Negative exact'), value:r.value || r.target }); v31AppendHistory(c, 'Bulk added negative ' + (r.value || r.target) + '.'); }
        if (r.action === 'placement_update') { c.placements[r.placement] = Number(r.percentage); v31AppendHistory(c, 'Bulk updated ' + r.placement + ' placement to ' + r.percentage + '%.'); }
        if (r.action === 'budget_rule_create') { c.budgetRules.push({ id:uid('BR'), campaignId:c.id, name:r.value || 'Bulk budget rule', type:r.type || 'Schedule', increase:Number(r.percentage || 1), condition:r.condition || 'Bulk training rule' }); v31AppendHistory(c, 'Bulk created budget rule.'); }
        if (r.action === 'product_ad_pause') { const ad = c.ads.find(x => x.id === r.adId); if (ad) { ad.status = 'Paused'; v31AppendHistory(c, 'Bulk paused product ad ' + ad.asin + '.'); } }
      });
      normalizeState();
      const all = valid.length === state.bulkPreview.length;
      logAction('bulk_apply', `${valid.length} valid rows applied of ${state.bulkPreview.length}`, all ? 'good' : 'warn');
      toast(`${valid.length} bulk rows applied to sandbox.`, valid.length ? (all ? 'good' : 'warn') : 'bad'); render();
    }

    function downloadBulkTemplate() {
      downloadText('ppc-simulator-v3.2-bulk-template.csv', V31_BULK_TEMPLATE.replace(/\\n/g, '\n'), 'text/csv');
      logAction('download_bulk_template', 'V3.2 bulk template downloaded', 'good'); toast('V3.2 bulk template downloaded.', 'good');
    }

    function integrityChecks() {
      const checks = [];
      const add = (severity, entity, message, fix='') => checks.push({ severity, entity, message, fix });
      const productSet = new Set(products.map(p => p.asin));
      const campaignIds = new Set(), agIds = new Set(), adIds = new Set(), targetIds = new Set();
      state.campaigns.forEach(c => {
        if (campaignIds.has(c.id)) add('error', c.id, 'Duplicate campaign ID detected.', 'Run self-heal or duplicate again.');
        campaignIds.add(c.id);
        if (!c.adGroups || !c.adGroups.length) add('error', c.id, 'Campaign has no ad group.', 'Run self-heal.');
        if (c.dailyBudget <= 0) add('error', c.id, 'Daily budget is not valid.', 'Set a daily budget above zero.');
        if (c.defaultBid <= 0) add('error', c.id, 'Default bid is not valid.', 'Set a bid above zero.');
        if (c.endDate && c.startDate && new Date(c.endDate) < new Date(c.startDate)) add('error', c.id, 'End date is before start date.', 'Move end date after start date.');
        (c.products || []).forEach(asin => { if (!productSet.has(asin)) add('error', c.id, `Product ASIN ${asin} does not exist.`, 'Use a valid catalog ASIN.'); if (v31RetailStatus(asin) === 'Low Inventory' && c.status === 'Enabled') add('warn', c.id, `${asin} is low inventory while campaign is enabled.`, 'Pause scaling or reduce budget.'); });
        const localAgIds = new Set((c.adGroups || []).map(ag => ag.id));
        (c.adGroups || []).forEach(ag => { if (agIds.has(ag.id)) add('error', ag.id, 'Duplicate ad group ID detected.', 'Regenerate child IDs.'); agIds.add(ag.id); if (ag.campaignId !== c.id) add('error', ag.id, 'Ad group points to wrong campaign.', 'Run self-heal.'); if (c.status === 'Archived' && ag.status !== 'Archived') add('error', ag.id, 'Archived campaign has active ad group.', 'Archive children with parent.'); });
        (c.ads || []).forEach(ad => { if (adIds.has(ad.id)) add('error', ad.id, 'Duplicate product ad ID detected.', 'Regenerate child IDs.'); adIds.add(ad.id); if (ad.campaignId !== c.id) add('error', ad.id, 'Product ad points to wrong campaign.', 'Run self-heal.'); if (!localAgIds.has(ad.adGroupId)) add('error', ad.id, 'Product ad has missing ad group reference.', 'Attach to valid ad group.'); if (!productSet.has(ad.asin)) add('error', ad.id, 'Product ad ASIN is not in catalog.', 'Use valid ASIN.'); if (c.status === 'Archived' && ad.status !== 'Archived') add('error', ad.id, 'Archived campaign has active product ad.', 'Archive children with parent.'); });
        (c.targets || []).forEach(t => { if (targetIds.has(t.id)) add('error', t.id, 'Duplicate target ID detected.', 'Regenerate child IDs.'); targetIds.add(t.id); if (t.campaignId !== c.id) add('error', t.id, 'Target points to wrong campaign.', 'Run self-heal.'); if (!localAgIds.has(t.adGroupId)) add('error', t.id, 'Target has missing ad group reference.', 'Attach to valid ad group.'); if (Number(t.bid) <= 0) add('error', t.id, 'Target bid is not valid.', 'Set bid above zero.'); if (c.status === 'Archived' && t.status !== 'Archived') add('error', t.id, 'Archived campaign has active target.', 'Archive children with parent.'); });
        if (c.type === 'SP' && c.targetingMode === 'Automatic') ['Close match','Loose match','Substitutes','Complements'].forEach(g => { if (!c.targets.some(t => t.type === 'Auto' && t.value === g)) add('warn', c.id, 'SP auto group missing: ' + g + '.', 'Run self-heal or add target group.'); });
        (c.searchTerms || []).forEach(st => { if (st.campaignId !== c.id) add('error', st.id, 'Search term points to wrong campaign.', 'Run self-heal.'); if (c.type === 'SD') add('warn', st.id, 'Sponsored Display has search term rows.', 'Use audience/contextual reports for SD.'); if (c.type !== 'SD' && !st.targetId) add('warn', st.id, `Search term "${st.term}" has no target link.`, 'Attach to matched target.'); });
        const negKeys = new Set();
        (c.negatives || []).forEach(n => { const key = `${n.type}|${String(n.value).toLowerCase()}`; if (negKeys.has(key)) add('warn', n.id, 'Duplicate negative targeting row.', 'Remove duplicate negative.'); negKeys.add(key); if (n.campaignId !== c.id) add('error', n.id, 'Negative points to wrong campaign.', 'Run self-heal.'); if (!localAgIds.has(n.adGroupId)) add('error', n.id, 'Negative has missing ad group reference.', 'Attach to valid ad group.'); });
        (c.budgetRules || []).forEach(r => { if (r.campaignId !== c.id) add('error', r.id, 'Budget rule points to wrong campaign.', 'Run self-heal.'); if (Number(r.increase) <= 0 || Number(r.increase) > 200) add('warn', r.id, 'Budget rule increase outside safe training range.', 'Use 1% to 200%.'); });
        if (c.type === 'SB') { if (c.adFormat === 'Product collection' && c.products.length < 3) add('error', c.id, 'SB Product Collection needs at least three products.', 'Select three products.'); if (c.adFormat === 'Store spotlight' && c.creative?.destination !== 'Brand Store') add('error', c.id, 'SB Store Spotlight should use Brand Store destination.', 'Switch destination to Brand Store.'); if (c.adFormat === 'Video' && !(c.creative && c.creative.video)) add('error', c.id, 'SB Video has no video placeholder.', 'Add video placeholder.'); if (c.creativeStatus === 'Rejected') add('warn', c.id, `Creative rejected: ${c.creativeIssue || 'review needed'}`, 'Use Fix creative approval.'); }
        if (c.type === 'SD' && !(String(c.targetingMode).includes('Contextual') || String(c.targetingMode).includes('Audiences'))) add('error', c.id, 'SD targeting mode is not contextual or audience-based.', 'Choose contextual or audience targeting.');
      });
      return checks;
    }

    function v33EnsureState() {
      if (typeof state.activeNavigationDrillId !== 'string') state.activeNavigationDrillId = '';
      if (typeof state.navigationDrillStep !== 'number') state.navigationDrillStep = 0;
      if (typeof state.navigationDrillMistakes !== 'number') state.navigationDrillMistakes = 0;
      if (typeof state.navigationDrillSkips !== 'number') state.navigationDrillSkips = 0;
      if (!Array.isArray(state.navigationDrillLog)) state.navigationDrillLog = [];
      if (!Array.isArray(state.navigationDrillResults)) state.navigationDrillResults = [];
      if (typeof state.navigationDrillStartedAt !== 'string') state.navigationDrillStartedAt = '';
      if (typeof state.navigationDrillCompleted !== 'boolean') state.navigationDrillCompleted = false;
      if (state.activeNavigationDrillId && !v33NavigationDrillById(state.activeNavigationDrillId)) {
        state.activeNavigationDrillId = '';
        state.navigationDrillStep = 0;
        state.navigationDrillCompleted = false;
      }
    }

    function v33NavigationDrillById(id) { return V33_NAVIGATION_DRILLS.find(d => d.id === id); }
    function v33ActiveNavigationDrill() { return v33NavigationDrillById(state.activeNavigationDrillId); }
    function v33CurrentNavigationStep() {
      const d = v33ActiveNavigationDrill();
      if (!d || state.navigationDrillCompleted) return null;
      return d.steps[state.navigationDrillStep] || null;
    }
    function v33NavigationPct(drill) {
      const total = drill ? drill.steps.length : 0;
      const done = Math.min(state.navigationDrillStep || 0, total);
      return total ? Math.round(done / total * 100) : 0;
    }
    function v33NavigationScore() {
      const penalty = (state.navigationDrillMistakes || 0) * 12 + (state.navigationDrillSkips || 0) * 8;
      return Math.max(0, Math.min(100, 100 - penalty));
    }
    function v33StepState(drill, index) {
      if (!drill) return '';
      if (index < state.navigationDrillStep) return 'done';
      if (index === state.navigationDrillStep && !state.navigationDrillCompleted) return 'current';
      return 'muted-step';
    }
    function v33RenderDrillStepList(drill) {
      if (!drill) return '';
      return drill.steps.map((step, i) => `<div class="nav-drill-step ${v33StepState(drill, i)}"><span class="nav-drill-num">${i < state.navigationDrillStep ? '✓' : i + 1}</span><div><strong>${safe(step.label)}</strong><div class="muted">${safe(step.instruction)}</div>${i === state.navigationDrillStep && state.showHints ? `<div class="small-copy" style="margin-top:5px;">${safe(step.coach || '')}</div>` : ''}</div></div>`).join('');
    }

      </div>`;

    function renderNavigationDrillsPage() {

        ${active ? `<div class="nav-drill-card"><div class="card-title"><h2>Active drill: ${safe(active.title)}</h2><span>${v33NavigationPct(active)}%</span></div><div class="nav-progress" style="--pct:${v33NavigationPct(active)}%"><span></span></div>${v33RenderDrillStepList(active)}<div class="pill-row"><button class="btn" data-action="skipNavStep">Skip current step</button><button class="btn primary" data-action="restartNavDrill">Restart</button></div></div>` : `<div class="warning-tip" style="margin-bottom:14px;"><strong>How it works:</strong><br/>Start a drill, then click only the highlighted element. Wrong clicks are blocked and logged so trainers can see navigation uncertainty without risking a live account.</div>`}
        <div class="module-grid">${V33_NAVIGATION_DRILLS.map(v33DrillCard).join('')}</div>

    function v33RenderNavigationDrillRail() {
      v33EnsureState();
      const drill = v33ActiveNavigationDrill();
      if (!drill) return '';
      const step = v33CurrentNavigationStep();
      const pct = v33NavigationPct(drill);
      if (state.navigationDrillCompleted) {
        return `<div class="nav-drill-card"><div class="card-title"><h2>Navigation drill complete</h2><span>Score ${v33NavigationScore()}%</span></div><h3>${safe(drill.title)}</h3><div class="nav-progress" style="--pct:100%"><span></span></div><p class="muted">Mistakes: ${state.navigationDrillMistakes || 0}. Skips: ${state.navigationDrillSkips || 0}.</p><div class="pill-row"><button class="btn primary" data-action="restartNavDrill">Restart</button><button class="btn" data-action="stopNavDrill">Close</button></div></div>`;
      }
      return `<div class="nav-drill-card"><div class="card-title"><h2>Guided navigation</h2><span>${pct}%</span></div><h3>${safe(drill.title)}</h3><div class="nav-progress" style="--pct:${pct}%"><span></span></div>${step ? `<div class="warning-tip"><strong>Current click:</strong><br/>${safe(step.instruction)}</div>${state.showHints ? `<div class="coach-tip">${safe(step.coach || '')}</div>` : ''}` : ''}<div class="pill-row"><button class="btn" data-action="skipNavStep">Skip step</button><button class="btn danger" data-action="stopNavDrill">Stop</button></div></div>`;
    }
    function v33StartNavigationDrill(id) {
      const drill = v33NavigationDrillById(id);
      if (!drill) { toast('Navigation drill not found.', 'bad'); return; }
      state.activeNavigationDrillId = drill.id;
      state.navigationDrillStep = 0;
      state.navigationDrillMistakes = 0;
      state.navigationDrillSkips = 0;
      state.navigationDrillLog = [];
      state.navigationDrillStartedAt = new Date().toISOString();
      state.navigationDrillCompleted = false;
      logAction('navigation_drill_started', drill.title, { tone:'good', message:'Guided navigation drill started. Follow the highlighted path.' });
      v33EvaluateNavigationDrill(false);
      toast(`Navigation drill started: ${drill.title}.`, 'good');
      render();
    }
    function v33StopNavigationDrill() {
      const drill = v33ActiveNavigationDrill();
      if (drill) logAction('navigation_drill_stopped', drill.title, { tone:'warn', message:'Navigation drill stopped before completion.' });
      state.activeNavigationDrillId = '';
      state.navigationDrillCompleted = false;
      render();
    }
    function v33SkipNavigationStep() {
      const drill = v33ActiveNavigationDrill();
      const step = v33CurrentNavigationStep();
      if (!drill || !step) return;
      state.navigationDrillSkips = (state.navigationDrillSkips || 0) + 1;
      state.navigationDrillLog.unshift({ type:'skip', drillId:drill.id, stepId:step.id, label:step.label, time:new Date().toISOString(), trainee:state.traineeName });
      logAction('navigation_step_skipped', `${drill.title}: ${step.label}`, { tone:'warn', message:'Step skipped. Trainer should ask what path the VA missed.' });
      state.navigationDrillStep += 1;
      if (state.navigationDrillStep >= drill.steps.length) v33CompleteNavigationDrill(drill);
      else render();
    }
    function v33EvaluateNavigationDrill(quiet) {
      v33EnsureState();
      const drill = v33ActiveNavigationDrill();
      if (!drill || state.navigationDrillCompleted) return;
      let advanced = false;
      while (state.navigationDrillStep < drill.steps.length) {
        const step = drill.steps[state.navigationDrillStep];
        let done = false;
        try { done = !!step.done(state); } catch (err) { done = false; }
        if (!done) break;
        state.navigationDrillLog.unshift({ type:'step_complete', drillId:drill.id, stepId:step.id, label:step.label, time:new Date().toISOString(), trainee:state.traineeName });
        logAction('navigation_step_complete', `${drill.title}: ${step.label}`, { tone:'good', message:'Correct navigation click.' });
        state.navigationDrillStep += 1;
        advanced = true;
      }
      if (state.navigationDrillStep >= drill.steps.length) {
        v33CompleteNavigationDrill(drill);
      } else if (advanced && !quiet) {
        render();
      }
    }
    function v33CompleteNavigationDrill(drill) {
      if (!drill || state.navigationDrillCompleted) return;
      state.navigationDrillCompleted = true;
      const score = v33NavigationScore();
      const result = { drillId:drill.id, title:drill.title, trainee:state.traineeName, score, mistakes:state.navigationDrillMistakes || 0, skips:state.navigationDrillSkips || 0, startedAt:state.navigationDrillStartedAt, completedAt:new Date().toISOString() };
      state.navigationDrillResults.push(result);
      state.navigationDrillResults = state.navigationDrillResults.slice(-40);
      state.navigationDrillLog.unshift({ type:'complete', drillId:drill.id, label:drill.title, score, time:result.completedAt, trainee:state.traineeName });
      logAction('navigation_drill_complete', `${drill.title} | Score ${score}%`, { tone: score >= 85 ? 'good' : 'warn', message: score >= 85 ? 'Navigation drill passed.' : 'Navigation drill completed with route mistakes. Repeat before live-account work.' });
      toast(`Navigation drill complete. Score ${score}%.`, score >= 85 ? 'good' : 'warn');
      render();
    }
    function v33NavigationClickGate(e) {
      const drill = v33ActiveNavigationDrill();
      const step = v33CurrentNavigationStep();
      if (!drill || !step) return;
      const target = e.target;
      if (!target || !target.closest) return;
      if (target.closest('[data-action="stopNavDrill"], [data-action="skipNavStep"], [data-action="restartNavDrill"], [data-action="startNavDrill"], [data-view="navDrills"], .toast-stack')) return;
      const selectors = [step.selector].concat(step.allowSelectors || []).filter(Boolean);
      let correct = false;
      for (const sel of selectors) {
        try { if (target.closest(sel)) { correct = true; break; } } catch (err) {}
      }
      if (correct) { setTimeout(() => v33EvaluateNavigationDrill(false), 0); return; }
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      v33RecordNavigationMiss(step, target);
    }
    function v33RecordNavigationMiss(step, target) {
      const drill = v33ActiveNavigationDrill();
      const clicked = v33DescribeClickedElement(target);
      state.navigationDrillMistakes = (state.navigationDrillMistakes || 0) + 1;
      state.navigationDrillLog.unshift({ type:'wrong_click', drillId:drill ? drill.id : '', stepId:step.id, label:step.label, clicked, time:new Date().toISOString(), trainee:state.traineeName });
      logAction('navigation_wrong_click', `${step.label} | clicked ${clicked}`, { tone:'bad', message:'Wrong navigation click blocked. Follow the highlighted target.' });
      toast(`Wrong click blocked. Current step: ${step.label}.`, 'bad');
    }
    function v33DescribeClickedElement(el) {
      if (!el) return 'unknown element';
      const action = el.closest('[data-action]')?.dataset?.action;
      const view = el.closest('[data-view]')?.dataset?.view;
      const campaign = el.closest('[data-campaign]')?.dataset?.campaign;
      const tab = el.closest('[data-tab]')?.dataset?.tab;
      const text = String(el.textContent || '').trim().replace(/\s+/g,' ').slice(0, 60);
      return action ? `action:${action}` : view ? `view:${view}` : campaign ? `campaign:${campaign}` : tab ? `tab:${tab}` : text || el.tagName || 'unknown element';
    }
    let v33LastHighlightedStepKey = '';
    function v33ApplyNavigationDrillHighlight() {
      $$('.nav-drill-target').forEach(el => el.classList.remove('nav-drill-target'));
      const drill = v33ActiveNavigationDrill();
      const step = v33CurrentNavigationStep();
      if (!drill || !step || !step.selector) return;
      let el = null;
      try { el = $(step.selector); } catch (err) { el = null; }
      if (!el) return;
      el.classList.add('nav-drill-target');
      const key = `${drill.id}:${state.navigationDrillStep}`;
      if (key !== v33LastHighlightedStepKey) {
        v33LastHighlightedStepKey = key;
        setTimeout(() => { try { el.scrollIntoView({ block:'center', inline:'nearest' }); } catch (err) {} }, 30);
      }
    }

    const v33NormalizeStateBase = normalizeState;
    normalizeState = function() { v33NormalizeStateBase(); v33EnsureState(); };

    const v33RenderMainBase = renderMain;
    renderMain = function() {
      if (state.view === 'navDrills') return renderNavigationDrillsPage();
      return v33RenderMainBase();
    };

    renderSidebar = function() {
      return `
        <nav class="sidebar">
          <h4>Workspace</h4>
          ${navItem('dashboard','▦','Home dashboard')}
          ${navItem('campaigns','▤','Campaign manager')}
          ${navItem('create','＋','Create campaign')}
          ${navItem('reports','▧','Reports')}
          ${navItem('bulk','⇪','Bulk operations')}
          <h4>Assets</h4>
          ${navItem('products','◫','Products')}
          ${navItem('creative','◇','Creative assets')}
          ${navItem('stores','⌂','Stores')}
          <h4>Training</h4>
          ${navItem('missions','◎','Training missions')}
          ${navItem('navDrills','☑','Guided drills')}
          ${navItem('navigation','↳','Navigation map')}
          ${navItem('trainer','▣','Trainer dashboard')}
          ${navItem('integrity','✓','Integrity center')}
          ${navItem('docs','☰','Documentation')}
          ${navItem('glossary','?','PPC glossary')}
          ${navItem('settings','⚙','Simulator settings')}
          <div class="sidebar-footer">
            Built for role-play training. Start Guided drills for click-by-click route scoring before live-account work.
          </div>
        </nav>`;
    };

    const v33RenderRightRailBase = renderRightRail;
    renderRightRail = function() { return v33RenderNavigationDrillRail() + v33RenderRightRailBase(); };

    const v33BindEventsBase = bindEvents;
    bindEvents = function() {
      v33BindEventsBase();
      const rootEl = $('#root');
      if (rootEl) {
        rootEl.removeEventListener('click', v33NavigationClickGate, true);
        rootEl.addEventListener('click', v33NavigationClickGate, true);
      }
      v33ApplyNavigationDrillHighlight();
    };

    const v33HandleActionBase = handleAction;
    handleAction = function(e, action, el) {
      if (['startNavDrill','stopNavDrill','skipNavStep','restartNavDrill'].includes(action)) {
        e.stopPropagation();
        if (action === 'startNavDrill') v33StartNavigationDrill(el.dataset.id);
        if (action === 'stopNavDrill') v33StopNavigationDrill();
        if (action === 'skipNavStep') v33SkipNavigationStep();
        if (action === 'restartNavDrill') {
          const active = v33ActiveNavigationDrill();
          if (active) v33StartNavigationDrill(active.id);
        }
        return;
      }
      v33HandleActionBase(e, action, el);
    };

    const v33RenderNavigationMapBase = renderNavigationMap;
    renderNavigationMap = function() {
      return `${pageTitle('Navigation map', 'Teach VAs where to go before they memorize what to do. This page maps the ads console operating routes.', '<button class="btn primary" data-view="navDrills">Start guided drills</button>')}
        <div class="nav-map">
          ${mapNode('1. Campaign manager', 'Filter by ad type, status, date range, portfolio, and campaign name.', 'Campaigns table')}
          ${mapNode('2. Campaign detail', 'Open a campaign to inspect overview, ad groups, targets, search terms, negatives, placements, and history.', 'Breadcrumb drill')}
          ${mapNode('3. Search terms', 'Find converting terms to harvest and waste terms to negate. Mainly SP and SB work.', 'Optimization drill')}
          ${mapNode('4. Targeting', 'Adjust keyword, product, category, and audience target bids or pause poor performers.', 'Bid drill')}
          ${mapNode('5. Negative targeting', 'Add exact, phrase, or product negatives from reports and campaign review.', 'Waste control')}
          ${mapNode('6. Budget rules', 'Create schedule or performance rules during events, promos, or strong ROAS periods.', 'Scaling control')}
          ${mapNode('7. Creative assets', 'Review SB and SD assets: headline, logo, destination, image, video.', 'Creative QA')}
          ${mapNode('8. Reports', 'Export reports and convert data into actions. No spreadsheet goblin mode required, but it helps.', 'Report drill')}
        </div>
        <div class="card pad" style="margin-top:14px;"><div class="card-title"><h2>Guided route training</h2><span>V3.3</span></div><p class="muted">Guided drills highlight the exact next click, block wrong clicks, score misses, and write results to the trainer dashboard log.</p><div class="pill-row"><button class="btn primary" data-view="navDrills">Open guided drills</button><span class="pill orange">Wrong-click feedback</span><span class="pill green">Trainer scoring</span><span class="pill active">Path memory</span></div></div>`;
    };

    const v33RenderDashboardBase = renderDashboard;
    renderDashboard = function() {
      const html = v33RenderDashboardBase();
      return html.replace('Navigation drill</strong>', 'Navigation drill</strong>').replace('Use the left menu: Campaign manager → campaign row → Search terms → action buttons.', 'Use Guided drills for highlighted click paths: Campaign manager → campaign row → Search terms → action buttons.');
    };

    const v33RenderTrainerDashboardBase = renderTrainerDashboard;
    renderTrainerDashboard = function() {
      const html = v33RenderTrainerDashboardBase();
      const results = (state.navigationDrillResults || []).slice().reverse().slice(0, 8);
      const block = `<div class="card pad" style="margin-top:14px;"><div class="card-title"><h2>Navigation drill results</h2><span>${results.length}</span></div>${results.length ? `<div class="table-wrap"><table class="drill-result-table"><thead><tr><th>Completed</th><th>Drill</th><th>Score</th><th>Mistakes</th><th>Skips</th></tr></thead><tbody>${results.map(r=>`<tr><td>${fmt.date(r.completedAt)}</td><td>${safe(r.title)}</td><td><strong>${r.score}%</strong></td><td>${r.mistakes}</td><td>${r.skips}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No guided navigation drill results yet.</p>'}</div>`;
      return html + block;
    };

    const v33ExportTrainerLogBase = exportTrainerLog;
    exportTrainerLog = function() {
      const rows = [['Trainee','Time','Action','Detail','Grade','Feedback']].concat(state.actionLog.map(a => [a.trainee || state.traineeName, a.time, a.type, a.detail, a.quality || '', a.feedback || '']));
      const drillRows = [['Trainee','Completed','Drill','Score','Mistakes','Skips']].concat((state.navigationDrillResults || []).map(r => [r.trainee, r.completedAt, r.title, r.score, r.mistakes, r.skips]));
      const text = v31Csv(rows) + '\n\nNavigation Drill Results\n' + v31Csv(drillRows);
      downloadText('ppc-simulator-trainer-log-v3.3.csv', text, 'text/csv');
      logAction('export_trainer_log', 'Trainer log with navigation drills exported', 'good');
      toast('Trainer log exported with navigation drill results.', 'good');
    };

    renderDocumentation = function() {
      return `${pageTitle('Documentation', 'Living product notes for the Amazon PPC Training Simulator V3.3.', '<button class="btn primary" data-action="exportDocs">Export docs markdown</button>')}
        <div class="grid grid-2">
          <div class="card pad doc-section"><h2>What this simulator trains</h2><ul><li>SP setup, automatic target groups, manual keyword/product targeting, negatives, harvesting, placements, budgets, and reports.</li><li>SB setup with Product Collection, Store Spotlight, Video, creative fields, destinations, review states, and targeting.</li><li>SD setup with contextual targeting, views remarketing, purchases remarketing, creative, products, and audience logic.</li><li>Campaign manager navigation, guided click paths, report interpretation, bulk operations, Integrity Center, and trainer certification.</li></ul></div>
          <div class="card pad doc-section"><h2>What changed in V3.3</h2><ul><li>Added Guided drills as a dedicated training module.</li><li>Added click-by-click route instructions with highlighted targets.</li><li>Added wrong-click blocking, mistake counts, skip counts, and scoring.</li><li>Added navigation drill results to the Trainer dashboard and trainer log export.</li><li>Added guided route coverage for SP search terms, SP placements, SB creative review, SD audience targeting, and report workflows.</li><li>Kept V3.2 relationship hardening, Integrity Center QA, bulk validation, reports, and scenario generation intact.</li></ul></div>
          <div class="card pad doc-section"><h2>Recommended training path</h2><ul><li>Day 1: Guided drills, navigation map, glossary, product readiness, and campaign filters.</li><li>Day 2: SP Auto, Manual Keyword, and Product Targeting builds.</li><li>Day 3: Search term harvesting, negative exact, negative phrase, and bid reviews.</li><li>Day 4: SB creative formats, Store destinations, and video requirements.</li><li>Day 5: SD contextual and remarketing setup, plus why SD is not a search-term workflow.</li><li>Day 6: Reports, bulk ops, Integrity Center, trainer review, and certification.</li></ul></div>
          <div class="card pad doc-section"><h2>Known limits</h2><ul><li>No real Amazon connection, Seller Central access, or live bulk upload.</li><li>No multi-user backend. Progress saves in the local browser.</li><li>Metrics are simulated for training decisions, not forecasting.</li><li>The UI is inspired by Amazon Ads Console workflows but is not an exact clone.</li></ul></div>
        </div>`;
    };

    exportDocs = function() {
      const md = `# Amazon PPC Training Simulator V3.3 Documentation\n\n## Purpose\nTrain virtual assistants on Amazon PPC navigation and operations without Seller Central or Amazon Ads access.\n\n## V3.3 headline addition\nGuided navigation drills now provide click-by-click path training. The simulator highlights the next correct element, blocks wrong clicks, records mistakes, supports skips, calculates a navigation score, and writes results to the Trainer dashboard.\n\n## Guided drill coverage\n1. SP Search terms waste control: Campaign manager -> SP Auto campaign -> Search terms -> Negative exact -> Negative targeting verification.\n2. SP placement controls: Campaign manager -> Manual SP campaign -> Placements -> Save -> Change history.\n3. SB creative review: Creative assets -> SB Video campaign -> Overview -> Targeting.\n4. Reports workflow: Reports -> Request report -> Copy report rows.\n5. SD audience targeting: Campaign manager -> SD Views Remarketing -> Targeting -> Reports.\n\n## Object model\n- Portfolio -> Campaign\n- Campaign -> Ad group\n- Ad group -> Product ad\n- Ad group -> Target\n- Campaign/ad group -> Negative\n- Target -> Search term row when a match exists\n- Campaign -> Creative for SB and SD\n- Campaign -> Budget rule\n- Campaign -> Structured change history\n- Navigation drill -> Ordered step list -> Trainer result log\n\n## V3.3 improvements\n- Dedicated Guided drills page.\n- Active drill card in the right rail.\n- Highlighted current click target.\n- Wrong-click blocking and feedback.\n- Step skip support for trainer-led sessions.\n- Trainer dashboard drill results.\n- Trainer CSV export includes navigation drill results.\n- Documentation updated for the new training path.\n\n## QA checklist\n- Start each guided drill from the Guided drills page.\n- Confirm the highlighted target appears.\n- Click a wrong element and confirm the click is blocked and logged.\n- Complete the drill and confirm the score appears in Trainer dashboard.\n- Run Integrity Center after bulk operations, scenario generation, duplicate campaigns, or imports.\n\n## Safety limit\nThis simulator is a sandbox. It does not connect to Amazon systems, Seller Central, Amazon Ads, or live accounts. Metrics are simulated and intended for training only.\n`;
      downloadText('amazon-ppc-simulator-v3.3-docs.md', md, 'text/markdown');
      logAction('export_docs', 'V3.3 documentation exported', 'good'); toast('Documentation exported.', 'good');
    };

    const v33RenderSettingsBase = renderSettings;
    renderSettings = function() {
      return `${pageTitle('Simulator settings', 'Reset data, toggle hints, and control training difficulty.', '')}
        <div class="grid grid-2">
          <div class="card pad"><div class="card-title"><h2>Training controls</h2><span>Local browser state</span></div><label class="pill"><input type="checkbox" id="hintToggle" ${state.showHints?'checked':''} /> Show coach hints</label><br/><br/><button class="btn danger" data-action="resetAll">Reset simulator data</button></div>
          <div class="card pad"><div class="card-title"><h2>Build notes</h2><span>Version ${APP_VERSION}</span></div><p class="small-copy">This static simulator saves progress in your browser with LocalStorage. V3.3 adds guided navigation drills with target highlighting, wrong-click blocking, scoring, and trainer results, while keeping V3.2 relationship hardening and QA intact.</p></div>
        </div>`;
    };

    const v33ResetAllBase = resetAll;
    resetAll = function() {
      v33ResetAllBase();
      state.activeNavigationDrillId=''; state.navigationDrillStep=0; state.navigationDrillMistakes=0; state.navigationDrillSkips=0; state.navigationDrillLog=[]; state.navigationDrillResults=[]; state.navigationDrillStartedAt=''; state.navigationDrillCompleted=false;
      render();
    };

    v33EnsureState();


    if (!state.bulkInput || !state.bulkInput.includes('entity,operation')) state.bulkInput = V31_BULK_TEMPLATE;

    render();
  
  </script>
</body>
